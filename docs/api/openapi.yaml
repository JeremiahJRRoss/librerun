# LibreRun API specification — GENERATED FILE (blueprint B10, S1).
# Regenerate after route changes with the script that keeps this header:
#   python scripts/export_openapi.py
# It writes the file rather than printing, because queue-only logging
# owns stdout since S4 and a redirected print() lands in the log
# pipeline, leaving the file empty.
#
# The platform noun is `run` (decision L18): /runs is the only spelling
# served; the /cases alias was deleted in S1 and answers 404. run_id /
# run_number are authoritative; the case_id / case_number duplicates
# below are marked deprecated and go at v1.1.
openapi: 3.1.0
info:
  title: LibreRun
  version: 1.1.0-beta.1
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/google:
