      properties:
        set:
          type: boolean
          title: Set
        fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Fingerprint
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        updated_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Updated By
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
      type: object
      required:
      - set
      title: SecretRow
      description: 'One place a value may come from. ``fingerprint`` is a keyed,

        12-character digest under the store key, ``None`` while unset and for a

        row no configured key opens; ``updated_by`` of the default row is shown

        to platform admins alone. The environment row carries ``set`` alone:

        the platform neither fingerprints nor stamps it.'
    SecretSettingState:
      properties:
        set:
          type: boolean
          title: Set
          description: True when the encrypted secrets store holds a row for this
            setting (source runtime or unreadable); updated_at and updated_by describe
            that row
        source:
          type: string
          enum:
          - runtime
          - env
          - unset
          - unreadable
          title: Source
          description: 'runtime: the store''s row, which a configured key opens; env:
            no row, the environment variable''s value applies; unset: neither; unreadable:
            the store holds a row no configured key opens (a lost or rotated key)
            and the environment applies meanwhile — Replace re-encrypts it under the
            current key, or Clear it'
        fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Fingerprint
          description: A keyed digest of the value under the store key, 12 hex characters;
            null unless source is runtime
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
          description: When the row was last set
        updated_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Updated By
          description: Who last set the row
      type: object
      required:
      - set
      - source
      title: SecretSettingState
      description: 'What the API shows of a secret setting (K6, L31): where its value

        comes from and a fingerprint — never the value.'
    SettingResponse:
      properties:
        key:
          type: string
          title: Key
          description: Unique setting identifier
        value:
          title: Value
          description: Effective value (DB override or default); always null for a
            secret
        default_value:
          title: Default Value
          description: Value used when no DB override exists; always null for a secret
        value_type:
          type: string
          enum:
          - string_list
          - int
          - bool
          - string
          - secret
          title: Value Type
          description: Expected value shape; drives UI editor selection
        description:
          type: string
          title: Description
          description: Human-readable explanation
        is_default:
          type: boolean
          title: Is Default
          description: True when no DB override is set
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
          description: Timestamp of the last override write
        updated_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Updated By
          description: User who last wrote the override
        secret:
          anyOf:
          - $ref: '#/components/schemas/SecretSettingState'
          - type: 'null'
          description: 'A secret setting''s state (write-only: never its value); null
            for other types'
      type: object
      required:
      - key
      - value
      - default_value
      - value_type
      - description
      - is_default
      title: SettingResponse
      description: Effective value of a runtime-tunable application setting.
