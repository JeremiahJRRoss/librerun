    put:
      tags:
      - agents
      summary: Update Settings Endpoint
      description: 'Save this tenant''s settings: ``[{key, value}]``, ``null`` for
        the

        default (K5a).


        Every value is held to the type its setting declares before anything

        is written, and one refusal — a key the agent does not declare, a

        value its type refuses — answers ``400 setting ''<key>'': …`` and writes

        nothing. A value equal to the default is stored as no row at all

        (D17). The deprecated protocol path takes the same body and makes one

        ``update_settings({key: value})`` call, ``null`` sending the declared

        default. The audit row names the keys whose value changed.'
      operationId: update_settings_endpoint_api_v1_agents__agent_id__config_settings_put
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AgentSettingUpdate'
              title: Payload
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
