                $ref: '#/components/schemas/AgentSecretsList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/secrets/{scope}/{name}:
    put:
      tags:
      - agents
      summary: 'Set a tool secret''s value: this tenant''s, or every tenant''s default'
      description: '``{value}`` → ``200`` and the name''s state. The body is read
        by hand,

        so no refusal can echo it, and the value is stored stripped. Audited

        ``{surface: agent_secrets, agent_id, name, scope, action: set |

        replace}`` without the value; the row and its audit commit together,

        and only then is every process told.'
      operationId: set_agent_secret_api_v1_agents__agent_id__secrets__scope___name__put
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: scope
        in: path
        required: true
        schema:
          type: string
          title: Scope
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSecretState'
        '400':
          description: 'secret_value_invalid: the body is not {value} with 8 to 4096
            characters'
        '403':
          description: 'platform_admin_only: the default (scope agent) is a platform
            admin''s'
        '404':
          description: unknown agent, or secret_not_declared
        '422':
          description: 'secret_scope_invalid: the scope is not tenant or agent'
        '503':
          description: secrets_store_unconfigured or secrets_store_key_shared
    delete:
      tags:
      - agents
      summary: Clear a tool secret's value; the next source in the order serves
      description: '``204``, whether or not there was a row — idempotent, and it needs
        no

        store key, so a row sealed under a lost key can still be cleared.

        Audited ``{…, action: clear}``; committed, then every process told.'
      operationId: clear_agent_secret_api_v1_agents__agent_id__secrets__scope___name__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: scope
        in: path
        required: true
        schema:
          type: string
          title: Scope
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '204':
          description: Successful Response
        '403':
          description: 'platform_admin_only: the default (scope agent) is a platform
            admin''s'
        '404':
          description: unknown agent, or secret_not_declared
        '422':
          description: 'secret_scope_invalid: the scope is not tenant or agent'
