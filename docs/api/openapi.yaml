      description: 'Deprecated (blueprint S2): the demo agent''s own view of the parked
        output. `GET /runs/{run_id}/approval` serves every agent''s — read `summary`
        and `payload` there. Kept for one release, removed at v1.1.'
      operationId: get_refined_statement_api_v1_runs__run_id__refined_statement_get
      deprecated: true
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '202':
          description: 'The run is still working (`submitted` / `refining`): `{"status":
            ...}` only. Poll again.'
          content:
            application/json:
              schema:
                type: object
                properties:
