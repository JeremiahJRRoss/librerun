      summary: Get Approval
      description: 'What the approval view renders, for every agent (blueprint S2).


        ``phase`` is the manifest phase whose output is parked, ``payload``

        that output in full, and ``summary`` the string the manifest''s

        ``ui.approval.summary_path`` names inside it (or the first string in

        it) — what the view shows and offers for editing. While the run is

        still working the answer is ``202`` with ``status`` alone.'
      operationId: get_approval_api_v1_runs__run_id__approval_get
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '202':
          description: 'The run is still working (`submitted` / `refining`): `status`
            only — `phase`, `payload` and `summary` are null. Poll again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
