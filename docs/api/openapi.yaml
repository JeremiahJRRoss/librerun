      description: 'The gateway''s own report (``gateway_status``): each provider-key
        name

        with its aliases, where its key comes from, a stored key''s fingerprint

        and state — ``pending`` while a key set here waits for the gateway —

        and the public key the browser seals a new one to. Never a key.'
      operationId: list_providers_api_v1_admin_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersStatus'
      security:
      - HTTPBearer: []
  /api/v1/admin/providers/{name}/key:
    post:
      tags:
      - admin
      - admin-settings
      summary: Store a provider key sealed to the gateway, for the gateway to adopt
      description: '``202 {name, row: pending}``: the blob is stored as the ``gateway``

        row ``provider.<name>``; the gateway adopts it within seconds, and

        the list then shows its fingerprint. A raw key is refused ``400

        plaintext_refused`` and nothing is written.'
      operationId: set_provider_key_api_v1_admin_providers__name__key_post
      security:
      - HTTPBearer: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderKeyUpdate'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderKeyAccepted'
        '400':
          description: 'plaintext_refused: the body is not one sealed 3072-bit block'
        '404':
          description: unknown_provider
        '503':
          description: 'secrets_store_unconfigured: the gateway published no public
            key'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - admin
      - admin-settings
      summary: Remove a stored provider key; the gateway's environment serves that
        provider again
      description: 'The stored row goes, whatever its state, and the gateway drops
        the

        key at its next reload. Audited ``{surface, provider, action: clear}``.'
      operationId: clear_provider_key_api_v1_admin_providers__name__key_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '204':
          description: Successful Response
        '404':
          description: unknown_provider
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
