  frontend-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        # `npm ci` and not `npm install`, so the lockfile is what is
        # tested and a drifting lockfile fails here rather than being
        # rewritten in place.
        run: npm ci

      - name: The production build
        # `next build` type-checks and lints the app's modules. It does not
        # type-check the tests under `__tests__/`, and no step here does.
        run: npm run build

      - name: The build really produced the app
        # `npm run build` runs whatever `scripts.build` says. It does not
        # promise that Next ran. Measured: with `"build": "true"` the step
        # exits 0 and leaves no `.next` at all, so a package.json change
        # could remove ALL type-checking and linting from CI and every
        # tick would stay green (Codex round 17).
        #
        # The suite half of this job already has this property and that is
        # why it was never at risk: `npm test` must write a report that
        # the next step then reads, so a no-op `scripts.test` fails with
        # `cannot read frontend-suite.xml` — measured too. This gives the
        # build half the same shape: demand the artifact, not the exit
        # code.
        #
        # `standalone/server.js` rather than merely `.next`, because
        # `output: "standalone"` in next.config.mjs is what compose and
        # the Dockerfile actually deploy. Asserting the artifact the
        # deployment needs also catches that setting being dropped.
        run: |
          set -euo pipefail
          test -f .next/BUILD_ID
          test -f .next/standalone/server.js
          echo "build id: $(cat .next/BUILD_ID)"

      - name: The frontend suite
        # A machine-readable report, for the same reason the backend half
        # produces one. vitest's exit code distinguishes "no test files"
        # from "some test files" and nothing finer, so a `vitest.config`
        # narrowed from six files to one, or files deleted, still exits 0
        # while `next build` happily compiles the missing assertions away
        # (Codex P2). That is the backend's `tests > 0` hole wearing
        # different clothes, and I had argued the exit code was enough.
        run: npm test -- --reporter=junit --outputFile=frontend-suite.xml

      - name: The frontend suite must have RUN, not shrunk
        # 79 is measured on the merge result, for the reason spelled out
        # at the backend baseline above. The same script and the same
        # floor semantics as that half — including the same drift: 65
        # was measured on a branch, main then added a 14-test file, and
        # this job has been reporting `tests=79 ... (baseline 65)` and
        # passing ever since. Negative-tested by excluding one 3-test
        # file (79 -> 76): 65 accepted it, 79 rejects it.
        #
        # 103 is S7: the run page's logic (the timeline, the labels, the
        # model column's E5 rule, the sanitized error, the polling policy,
        # the duration) and the scan proving no component keys on an
        # agent id, measured the same way.
        #
        # 106 is K blueprint A1: the Source link's three cases in
        # `sourceLink.test.ts`, rendered with React's own `createRoot` and
        # `act` in jsdom — the link from /meta in a new tab (red with `rel`
        # dropped), nothing until /meta answers, nothing for a URL that is
        # not http(s). Read off this job's report on the A1 pull request.
        #
        # 113 is K4b: the first component tests (the agent page's tabs,
        # the scope chip, the settings page's 403, the hub's links), which
        # the vitest include reaches only as `src/**/__tests__/**`.
        #
        # 116 is A1 and K4b on one tree, measured on a run of the merge
        # result: A1's three and K4b's ten over 103.
        #
        # 118 is that tree and the tab shell's two reload cases, found on a
        # review of the merge: a Save's reload answering for an agent the
        # page has left is dropped, and does not hold up the next agent's
        # own answer.
        #
        # 131 is K5a: the Settings tab's seven cases
        # (`SettingsPanel.test.tsx`) and the six of its payload
        # (`settingsPayload.test.ts`).
        #
        # 139 is K6: the settings page's secret row, the eight cases of
        # `secretSetting.test.tsx`.
        #
        # 152 is K7: the six of `sealing.test.ts`, which hold the browser's
        # seal and fingerprint to `openssl`, and the seven of
        # `ModelProviders.test.tsx`, the D19 refusal among them.
        #
        # 164 is T2: the twelve of `CertificatesPanel.test.tsx` — each
        # need's action, no key on the page, and no change with the edge
        # off.
        #
        # 165 is K8b: the Secrets tab's eleven (`SecretsPanel.test.tsx`),
        # the `agent` chip's case in `ScopeChip.test.tsx` and the tab's
        # availability in `AgentPageTabs.test.tsx`.
        #
        # 177 is T2 and K8b on one tree, measured on a run of the merge
        # result: T2's twelve and K8b's thirteen over 152.
        #
        # 205 is K9: the four of `DeploymentPanel.test.tsx`, the ten of
        # `KeysPanel.test.tsx` (five for Codex's two rounds: a value shown
        # before the refresh answers, none on a page that moved on, a
        # grace that is not a whole number refused, the actions held until
        # the rows catch up, and no older read setting the rows), the five
        # of `scopeChips.test.tsx`, the four of `platformOnly.test.tsx`, the
        # four of `adminHub.test.tsx` and the Keys case in
        # `AgentPageTabs.test.tsx`, over 177.
        run: python3 ../scripts/assert_suite_ran.py frontend-suite.xml 205 frontend
