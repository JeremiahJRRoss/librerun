# The two largest suites in the tree, neither of which CI has ever run
# (blueprint S5-0).
#
# Measured on main at eb3f2e2 before this file existed:
#
#   backend   1024 tests collected; CI named six files covering 168 of
#             them across adapter-battery, chassis-zero-agents and
#             database-parity. 856 had never run in CI.
#   frontend  6 test files, 65 tests, plus `next build`. NOTHING ran
#             them — no workflow mentions npm, vitest or next.
#
# So the chassis suite was witnessed only by whoever remembered to run it
# locally, and a contributor's pull request could go green on every check
# in the repo while breaking it. That is the CLAUDE.md failure mode
# stated exactly: a gate that reports success by not looking.
name: unit-suites

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
      # Both jobs certify their reports with this script, and it lives
      # outside every pattern above. Round 2 put it there: while the
      # assertion was inline in this file `.github/workflows/**` covered
      # it, and extracting it moved it out of its own trigger's reach —
      # so a pull request weakening the shared guard would skip both
      # suites and merge unexercised (Codex round 3). An identity holds
      # only while its precondition does.
      - "scripts/assert_suite_ran.py"
      # The backend suite READS the gateway's pair and its Dockerfile
      # (A3): test_requirements_lock.py holds the lock to its source, every
      # pin to its hashes and the image to the lock alone, so a pull request
      # touching only one of them must run the suite that checks it.
      - "services/gateway/requirements.txt"
      - "services/gateway/requirements.lock.txt"
      - "services/gateway/Dockerfile"
      # The backend suite IMPORTS the refresh script, and through it the
      # guard, and the script writes THIRD_PARTY.md's image rows (A3):
      # test_refresh_image_digests.py holds the procedure R14's digests
      # move by, so a pull request touching only one of them must run the
      # suite that checks it. Found by the dependency guard.
      - "scripts/refresh_image_digests.py"
      - "scripts/check_dependency_identity.py"
      - "THIRD_PARTY.md"
      # The backend suite READS this page: the CLI test asserts that
      # `--timeout`, which the guide tells authors to raise, exists on
      # the parser. That coupling is the point of the test, so a pull
      # request editing only the page must run the job that checks it —
      # otherwise the claim and the flag can drift apart with a green
      # board. Found by the dependency guard, not by review.
      - "docs/authoring/Container_Agents.md"
      # Same coupling, found the same way: the example suite asserts that
      # every `node:` event the LangGraph quickstart shows is a node the
      # example actually declares. Without this path a pull request could
      # rename a node in the page alone and merge green, which is the
      # defect the guard exists to catch, skipped rather than passed.
      # (The page moved to docs/authoring/ at S6.)
      - "docs/authoring/LangGraph.md"
      # The CLI and its templates (blueprint S6): the backend suite
      # imports `cli/src/librerun` off sys.path and renders every
      # template through the chassis's own manifest loader and both
      # batteries, so a template edited alone must run the job that
      # checks it.
      - "cli/**"
      # The manifest field reference and its generator: the suite
      # regenerates the page from the models and fails when the
      # committed one differs, so an edit to either alone must run it.
      - "scripts/export_manifest_reference.py"
      - "docs/authoring/Manifest.md"
      # Read by the CLI suite: the hour path's commands must be commands
      # the parser accepts.
      - "docs/authoring/Quickstart.md"
      # The other three pages `tests/test_authoring_pages_match_the_gateway.py`
      # reads (blueprint S4b). It holds all four to what S4a shipped —
      # the pre-S4a phrases absent, the gateway and the run-token header
      # present — so a pull request that puts "an agent holds its own
      # keys" back into one page alone must run the job that catches it.
      # The dependency guard named two of the three; `Agents_Design.md`
      # is here because the rule governs it just as literally, and the
      # guard reads pathlib joins rather than the tuple the module
      # iterates. Covering only what a heuristic can see is how a filter
      # gets a hole the next reader cannot explain.
      - "docs/authoring/Agents_Design.md"
      - "docs/authoring/Run_Contract_v1.md"
      - "docs/authoring/SDK.md"
      # Cross-tree inputs the chassis suite READS rather than imports —
      # each a pathlib join inside a test, so no import walker would ever
      # see them. Measured by censusing the suite (Codex round 5 named
      # three; there are seven).
      #
      # The two env examples joined with K1: Gate P
      # (`backend/tests/test_secret_partition.py`) reads `.env.example`
      # to assert the root file declares no provider key, and
      # `gateway.env.example` as the declaration of what the gateway's
      # env_file delivers. Without these lines a pull request putting a
      # provider key back into `.env.example` would not run the job that
      # catches it — the gate would report success by not running.
      - ".env.example"
      - "gateway.env.example"
      # The other two env examples, and the router configs, joined with
      # K4: `backend/tests/test_env_example_classes.py` reads every
      # committed `*.env.example` and every `config/*.yaml`, and holds
      # them to "each variable anything reads is written down in exactly
      # one file under exactly one class". Without these lines a pull
      # request that adds a variable to a Vector overlay, or moves a
      # token between the two observability files, would not run the job
      # that checks it — the classes gate would report success by not
      # running, which is the shape this file already documents twice.
      - "observability.env.example"
      - "observability-traces.env.example"
      - "config/**"
      # …and docs/platform/Install.md, whose four class tables the same gate holds
      # to those files line for line. A row edited alone must run the job
      # that compares it.
      - "docs/platform/Install.md"
      # …and the gateway's settings model, which the same gate IMPORTS to
      # derive what that process reads. Not a pathlib join this time: a
      # real import of a sibling service, put on sys.path the way
      # conftest.py puts the SDK there, so it is invisible to a filter
      # that thinks the backend suite lives under backend/. Named by
      # file rather than by `services/gateway/**`, which would run this
      # 20-minute job on every gateway change; the derived guard in
      # test_adapter_kit.py demands the next import's path in turn, so
      # precision here costs nothing later. It found this one.
      - "services/gateway/gateway/config.py"
      - "agents.compose.yaml"
      - "compose.sh"
      - "compose.yaml"
      - "docs/api/openapi.yaml"
      - "scripts/export_openapi.py"
      - "scripts/librerun_smoke.py"
      # The element-expression guard: the suite loads it and asserts on
      # the decisions it makes without running pytest — containment, the
      # NameError verdict, the exit codes that are not a verdict, the
      # splice's refusal to edit a position the bytes disagree with. A
      # pull request weakening any of those would otherwise match no
      # pattern here and merge with the cases that pin them unrun.
      - "scripts/element_expression_coverage.py"
      # The backend suite RUNS this one, in a scratch tree, to check that
      # every agent gets a gateway key and that an .env written before an
      # agent existed is topped up rather than left to stop `up` (S5-R).
      # Found by the dependency guard, not by review.
      - "scripts/demo.sh"
      # backend/tests/test_obs_vendor_contract.py loads this module from
      # the repository root and drives every rule in it with an injected
      # violation (blueprint S7a). Without this line a pull request
      # weakening the checker the obs-vendors contract tests stand on
      # would match no filter here and merge with its own tests unrun.
      - "scripts/obs_vendor_contract.py"
      # Read by backend/tests/test_secret_sweep.py, which is Gate S's own
      # gate: the floors that stop "found nothing" meaning "looked at
      # nothing". A change to the sweep that weakened them would not
      # run the test that exists to catch it.
      - "scripts/secret_sweep.py"
      # The table gate (issue #82). `backend/tests/test_check_tables.py`
      # executes the script itself, so a pull request weakening the gate
      # has to run the job; it matched no pattern here until the
      # dependency guard found the hole.
      - "scripts/check_tables.py"
      # The other two tracked-file listings, and the suite that drives
      # them. `backend/tests/test_tracked_listing.py` loads each script
      # by PATH at runtime, so the dependency guard's import walk cannot
      # derive this coupling — the paths are here because the coupling
      # is real, not because a guard pointed at it. A pull request
      # editing either script alone would otherwise skip the job that
      # holds it to reading each tracked path once.
      - "scripts/check_links.py"
      - "scripts/check_single_version.py"
      # The release notes and the section they are cut from (S10).
      # `backend/tests/test_release_notes.py` loads the script by PATH and
      # runs it against the real CHANGELOG.md, so no import walk sees the
      # coupling; the paths are here because it is real. A pull request
      # that drops the frozen section's highlights, or puts `<owner>` back
      # into the footer, would otherwise merge with the cases unrun.
      - "scripts/release_notes.py"
      - "CHANGELOG.md"
      # Source access (K blueprint A1): `test_source_access.py` reads the
      # public repository's URL out of README.md's clone line and the
      # licence scope map's default out of REUSE.toml. Both are opened by
      # a pathlib join, which no guard here derives a path from, so a pull
      # request that moved either alone would skip the cases that hold
      # `/api/v1/meta` to them.
      - "README.md"
      - "REUSE.toml"
      # The release version file (K6). `backend/tests/test_demo_store_key.py`
      # imports `librerun._stack` by its absolute name, to drive the demo
      # store-key top-up directly, and `_stack.release_version` reads the
      # root `VERSION` by a pathlib join. Found by the dependency guard on
      # K6's own pull request: until then only relative imports reached
      # `_stack`, which the walk does not follow, so this coupling had
      # never been derived.
      - "VERSION"
      # The whole SDK source: backend/tests/conftest.py puts it on
      # sys.path and four test modules import it. `_mcp.py` alone was
      # here only because one test names that path as a string — the
      # modules actually imported were invisible (Codex round 6).
      - "sdk/python/librerun-agent/src/**"
      # Root-level pytest configuration, which no derived rule can
      # reach: the dependency guard below demands coverage for files
      # that EXIST, and the hazard here is a file's ADDITION. pytest
      # resolves its configfile by walking UP from the invocation
      # directory, so one added at the repo root takes effect for
      # `cd backend && pytest` while matching no pattern above.
      # Measured: a root pytest.ini setting `python_files` takes the
      # backend suite from 1051 collected to 0 — and the job that
      # would have caught it does not run, on the pull request or on
      # the push to main. The seven filenames are pytest's own
      # `config_names`, read out of its compiled code rather than
      # retyped (Codex round 14). `conftest.py` is the eighth: adding
      # a root ini moves rootdir from backend/ to the repo root, which
      # is what makes a root conftest load at all. Measured both ways,
      # against a conftest known to load, because the first attempt
      # said "neither" and the positive control said the attempt was
      # broken.
      - "pytest.toml"
      - ".pytest.toml"
      - "pytest.ini"
      - ".pytest.ini"
      - "pyproject.toml"
      - "tox.ini"
      - "setup.cfg"
      - "conftest.py"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
      - "scripts/assert_suite_ran.py"
      # The backend suite READS the gateway's pair and its Dockerfile
      # (A3): test_requirements_lock.py holds the lock to its source, every
      # pin to its hashes and the image to the lock alone, so a pull request
      # touching only one of them must run the suite that checks it.
      - "services/gateway/requirements.txt"
      - "services/gateway/requirements.lock.txt"
      - "services/gateway/Dockerfile"
      # The backend suite IMPORTS the refresh script, and through it the
