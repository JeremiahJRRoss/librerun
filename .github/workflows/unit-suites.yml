      # test_refresh_image_digests.py holds the procedure R14's digests
      # move by, so a pull request touching only one of them must run the
      # suite that checks it. Found by the dependency guard.
      - "scripts/refresh_image_digests.py"
      - "scripts/check_dependency_identity.py"
      - "THIRD_PARTY.md"
      # The backend suite READS this page: the CLI test asserts that
