permissions:
  contents: read

jobs:
  backend-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Both services, because the suite needs both and MEASURED rather
    # than assumed: with neither reachable it is `46 failed, 951 passed,
    # 27 skipped`. The 46 say a serviceless job would simply be red; the
    # 27 are the more interesting number, because those would have passed
    # by not running.
    services:
      postgres:
        image: docker.io/library/postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: librerun
          POSTGRES_PASSWORD: ci_only_throwaway
          POSTGRES_DB: librerun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U librerun -d librerun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: docker.io/valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://librerun:ci_only_throwaway@localhost:5432/librerun
      PGURL: postgresql://librerun:ci_only_throwaway@localhost:5432/librerun
      REDIS_URL: redis://localhost:6379/0
      # The same refusal database-parity.yml makes, for the same reason:
      # a test that skips when its database is absent is a test that can
      # pass by not running. With this set, the seven `no database at
      # DATABASE_URL` skips become errors — measured, by pointing
      # DATABASE_URL at a dead port with the flag on.
      LIBRERUN_REQUIRE_DB: "1"
      LOG_STDERR_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock.txt
            backend/adapters/requirements.lock.txt
            backend/adapters/build-constraints.txt

      - name: Install the chassis and the adapter
        # The adapter as well as the chassis, and that is not incidental.
        # LangGraph is deliberately absent from requirements.txt, and
        # three test modules — test_adapter_kit_langgraph.py,
        # test_langgraph_example_probe.py and test_langgraph_example_llm.py,
        # 64 tests between them — open
        # with a module-level `pytest.importorskip("langgraph")`. On a
        # runner with the chassis alone they SKIP, which the zero-skip
        # assertion below would then report as a failure forever.
        #
        # Installing the adapter is the fix rather than exempting those
        # modules, because an exemption list is a place for the next
        # optional module to hide.
        #
        # From the LOCKS, and in the image's own three steps. This job
        # collects 1049+ tests — by a wide margin the repository's largest
        # correctness gate — and the ranges are not what ships. Running it
        # on a freshly resolved tree means the versions in the image are
        # exercised by database-parity and chassis-zero-agents alone, so a
        # pin that breaks the suite could reach a release with every tick
        # green: a gate reporting success by not looking at the artifact.
        # The opposite question — does the DECLARED packaging still resolve
        # against current upstream — is adapter-battery.yml's, deliberately
        # and exclusively, and it is answered there on the ranges.
        #
        # PIP_CONSTRAINT is the image's line too: the adapter's PEP 517
        # build requirements resolve in an isolated environment that
        # --no-deps and -c both miss (Codex round 3).
        run: |
          pip install -r requirements.lock.txt
          PIP_CONSTRAINT=adapters/build-constraints.txt \
            pip install -r adapters/requirements.lock.txt
          PIP_CONSTRAINT=adapters/build-constraints.txt \
            pip install --no-deps ./adapters

      - name: The adapter must be importable
        # Fails loudly here rather than silently downgrading 64 tests to
        # skips further down.
        run: python -c "import langgraph, librerun_langgraph"

      - name: The spaCy model Presidio's NER stage needs
        # Blueprint S4c (gap H15). Not an optimisation and not optional:
        # since S4c the chassis FAILS CLOSED when the named-entity stage
        # cannot run — intake, the preview and the upload answer 503 and
        # the run boundary refuses — so a runner without this model runs
        # a suite against a platform that is refusing everything.
        #
        # Setting LIBRERUN_PII_ALLOW_DEGRADED here instead would turn the
        # suite green by turning the platform's default posture off, and
        # this job's largest value is that it exercises the default. It
        # is also the first time the backend suite has run with stage 3
        # ACTIVE at all, which is worth more than the download costs.
        run: |
          python -m spacy download en_core_web_lg
          python -c "import spacy; spacy.load('en_core_web_lg')"

      - name: Load the schema the suite expects
        # The postgres service starts EMPTY. The fixtures probe it with
        # `SELECT 1`, which an empty database answers happily, so the
        # suite proceeds and then fails on `relation "tenants" does not
        # exist` — and LIBRERUN_REQUIRE_DB does not catch it, because the
        # server IS reachable; that flag asks whether a database
        # answers, not whether it has any tables.
        #
        # Loading `db/schema.sql` is what a fresh container gets, which
        # is the same thing database-parity.yml and gateway.yml do. It is
        # psql rather than `alembic upgrade head` because measured: the
        # migration chain cannot build from nothing — from an empty
        # database it fails with `relation "users" does not exist` — so
        # the schema file comes first and alembic brings it to head.
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f db/schema.sql

      - name: Bring the schema to head
        run: python -m alembic upgrade head

      - name: The chassis suite
        run: python -m pytest -q --junitxml=backend-suite.xml

      - name: Keep the suite's report
        # The report is the record of what ran, and some tests write what
        # they measured into it: the loop-latency test's
        # `probe_window_worst_gap_s` and `whole_run_worst_gap_s` (#160) are
        # otherwise visible only on a local run. Kept on a red run too,
        # since that is the one worth reading. `path` is from the checkout
        # root: `working-directory` above applies to `run` steps only. The
        # name carries the attempt because a re-run keeps its run id and v4
        # refuses a second upload to one name on a run: without it, a
        # re-run of a red job would fail here whatever its tests did.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-suite-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/backend-suite.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: The suite must have RUN, not skipped
        # The shared assertion, not an inline copy: the frontend half
        # below calls the same script with its own baseline, so the two
        # halves cannot drift into applying different standards to the
        # same risk — which is exactly what happened when this was
        # written inline here and the frontend half kept only "vitest
        # exits 1 when it finds no files".
        #
        # 1188 is measured on the MERGE RESULT, not on this branch, and
        # the distinction is the whole value of the number. `on:
        # pull_request` checks out `refs/pull/N/merge`, so what this job
        # runs is the branch merged into main — while every baseline
        # before this one was measured on the branch ALONE. Those two
        # numbers diverge the moment main gains a test, and a FLOOR
        # never complains about being too low: the gap just sits there,
        # silently, as tests that could vanish with a green board.
        #
        # Measured: at 1137 this job reported `tests=1183 ... (baseline
        # 1137)` and passed — 46 tests of slack. Negative-tested by
        # narrowing discovery two modules' worth (1183 -> 1140): the old
        # floor ACCEPTED that report, the new one rejects it. The 1197
        # here is that same merge plus the round-30 through round-36
        # regression tests, and each was re-measured on the merge rather
        # than added to by hand. 1202 was S5-E's five run-key guards on
        # top, and 1233 adds S5-C's thirty-one, measured the same way
        # each time: the branch sits exactly on main, so the merge result
        # is the tree that was run. It went 1234, came back to 1232 when
        # the join those two tests covered was reverted — a floor that
