# The mission's loop, in CI (blueprint B14): every change → a booted
# stack → a real scenario run → traces. This is the §3 demo parity gate
# in automated form — it replaces the retired predecessor's smokes.
#
# Since blueprint S3 it boots the stack the way a newcomer does: with
# `scripts/demo.sh` on a checkout that carries no .env — the zero-config
# demo (generated secret and credentials, demo mode, the stub LLM, the
# bundled agent and the LangGraph example, Jaeger). It then drives the
# stack over HTTP exactly as a customer would: log in, load the demo
# scenario, submit it, watch progress, approve at the human gate, wait
# for the report, read it back, and pull the run's trace out of Jaeger.
#
# The demo is keyless by construction (LIBRERUN_STUB_LLM=true), so this
# job is a wiring proof, not an answer-quality proof, and says so in the
# job summary and the PR comment. Provider-backed runs are a separate
# concern (the gateway, S4a), not this gate's.
name: librerun-smoke

on:
  push:
    branches: [main]
  pull_request:

# One smoke per ref: these boot containers, so queueing beats piling up.
concurrency:
  group: librerun-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  scenario-smoke:
    runs-on: ubuntu-latest
    # Raised from 30 by S5-R: the demo profile builds two more images
    # (a LlamaIndex dependency tree and an npm install) and the job now
    # drives five agents' samples instead of one. A job that times out
    # reports nothing about what it was checking, which is the one
    # failure mode worse than red.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The demo path (blueprint S3): exactly what a newcomer runs on a
      # machine with Docker and nothing else. `--env-only` writes the demo
      # .env (generated secret and admin password, demo mode, the stub
      # LLM, the examples, Jaeger) and stops, so the credentials are read
      # and masked before anything can print them; the second call,
      # further down, builds, starts and waits for /health.
      # The credentials come back out of .env through a Python parser —
      # never `source`: bash would evaluate $(...), backticks and ; in a
      # generated password.
      - name: Write the demo environment
        id: env
        run: |
          set -euo pipefail
          # A fresh checkout carries no .env: the demo writes it, nobody edits it.
          test ! -f .env
          ./scripts/demo.sh --env-only
          python - <<'PY' > demo-credentials.env
          import sys
          env = {}
          for raw in open(".env", encoding="utf-8"):
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env[key.strip()] = value.strip().strip('"').strip("'")
          for key in ("INITIAL_ADMIN_EMAIL", "INITIAL_ADMIN_PASSWORD", "LIBRERUN_DEMO", "LIBRERUN_STUB_LLM"):
              if not env.get(key):
                  sys.exit(f"the demo .env is missing {key}")
              print(f"{key}={env[key]}")
          PY
          # Mask the generated password before any later step can echo it.
          echo "::add-mask::$(grep '^INITIAL_ADMIN_PASSWORD=' demo-credentials.env | cut -d= -f2-)"
          cat demo-credentials.env >> "$GITHUB_ENV"
          rm demo-credentials.env
          echo "stub=$(grep '^LIBRERUN_STUB_LLM=' .env | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      # The second half of the demo script: build, start, wait for /health,
      # print the URL and the (masked) credentials — the D1 step of the
      # delight gate, timed by this step's duration. Since K5b nothing is
      # built before it (the upgrade recipe's seed step, which built the
      # backend and the gateway first, is gone), so it times every build.
      - name: Boot the stack with the demo script (app + viewer + demo)
        run: |
          set -euo pipefail
          ./scripts/demo.sh
          docker compose --profile app --profile viewer ps

          # A crash-looping infra container is INVISIBLE to the scenario:
          # the backend serves every request fine with the telemetry
          # router dead, so intake, the gate and the report all pass and
          # only the trace check fails, 90s later, with no clue why. The
          # bundled Vector crash-looped in compose from B4 until B14 for
          # exactly this reason. Assert the stack is actually up here,
          # where the container's own log says what happened.
          python - <<'PY'
          import json, subprocess, sys, time

          COMPOSE = ["docker", "compose", "--profile", "app", "--profile", "viewer"]

          def rows():
              out = subprocess.run(
                  COMPOSE + ["ps", "-a", "--format", "json"],
                  capture_output=True, text=True, check=True,
              ).stdout.strip()
              if not out:
                  return []
              # Compose emits a JSON array on older versions, one object
              # per line on newer ones.
              if out.startswith("["):
                  return json.loads(out)
              return [json.loads(l) for l in out.splitlines() if l.strip()]

          deadline = time.time() + 90
          while True:
              current = rows()
              bad = [
                  r for r in current
                  if r.get("State") != "running" or r.get("Health") == "unhealthy"
              ]
              if current and not bad:
                  print(f"all {len(current)} containers running")
                  break
              if time.time() > deadline:
                  for r in bad:
                      name, svc = r.get("Name"), r.get("Service")
                      print(f"::error::{name} is {r.get('State')} "
                            f"(health={r.get('Health') or 'none'}, "
                            f"exit={r.get('ExitCode')}) — the stack is not "
                            f"fully up, so the gate below would test a "
                            f"partial system.")
                      subprocess.run(
                          COMPOSE + ["logs", "--no-color", "--tail", "40", svc]
                      )
                  sys.exit(1)
              time.sleep(2)

          # Blueprint S3 (Codex on PR #51): the backend's compose healthcheck
          # is the signal scripts/demo.sh reads on a host with no curl, wget
          # or python3 — prove the engine actually turns it healthy.
          deadline = time.time() + 120
          while True:
              backend = [r for r in rows() if r.get("Service") == "backend"]
              health = backend[0].get("Health") if backend else "missing"
              if health == "healthy":
                  print("backend healthy per the engine")
                  break
              if time.time() > deadline:
                  print(f"::error::backend health is {health or 'none'} after "
                        f"120s — the demo script's HTTP-less wait would never "
                        f"return")
                  subprocess.run(
                      COMPOSE + ["logs", "--no-color", "--tail", "40", "backend"]
                  )
                  sys.exit(1)
              time.sleep(2)
          PY

          # The text form the script greps, from the exact command it runs.
          docker compose --profile app --profile viewer --profile demo ps backend > ps-backend.txt
          grep -q "(healthy)" ps-backend.txt || {
            cat ps-backend.txt
            echo "::error::compose ps does not show the backend (healthy)"
            exit 1
          }

      # Blueprint S3: the demo announces itself — the public /meta facts the
      # login page and the banner read, and the backend's own banner in
      # its log. Every agent card the demo promises is there.
      - name: The demo announces itself
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/api/v1/meta | tee meta.json
          echo
          python - <<'PY'
          import json
          m = json.load(open("meta.json"))
          assert m["name"] == "LibreRun" and m["version"], m
          assert m["demo"] is True and m["stub_llm"] is True, m
          assert m["trace_viewer_configured"] is True, m
          assert m["trace_viewer"] == "jaeger" and m["trace_viewer_source"] == "env", m
          ids = {a["id"] for a in m["agents"]}
          # PROMISE 1, as a CI assertion (blueprint S5-R, D3): five agent
          # cards, on a demo booted from a clean checkout with no provider
          # key anywhere. Three of them are containers the demo profile
          # started; the chassis discovered and registered each one, which
          # it can only do if its service came up and its container.url
          # variable resolved.
          #
          # EQUALITY, not containment. A sixth agent appearing here is as
          # much a change to what the demo promises as a fifth going
          # missing, and `<=` would have said nothing about either.
          assert ids == {
              "vita-v1",
              "langgraph-triage",
              "echo-v1",
              "llamaindex-summarize",
              "vercel-answer",
          }, sorted(ids)
          # …and each one has a NAME here, never a bare id: /meta is what
          # the login page reads, before anyone has signed in. The
          # descriptions the cards show come from the authenticated
          # listing and are asserted in the step that drives them.
          for agent in m["agents"]:
              assert agent.get("name") and agent["name"] != agent["id"], agent
          print("meta ok, five cards:", sorted(ids))
          PY
          # To a file first, then grep: under `pipefail`, `grep -q` closes the
          # pipe on its first match and `docker compose logs` dies of SIGPIPE
          # (141), which reads as "no banner" whenever the log is long enough
          # for the writer to still be writing — exactly the race that turned
          # this step red once.
          #
          # And read it more than once. The banner is printed straight to
          # the console now (blueprint S4a), so it is there the moment the
          # process printed it — but `docker compose logs` is a separate
          # reader with a lag of its own, and this step runs a second after
          # the API answers. Polling changes WHEN we look, never whether
          # the banner has to be there: the same error, after 30s.
          for _ in $(seq 1 30); do
            docker compose --profile app --profile viewer logs --no-color backend > backend-boot.log 2>&1 || true
            if grep -q "LibreRun DEMO MODE" backend-boot.log; then break; fi
            sleep 1
          done
          grep -q "LibreRun DEMO MODE" backend-boot.log \
            || { echo "::error::the backend log carries no demo banner"; tail -40 backend-boot.log; exit 1; }

      # K blueprint A1 (gate R17): the running stack says which licence it
      # is under and where the source of the version it runs is — the
      # compose-boot Accept item, stood in for here by a session with no
      # engine. The demo's .env sets no LIBRERUN_SOURCE_URL, so compose
      # hands the backend a blank one and the default must come back: the
      # public repository at the running version's tag, never `main`. "At
      # the tag" is a string check until B1b tags the beta.
      - name: The stack names its licence and the source of its version (R17)
        run: |
          set -euo pipefail
          if grep -q '^LIBRERUN_SOURCE_URL=' .env; then
            echo "::error::the demo .env sets LIBRERUN_SOURCE_URL, so this step would not see the default"
            exit 1
          fi
          curl -fsS http://localhost:8000/api/v1/meta > meta-source.json
          python - <<'PY'
          import json
          m = json.load(open("meta-source.json"))
          assert m["license"] == "AGPL-3.0-only", m.get("license")
          assert m["version"], m
          assert m["source_url"].endswith(f"/tree/v{m['version']}"), m["source_url"]
          print("source access ok:", m["license"], m["source_url"])
          PY

      # The demo is single-user by design (L22): the generated admin is the
      # customer here.
      - name: Run the scenario smoke
        run: |
          set -euo pipefail
          python scripts/librerun_smoke.py \
            --base-url http://localhost:8000 \
            --email="$INITIAL_ADMIN_EMAIL" \
            --password="$INITIAL_ADMIN_PASSWORD" \
            --admin-email="$INITIAL_ADMIN_EMAIL" \
            --admin-password="$INITIAL_ADMIN_PASSWORD" \
            --agent vita-v1 \
            --trace-viewer-url http://localhost:16686 \
            --summary-json smoke-summary.json

      # D7 (blueprint §3.2), mechanised: every OTHER agent card completes
      # its own sample. The step above drove one agent end to end; this
      # drives the rest — the echo container, the LangGraph example, the
      # LlamaIndex Workflow and the TypeScript server — exactly as a
      # visitor would: read the card, load its "Try a sample" scenario,
      # submit it, approve if it parks at a gate, wait for the report.
      #
      # Which agent to skip is read from the previous step's own summary
      # rather than named again here: two places saying which agent was
      # already driven is one place to forget.
      #
      # And then the claim S5-R exists to make about all five: every LLM
      # span in each run's trace carries a MODEL and a COST. A run that
      # completed without reaching the gateway would satisfy everything
      # above; this is what makes "keyless, but really running" different
      # from "keyless, and quietly doing nothing".
      - name: Every agent card completes its own sample (D7)
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          # ONE definition of what an LLM span must carry, not two. The
          # scenario smoke's own `assert_llm_spans` already states it —
          # model, input and output tokens, cost, and no redacted name —
          # and a second copy here would be the copy that drifts.
          sys.path.insert(0, "scripts")
          from librerun_smoke import assert_llm_spans

          BASE = "http://localhost:8000/api/v1"
          JAEGER = "http://localhost:16686"

          def call(method, path, token=None, body=None, base=BASE):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(f"{base}{path}", data=data, method=method)
              req.add_header("Content-Type", "application/json")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")

          status, body = call("POST", "/auth/login", body={
              "email": os.environ["INITIAL_ADMIN_EMAIL"],
              "password": os.environ["INITIAL_ADMIN_PASSWORD"],
          })
          assert status == 200, ("login", status, body)
          token = body["access_token"]

          already = json.load(open("smoke-summary.json"))["agent"]
          status, cards = call("GET", "/agents", token=token)
          assert status == 200 and cards, ("agents", status, cards)
          # The cards the new-run page renders: a name, a description and
          # a sample each, whatever the framework behind them.
          for card in cards:
              assert card.get("display_name") and card.get("description"), card
              assert card.get("has_scenarios"), (card["agent_id"], "no sample to try")
          todo = [c for c in cards if c["agent_id"] != already]
          assert len(todo) == 4, (already, [c["agent_id"] for c in cards])
          print(f"{already} was driven above; now: {[c['agent_id'] for c in todo]}")

          traces = {}
          for card in todo:
              agent_id = card["agent_id"]
              status, scenarios = call("GET", f"/agents/{agent_id}/scenarios", token=token)
              assert status == 200 and scenarios, (agent_id, "no sample", status, scenarios)
              sample = scenarios[0]
              status, run = call(
                  "POST", f"/runs?agent_id={agent_id}", token=token,
                  body=sample["user_inputs"],
              )
              assert status in (200, 201, 202), (agent_id, "submit", status, run)
              run_id = run["run_id"]

              detail, approved = {}, False
              for _ in range(90):
                  status, detail = call("GET", f"/runs/{run_id}", token=token)
                  assert status == 200, (agent_id, "detail", status, detail)
                  state = detail.get("status")
                  if state in ("complete", "error"):
                      break
                  if state == "awaiting_approval" and not approved:
                      # ONCE. The status does not flip the instant the
                      # approval returns, so a loop that approved on every
                      # sighting would send a second one into a run that
                      # has already left the gate — and be told so.
                      status, _ = call("POST", f"/runs/{run_id}/approve", token=token)
                      assert status in (200, 201, 202), (agent_id, "approve", status)
                      approved = True
                  time.sleep(2)
              assert detail.get("status") == "complete", (
                  agent_id, sample.get("name"), detail.get("status"), detail.get("error")
              )
              # A completed run produced something the page can render:
              # the structured payload for a `structured` agent, the
              # report for an `html_report` one. Read from the card's own
              # declared mode rather than guessed.
              mode = (card.get("output") or {}).get("mode")
              if mode == "structured":
                  assert detail.get("structured_output"), (
                      agent_id, "completed with no structured output", sorted(detail)
                  )
              else:
                  status, report = call("GET", f"/runs/{run_id}/report/embedded", token=token)
                  assert status == 200 and (report or {}).get("html"), (agent_id, status)
              # The trace id is ADMIN-ONLY — it is operator observability,
              # not customer-facing — so it is not on the run detail this
              # loop has been reading. `scripts/librerun_smoke.py` reads
              # it the same way, through the admin view; the demo's one
              # user is the admin, which is why this can.
              status, admin_detail = call("GET", f"/admin/runs/{run_id}", token=token)
              assert status == 200, (agent_id, "admin run detail", status, admin_detail)
              trace_id = admin_detail.get("trace_id")
              assert trace_id, (agent_id, "no trace id on a completed run", sorted(admin_detail))
              traces[agent_id] = trace_id
              print(f"{agent_id}: {sample['name']!r} -> complete, trace {trace_id}")

          # Every agent, including the one the step above drove.
          traces[already] = json.load(open("smoke-summary.json"))["trace_id"]

          # ---- the LLM spans of every one of those traces ----------------
          def spans_of(trace_id):
              """The trace, once its gateway spans have landed.

              Two processes export into one trace on their own batch
              schedules, so a trace read too early is a trace with holes
              in it. Waiting changes WHEN we look, never what is
              accepted: a run that really produced no LLM span still has
              none after the last attempt, and still fails below.
              """
              found = []
              for _ in range(24):
                  try:
                      with urllib.request.urlopen(
                          f"{JAEGER}/api/traces/{trace_id}", timeout=15
                      ) as r:
                          data = json.loads(r.read() or b"{}")
                  except Exception:
                      data = {}
                  found = (data.get("data") or [{}])[0].get("spans") or []
                  if any(
                      str(s.get("operationName", "")).startswith(("chat ", "embeddings "))
                      for s in found
                  ):
                      return found
                  time.sleep(5)
              return found

          costed = 0
          for agent_id, trace_id in sorted(traces.items()):
              spans = spans_of(trace_id)
              # Raises with the reason when the trace has no LLM span at
              # all, when one is missing its model, tokens or cost, when a
              # cost is zero, or when the export redacted the model name.
              result = assert_llm_spans(spans)
              costed += result["count"]
              print(f"{agent_id}: {result['count']} costed LLM span(s) — {result['spans']}")
          assert costed >= len(traces), costed
          print(f"five agents, {costed} costed LLM spans, no provider key anywhere")
          PY

      # The delight gate's D3–D7 in a BROWSER (blueprint S7): the same
      # five cards the step above drove over the API, now clicked — the
      # card, its "Try a sample" chip, the Review step's Submit, the
      # labelled progress and the phase timeline, the gate and its
      # Approve, the report with a PDF export and a saved thumbs-up (or
      # the structured sections and "Copy JSON"), and the "View trace"
      # button whose trace is then read back from Jaeger as one tree.
      # Every step is timed against its §3.2 budget inside the spec, and
      # the times land in timings.json as the delight gate's record.
      #
      # Against the frontend container the demo started (port 3000, its
      # bundle pointing at localhost:8000), so what is walked is what a
      # newcomer would see. Chromium only: one browser is the gate, and
      # the walk is minutes long.
      - uses: actions/setup-node@v4
        if: success()
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: The five cards, clicked (Playwright, D3–D7)
        if: success()
        working-directory: frontend
        env:
          LR_BASE_URL: http://localhost:3000
          LR_API_URL: http://localhost:8000/api/v1
          LR_EMAIL: ${{ env.INITIAL_ADMIN_EMAIL }}
          LR_PASSWORD: ${{ env.INITIAL_ADMIN_PASSWORD }}
          LR_EXPECT_AGENT_COUNT: "5"
          LR_TRACE_VIEWER_URL: http://localhost:16686
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          curl -fsS -o /dev/null http://localhost:3000/login
          # playwright.config.ts matches every *.spec.ts: the delight walk, by
          # name. The providers walk and the admin walk are tls-edge's.
          npx playwright test -c e2e/playwright.config.ts delight.spec.ts
          echo "--- D3–D7 timings ---"
          cat e2e/results/timings.json
          {
            echo "## The five cards, clicked (D3–D7)"
            echo ""
            echo '```json'
            cat e2e/results/timings.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the browser walk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librerun-browser-walk-${{ github.run_id }}
          path: frontend/e2e/results/
          if-no-files-found: ignore
          retention-days: 14

      # The gateway half of the gate (blueprint S4a). Four claims that
      # are only checkable against a real deployment, and that every
      # in-process test has to take on trust.
      - name: No provider credential, and no client for one, in the backend
        if: success()
        run: |
          set -euo pipefail
          # 1. The backend's received environment carries no provider key.
          #    `exec env` shows what the process actually got, which is
          #    the claim — compose.yaml not naming them is a weaker one.
          docker compose --profile app --profile viewer exec -T backend env > backend-env.txt
          for var in OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_AI_API_KEY; do
            if grep -q "^${var}=" backend-env.txt; then
              echo "::error::${var} reached the backend container — the one process every in-process agent shares"
              exit 1
            fi
          done
          echo "backend env: no provider key"
          # 2. …and no client for one, so the capability's refusal is not
          #    cosmetic.
          if docker compose --profile app --profile viewer exec -T backend \
              python -c "import importlib.util,sys; sys.exit(0 if any(importlib.util.find_spec(m) for m in ('openai','anthropic','google.genai')) else 1)"; then
            echo "::error::a provider SDK is importable in the backend container"
            exit 1
          fi
          echo "backend image: no provider SDK"
          # 3. The GATEWAY's environment carries every agent key the demo
          #    wrote, and nothing outside its own block — APP_SECRET_KEY
          #    and the bootstrap credentials in particular.
          docker compose exec -T gateway env > gateway-env.txt
          for var in APP_SECRET_KEY INITIAL_ADMIN_PASSWORD INITIAL_ADMIN_EMAIL; do
            if grep -q "^${var}=" gateway-env.txt; then
              echo "::error::${var} reached the gateway container — it holds the provider keys and has no business minting a session"
              exit 1
            fi
          done
          python - <<'PY'
          import pathlib, re, sys

          wanted = {
              line.split("=", 1)[0]
              for line in pathlib.Path(".env").read_text().splitlines()
              if re.match(r"^LIBRERUN_AGENT_KEY_[A-Z0-9_]+=", line)
          }
          got = {
              line.split("=", 1)[0]
              for line in pathlib.Path("gateway-env.txt").read_text().splitlines()
              if line.startswith("LIBRERUN_AGENT_KEY_")
          }
          assert wanted, ".env carries no agent keys — demo.sh did not write them"
          missing = wanted - got
          assert not missing, f"the gateway did not receive {sorted(missing)}"
          print(f"gateway received {len(got)} agent key(s): {sorted(got)}")
          PY
          # 4. The boot log names each registered agent id.
          docker compose logs --no-color gateway > gateway-boot.log 2>&1 || true
          grep -q "gateway_agent_keys_registered" gateway-boot.log \
            || { echo "::error::the gateway boot log does not name its registered agents"; tail -40 gateway-boot.log; exit 1; }
          echo "gateway boot: keys registered"

      - name: An agent key alone lists models, and cannot call one
        if: success()
        run: |
          set -euo pipefail
          key=$(grep '^LIBRERUN_AGENT_KEY_ECHO_V1=' .env | cut -d= -f2-)
          test -n "$key" || { echo "::error::no echo agent key in .env"; exit 1; }
          case "$key" in
            lr_agent_*) ;;
            *) echo "::error::the agent key is not a LibreRun key: it must carry the lr_agent_ prefix"; exit 1 ;;
          esac
          models=$(curl -sS -o models.json -w '%{http_code}' \
            -H "Authorization: Bearer $key" http://localhost:8090/v1/models)
          test "$models" = "200" || { echo "::error::GET /v1/models with an agent key answered $models"; cat models.json; exit 1; }
          echo "agent key alone: /v1/models 200"
          chat=$(curl -sS -o chat.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $key" -H 'Content-Type: application/json' \
            -d '{"model":"librerun/echo","messages":[{"role":"user","content":"hi"}]}' \
            http://localhost:8090/v1/chat/completions)
          test "$chat" = "401" || { echo "::error::a chat call with an agent key alone answered $chat, not 401"; cat chat.json; exit 1; }
          grep -q run_token_required chat.json \
            || { echo "::error::the refusal is not run_token_required"; cat chat.json; exit 1; }
          echo "agent key alone: chat refused 401 run_token_required, even on this single-tenant demo"
          # …and /healthz answers a credential-less request with three
          # fields and no more. A CLOSED set on purpose: the guard is
          # that nothing arrives on an unauthenticated endpoint without
          # someone arguing for it. ``pii_detector`` was argued for at
          # blueprint S4c — outbound redaction runs in the gateway, so
          # whether its named-entity stage works is a question about
          # THIS process — and it is two fields exactly, without the
          # failing exception's class that the backend's /health
          # carries, because every agent container on the network can
          # reach this one.
          #
          # ``state`` is asserted READY here and not merely present: this
          # job builds and runs the real images, so it is where "the
          # shipped gateway can actually redact a name" is decided. The
          # backend's own /health is checked the same way inside
          # scripts/librerun_smoke.py.
          curl -sS http://localhost:8090/healthz > health.json
          python -c "
          import json, pathlib
          body = json.loads(pathlib.Path('health.json').read_text())
          assert set(body) == {'status', 'stub', 'pii_detector'}, body
          assert body['stub'] is True, 'the demo is keyless; /healthz says otherwise'
          detector = body['pii_detector']
          assert set(detector) == {'state', 'coverage'}, detector
          assert detector['state'] == 'ready', (
              'the named-entity stage cannot run in the shipped gateway '
              'image, so it would refuse every model call: '
              + json.dumps(detector))
          assert detector['coverage'] == 'ner', detector
          print('healthz:', body)
          "

      # The agent-boundary half of the gate (blueprint S4). Three things
      # that are only true of a real container on a real network, and
      # that every in-process test has to take on trust:
      #
      #   1. `docker logs` on the agent is empty — the logging driver is
      #      `none`, so the daemon persists nothing, and a print() is
      #      only ever seen because the SDK turns it into a run-plane
      #      record;
      #   2. NO agent container can reach Vector, the database or the
      #      Internet — the `agents` network is internal, and the only
      #      paths off it are the chassis relay and the gateway. Asked of
      #      every container the fragment declares (three since S5-R),
      #      from INSIDE each one, in whichever language it speaks;
      #   3. nothing the agent emitted put the fixture in the database.
      #
      # The compose file declaring an internal network is not the same
      # claim as a connection being refused, which is why this dials.
      - name: The agent boundary holds against the real container
        if: success()
        run: |
          set -euo pipefail
          FIXTURE="pii.fixture@example.com"

          echo "--- a run through the container, carrying the fixture ---"
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          BASE = "http://localhost:8000/api/v1"
          FIXTURE = "pii.fixture@example.com"

          def call(method, path, token=None, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(f"{BASE}{path}", data=data, method=method)
              req.add_header("Content-Type", "application/json")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")

          status, body = call("POST", "/auth/login", body={
              "email": os.environ["INITIAL_ADMIN_EMAIL"],
              "password": os.environ["INITIAL_ADMIN_PASSWORD"],
          })
          assert status == 200, ("login", status, body)
          token = body["access_token"]

          # The submission contract is the one scripts/librerun_smoke.py
          # uses: the agent id is a QUERY parameter and the body IS the
          # user inputs. The response names the run `run_id`.
          # `fetch_and_emit` makes the agent use an address IT holds, not
          # one sent through intake. Sending the fixture in `print` or
          # `instrument` would prove nothing about the export walk: those
          # fields are x-pii, so the handler would receive the intake
          # placeholder and the dump check below would pass on intake
          # redaction alone.
          status, body = call("POST", "/runs?agent_id=echo-v1", token=token, body={
              "message": "agent boundary check",
              "fetch_and_emit": True,
          })
          assert status in (200, 201, 202), ("submit", status, body)
          run_id = body.get("run_id")
          assert run_id, ("submit returned no run_id", body)

          detail = {}
          for _ in range(60):
              status, detail = call("GET", f"/runs/{run_id}", token=token)
              assert status == 200, ("detail", status, detail)
              if detail.get("status") in ("complete", "error", "awaiting_approval"):
                  break
              time.sleep(2)
          print("echo run:", detail.get("status"))
          assert detail.get("status") == "complete", ("not complete", detail)
          assert FIXTURE not in json.dumps(detail), "the run detail serves the address"
          PY

          # EVERY agent container, not the one this job remembers. The
          # list comes from the label agents.compose.yaml puts on each
          # service, so the next example is covered the day it lands, and
          # the count is checked against the fragment itself — a docker
          # filter that matched nothing would otherwise make both loops
          # below iterate zero times and go green.
          mapfile -t AGENT_CONTAINERS < <(docker ps --filter label=librerun.agent_id --format '{{.Names}}' | sort)
          # The label lines themselves, not every mention: the fragment's
          # header comment names the label too.
          expected=$(grep -cE '^[[:space:]]+librerun\.agent_id:' agents.compose.yaml)
          echo "agent containers: ${AGENT_CONTAINERS[*]:-<none>} (fragment declares ${expected})"
          if [ "${#AGENT_CONTAINERS[@]}" -ne "$expected" ]; then
            echo "::error::${#AGENT_CONTAINERS[@]} agent containers are running but agents.compose.yaml declares ${expected}. Either one failed to start or the label is gone — and either way the checks below would be asking nothing of it."
            docker ps -a
            exit 1
          fi

          echo "--- 1. docker logs on each agent is empty ---"
          for agent in "${AGENT_CONTAINERS[@]}"; do
            out="$(docker logs "$agent" 2>&1 || true)"
            if [ -n "$out" ] && ! grep -qi "does not support reading" <<< "$out"; then
              echo "::error::docker logs on $agent returned output — the logging driver must be none, or a print() would land in the daemon's log unwalked."
              echo "$out" | head -20
              exit 1
            fi
            echo "$agent: empty (or the driver refuses reads), as designed"
          done

          echo "--- 2. no agent reaches Vector, the database or the Internet ---"
          # The same questions put to each container in its own language,
          # because the images have nothing in common but the contract:
          # two of them are Python, one is Node, and neither ships curl.
          # The interpreter is DETECTED rather than assumed, and a
          # container with neither is a failure — "we could not ask" must
          # not read as "the answer was yes".
          #
          # -i, or the heredoc never reaches the container: `python -` /
          # `node -` read EOF, exit 0, and every assertion silently does
          # not run. Each probe prints a sentinel and this step greps for
          # it, so "the probe did not run" cannot read as "the probe
          # passed".
          cat > probe.py <<'PROBE_PY'
          import socket

          def reachable(host, port):
              try:
                  socket.create_connection((host, port), timeout=5).close()
                  return True
              except OSError:
                  return False

          # The relay IS reachable: that is the one path out, and a test
          # that only proved unreachability would also pass on a
          # container with no network at all.
          assert reachable("backend", 8000), "the chassis relay is unreachable — the agent cannot report anything"
          print("backend:8000 reachable, as designed")
          # …and so is the gateway, the other half of the `agents`
          # network: an agent with no model door is not the container the
          # demo starts.
          assert reachable("gateway", 8090), "the gateway is unreachable — the agent has no door to a model"
          print("gateway:8090 reachable, as designed")

          for host, port in (("vector", 4317), ("vector", 4318), ("postgres", 5432), ("redis", 6379)):
              assert not reachable(host, port), f"{host}:{port} is reachable from the agent"
              print(f"{host}:{port} refused, as designed")

          for host, port in (("example.com", 80), ("1.1.1.1", 53)):
              assert not reachable(host, port), f"{host}:{port} is reachable — the agents network is not internal"
              print(f"{host}:{port} refused, as designed")

          print("NETWORK PROBE COMPLETE")
          PROBE_PY
          cat > probe.js <<'PROBE_JS'
          const net = require("node:net");

          function reachable(host, port) {
            return new Promise((resolve) => {
              const socket = net.connect({ host, port, timeout: 5000 });
              const done = (answer) => { socket.destroy(); resolve(answer); };
              socket.once("connect", () => done(true));
              socket.once("error", () => done(false));
              socket.once("timeout", () => done(false));
            });
          }

          (async () => {
            if (!(await reachable("backend", 8000))) throw new Error("the chassis relay is unreachable — the agent cannot report anything");
            console.log("backend:8000 reachable, as designed");
            if (!(await reachable("gateway", 8090))) throw new Error("the gateway is unreachable — the agent has no door to a model");
            console.log("gateway:8090 reachable, as designed");
            for (const [host, port] of [["vector", 4317], ["vector", 4318], ["postgres", 5432], ["redis", 6379]]) {
              if (await reachable(host, port)) throw new Error(`${host}:${port} is reachable from the agent`);
              console.log(`${host}:${port} refused, as designed`);
            }
            for (const [host, port] of [["example.com", 80], ["1.1.1.1", 53]]) {
              if (await reachable(host, port)) throw new Error(`${host}:${port} is reachable — the agents network is not internal`);
              console.log(`${host}:${port} refused, as designed`);
            }
            console.log("NETWORK PROBE COMPLETE");
          })().catch((err) => { console.error(String(err && err.message || err)); process.exit(1); });
          PROBE_JS
          for agent in "${AGENT_CONTAINERS[@]}"; do
            if docker exec "$agent" sh -c 'command -v python3 >/dev/null 2>&1'; then
              docker exec -i "$agent" python3 - < probe.py > "probe-$agent.out" 2>&1 || true
            elif docker exec "$agent" sh -c 'command -v node >/dev/null 2>&1'; then
              docker exec -i "$agent" node - < probe.js > "probe-$agent.out" 2>&1 || true
            else
              echo "::error::$agent has neither python3 nor node, so its boundary cannot be probed from inside. Add an interpreter or a probe for it — an unasked question is not an answer."
              exit 1
            fi
            echo "--- $agent ---"
            cat "probe-$agent.out"
            grep -q "NETWORK PROBE COMPLETE" "probe-$agent.out" || {
              echo "::error::The in-container network probe did not run to completion in $agent — its assertions prove nothing."
              exit 1
            }
          done

          echo "--- 3. the fixture is in no column of the database ---"
          # The names compose uses, with its own defaults.
          PGUSER_NAME="${POSTGRES_USER:-librerun}"
          PGDB_NAME="${POSTGRES_DB:-librerun}"
          docker compose exec -T postgres pg_dump -U "$PGUSER_NAME" "$PGDB_NAME" > db-dump.sql
          echo "dump: $(wc -c < db-dump.sql) bytes"
          if grep -F -q "$FIXTURE" db-dump.sql; then
            echo "::error::The fixture address is in the database dump. Something the agent emitted was persisted unwalked."
            grep -F -n "$FIXTURE" db-dump.sql | head -5
            exit 1
          fi
          echo "not in the dump"
          # And the placeholder IS there, so the run really carried the
          # text — a dump with neither would pass this check by having
          # stored nothing at all.
          if ! grep -q "REDACTED_EMAIL_ADDRESS" db-dump.sql; then
            echo "::error::Neither the address nor a placeholder is in the dump — the run stored nothing, so the check above proved nothing."
            exit 1
          fi
          echo "the placeholder is, so the text did travel"

      # Diagnostics: always gathered, never load-bearing on their own.
      - name: Collect the trace and logs
        if: always()
        run: |
          set -uo pipefail
          mkdir -p smoke-artifacts
          cp smoke-summary.json smoke-artifacts/ 2>/dev/null || true
          TRACE_ID=$(python -c "import json;print(json.load(open('smoke-summary.json')).get('trace_id',''))" 2>/dev/null || echo "")
          if [ -n "$TRACE_ID" ]; then
            # Jaeger ships in the viewer profile and receives via Vector.
            for i in $(seq 1 12); do
              curl -sf "http://localhost:16686/api/traces/${TRACE_ID}" \
                -o smoke-artifacts/trace.json && break
              sleep 5
            done
            python - <<'PY' || true
          import json
          try:
              d = json.load(open("smoke-artifacts/trace.json"))
              spans = d.get("data", [{}])[0].get("spans", [])
              print(f"trace collected: {len(spans)} spans")
              json.dump({"span_count": len(spans),
                         "operations": sorted({s.get("operationName","") for s in spans})},
                        open("smoke-artifacts/trace-summary.json", "w"), indent=2)
          except Exception as e:
              print(f"trace not retrievable from Jaeger: {e}")
          PY
          fi
          # The Vector debug sink is the second, always-available view.
          docker compose logs --no-color vector > smoke-artifacts/vector.log 2>&1 || true
          docker compose logs --no-color backend > smoke-artifacts/backend.log 2>&1 || true
          docker compose logs --no-color jaeger > smoke-artifacts/jaeger.log 2>&1 || true
          docker compose logs --no-color > smoke-artifacts/compose-all.log 2>&1 || true

          # Enough context to tell "traces never left the backend" from
          # "Vector didn't forward" from "Jaeger has them under another
          # id" — without which a red gate is just a mystery.
          echo "--- jaeger services ---"
          curl -s http://localhost:16686/api/services \
            | tee smoke-artifacts/jaeger-services.json | head -c 500; echo
          echo "--- recent jaeger traces for librerun-backend ---"
          curl -s "http://localhost:16686/api/traces?service=librerun-backend&limit=5" \
            | tee smoke-artifacts/jaeger-recent.json | head -c 500; echo
          echo "--- backend OTEL lines ---"
          grep -iE "otel|otlp|export" smoke-artifacts/backend.log | tail -20 || true
          # Auth is the other thing that fails early and opaquely: a 401
          # on the request straight after a successful login says the
          # session row was not found, and the backend's own sign-in and
          # bootstrap events are the only way to tell "never written"
          # from "written and gone".
          echo "--- backend auth/bootstrap lines ---"
          grep -iE "auth_sign_in|bootstrap|session|migration" smoke-artifacts/backend.log | tail -25 || true
          echo "--- vector errors ---"
          grep -iE "error|warn" smoke-artifacts/vector.log | tail -20 || true

      # The telemetry half of the gate. A run always HAS a trace id — the
      # runner mints it when the span starts — so the id proves nothing
      # about export. If OTLP export, Vector routing, or the Jaeger
      # overlay regresses, everything above still passes. Assert the trace
      # actually left the process: it must appear in Jaeger or in Vector's
      # sink. Runs only when the smoke itself succeeded, so it can never
      # mask an earlier failure.
      - name: Verify the trace was exported
        if: success()
        run: |
          set -euo pipefail
          TRACE_ID=$(python -c "import json;print(json.load(open('smoke-summary.json'))['trace_id'])")
          if [ -z "$TRACE_ID" ]; then
            echo "no trace id in the smoke summary"; exit 1
          fi
          IN_JAEGER=no
          if [ -s smoke-artifacts/trace.json ] && \
             python -c "import json,sys; d=json.load(open('smoke-artifacts/trace.json')); sys.exit(0 if d.get('data') and d['data'][0].get('spans') else 1)"; then
            IN_JAEGER=yes
          fi
          # Vector's console sink prints trace_id as lowercase hex — the
          # same spelling the run carries — so a plain grep is a true
          # second view of the same trace (verified against vector
          # 0.50.0's opentelemetry source).
          IN_VECTOR=no
          if grep -q "$TRACE_ID" smoke-artifacts/vector.log 2>/dev/null; then
            IN_VECTOR=yes
          fi
          # Jaeger having the service at all separates "nothing exported"
          # from "this particular trace is missing".
          JAEGER_HAS_SERVICE=no
          if grep -q "librerun-backend" smoke-artifacts/jaeger-services.json 2>/dev/null; then
            JAEGER_HAS_SERVICE=yes
          fi
          echo "jaeger knows librerun-backend: ${JAEGER_HAS_SERVICE}"
          echo "trace ${TRACE_ID}: jaeger=${IN_JAEGER} vector=${IN_VECTOR}"
          if [ "$IN_JAEGER" = "no" ] && [ "$IN_VECTOR" = "no" ]; then
            echo "::error::The run's trace never reached Jaeger or the Vector sink — traces are part of the gate, so this is a failure, not a warning. (jaeger knows librerun-backend: ${JAEGER_HAS_SERVICE} — 'yes' means spans ARE flowing and only this trace is missing; 'no' means export or forwarding is broken.)"
            exit 1
          fi

      # The logs half of the gate. Docker creates the ./data/logs bind
      # mount root-owned — before the entrypoint self-heal (root start
      # via compose `user: "0:0"`; chown, then drop to 'vita'),
      # every fresh Docker checkout silently degraded to stderr-only
      # logging and the file/HEC pipeline shipped nothing. This CI runs
      # on Docker, so it reproduced that exact bug on every run and
      # never looked. Assert both legs: the backend wrote the JSON log
      # file on the host, and Vector's tail actually ingested it.
      - name: Verify file logging self-healed
        if: success()
        run: |
          set -euo pipefail
          if [ ! -s data/logs/backend.jsonl ]; then
            echo "::error::data/logs/backend.jsonl is missing or empty — the entrypoint's chown-then-drop self-heal regressed (backend fell back to stderr-only; grep backend logs for log_file_unwritable)."
            ls -la data/logs/ || true
            exit 1
          fi
          echo "backend.jsonl: $(wc -l < data/logs/backend.jsonl) lines"
          # Host-reader tooth: the mount must stay readable for
          # arbitrary non-vita HOST users — compose.yaml promises
          # operators can tail ./data/logs/*.jsonl from the host (e.g.
          # a Cribl Edge agent). This job's own user can pass that by
          # gid coincidence (the container allocates vita's gid
          # counting down from 999, and gid 999 on this runner image is
          # 'docker', which the runner user is in) — so probe as
          # 'nobody', who is in no aligned group.
          if ! sudo -n -u nobody head -c 1 data/logs/backend.jsonl >/dev/null; then
            echo "::error::backend.jsonl is not readable by an unprivileged host user — the bind mount went private to the container uid (data/logs: $(stat -c '%A %u:%g' data/logs))."
            exit 1
          fi
          echo "unprivileged host read: ok"
          # Forwarded file events carry a JSON "file" field with this
          # exact path; Vector's own fingerprint warning spells the path
          # without quotes, so this grep cannot false-positive on it.
          TAILED=no
          for i in $(seq 1 6); do
            # Capture, then grep the file. Piping into `grep -q` under
            # pipefail is a trap: -q exits at the first match, and when
            # the log stream outruns the pipe buffer the still-writing
            # `docker compose logs` takes SIGPIPE (141) — the pipeline
            # then reads as "no match" on a perfectly healthy run.
            docker compose logs --no-color vector > vector-logs.txt 2>/dev/null || true
            if grep -q '"file":"/var/log/librerun/backend.jsonl"' vector-logs.txt; then
              TAILED=yes; break
            fi
            sleep 5
          done
          echo "vector tailed the log file: ${TAILED}"
          if [ "$TAILED" = "no" ]; then
            echo "::error::Vector never ingested backend.jsonl — the file exists, so the tail leg of the logs pipeline (file source -> sinks) is what broke."
            echo "--- last 40 lines of vector logs ---"
            tail -n 40 vector-logs.txt || true
            exit 1
          fi

      # Gap H5, for configuration as data (blueprint S2, K5b). An admin
      # edit to one of the demo agent's settings and to one of its steps,
      # both through the API, then the exact command Install.md
      # prescribes after any .env change — which discarded edits kept in
      # a container's writable layer — and both read back. Each is this
      # tenant's row in the database, which the recreate never touches.
      #
      # Runs LAST, after the trace and log checks: the exact
      # `up -d --force-recreate` recreates the viewer profile too, and
      # Jaeger's in-memory store — the smoke's trace with it — does not
      # survive a recreate. Read the trace first, then recreate.
      - name: Agent settings survive force-recreate
        run: |
          set -euo pipefail
          # On failure the recreated backend's own log is the diagnostic.
          trap 'docker compose --profile app --profile viewer logs --no-color --tail 80 backend' ERR
          python scripts/librerun_state_probe.py \
            --admin-email="$INITIAL_ADMIN_EMAIL" --admin-password="$INITIAL_ADMIN_PASSWORD" \
            edit-setting tavily_search_depth basic
          python scripts/librerun_state_probe.py \
            --admin-email="$INITIAL_ADMIN_EMAIL" --admin-password="$INITIAL_ADMIN_PASSWORD" \
            assert-setting tavily_search_depth basic
          python scripts/librerun_state_probe.py \
            --admin-email="$INITIAL_ADMIN_EMAIL" --admin-password="$INITIAL_ADMIN_PASSWORD" \
            edit-step --temperature 0.33 --record state-probe.json
          ./compose.sh --profile app --profile viewer up -d --force-recreate
          python scripts/librerun_state_probe.py \
            --admin-email="$INITIAL_ADMIN_EMAIL" --admin-password="$INITIAL_ADMIN_PASSWORD" \
            assert-step --record state-probe.json
          python scripts/librerun_state_probe.py \
            --admin-email="$INITIAL_ADMIN_EMAIL" --admin-password="$INITIAL_ADMIN_PASSWORD" \
            assert-setting tavily_search_depth basic

      - name: Write the job summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## LibreRun scenario smoke"
            echo ""
            if [ "${{ job.status }}" = "cancelled" ]; then
              echo "_Run superseded by a newer push._"
              echo ""
            fi
            if [ "${{ steps.env.outputs.stub }}" = "true" ]; then
              echo "**Mode:** keyless (\`LIBRERUN_STUB_LLM=true\`) — proves the wiring, not answer quality."
            else
              echo "**Mode:** live providers (keys present in repo secrets)."
            fi
            echo ""
            if [ -f smoke-summary.json ]; then
              echo '```json'
              cat smoke-summary.json
              echo '```'
            else
              echo "The smoke did not produce a summary — see the job log."
            fi
            if [ -f smoke-artifacts/trace-summary.json ]; then
              echo ""
              echo "**Trace:**"
              echo '```json'
              cat smoke-artifacts/trace-summary.json
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" > smoke-artifacts/summary.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librerun-smoke-${{ github.run_id }}
          path: smoke-artifacts/
          retention-days: 14

      - name: Comment the result on the PR
        # Not on cancellation: a superseded run (this workflow cancels
        # in-progress runs on a new push) would otherwise post a red
        # "did not complete" comment about a run nobody asked to finish.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ job.status }}' === 'success';
            let body = `### ${ok ? '✅' : '❌'} LibreRun scenario smoke\n\n`;
            body += '${{ steps.env.outputs.stub }}' === 'true'
              ? '_Keyless mode (`LIBRERUN_STUB_LLM=true`): this proves the stack wiring end to end, not answer quality._\n\n'
              : '_Live provider mode._\n\n';
            try {
              const s = JSON.parse(fs.readFileSync('smoke-summary.json', 'utf8'));
              body += `Run **${s.run_number}** (${s.agent}) reached \`${s.status}\` in ${s.elapsed_seconds}s — `;
              body += `report ${s.report_chars} chars, trace \`${s.trace_id || 'n/a'}\`.\n\n`;
              body += `Scenario: _${s.scenario}_\n`;
            } catch (e) {
              body += 'The smoke did not complete — see the workflow logs and the uploaded artifacts.\n';
            }
            body += `\n[Full logs and trace artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            body += '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Tear down
        if: always()
        run: docker compose --profile app --profile viewer down -v || true

  # ==========================================================================
  # Gate S — the canary secret sweep, on a stack booted from FILES
  # (K blueprint K2 and §3.2, decisions L30 and L31).
  #
  # The job above boots the demo the way a newcomer does. This one boots
  # the same stack the way a secret store does: the session key, the
  # bootstrap password and a provider key come from files under
  # /run/secrets, delivered by the compose overlay that
  # docs/platform/Install.md publishes — READ OUT OF THAT DOCUMENT, not copied
  # here, so the recipe CI proves and the recipe an operator follows
  # cannot drift apart.
  #
  # Each of those files holds a distinct CANARY. The stack is then driven
  # through a whole run and swept: the canaries may appear in no log, no
  # container's output, no API response, no settings dump, no database
  # row, no exported trace and no file under ./data.
  #
  # And the sweep itself is not taken on trust. It plants a value it must
  # then FIND (the positive control), every sink it declares must come
  # back with bytes in it, its report is re-verified by a second run of
  # the same script, and twelve negative doubles inject the very leak it
  # exists to catch — one per sink class, and from K6 one per new slot —
  # or hand the verifier a report it must refuse, and each must turn it red.
  #
  # K6 adds two slots and a sink: a secret set through the settings API
  # (the K6_SETTING_SECRET canary, as auth.azure_client_secret) and the
  # store's own key, delivered as a file like the others; and the
  # `secrets` table, whose rows hold ciphertext, so no canary's plaintext
  # may be in it — while the planted secret's fingerprint must be, or the
  # sweep never read the row.
  #
  # K8a adds a slot and a sink: an agent's tool secret set for this tenant
  # through the agents API (the K8_TOOL_SECRET canary, as the demo agent's
  # tavily_api_key, planted after the run so no canary is ever sent to a
  # search provider), and what a run persists (`run_output`), from which
  # the runner scrubs every value it delivered.
  # ==========================================================================
  secrets-as-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The demo writes .env — the agents path, keyless mode, the agent
      # keys and the viewer wiring. The two secrets it generates are
      # about to be replaced by files, so its password is never used.
      - name: Write the demo environment
        run: |
          set -euo pipefail
          test ! -f .env
          ./scripts/demo.sh --env-only
          # compose.sh derives agent-keys.env before every command; this
          # job drives `docker compose` directly (it needs a second -f),
          # so the derivation is done here, by the same script.
          ./compose.sh ps > /dev/null
          python - <<'PY' >> "$GITHUB_ENV"
          env = {}
          for raw in open(".env", encoding="utf-8"):
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env[key.strip()] = value.strip().strip('"').strip("'")
          assert env.get("INITIAL_ADMIN_EMAIL"), "the demo .env has no admin email"
          print(f"INITIAL_ADMIN_EMAIL={env['INITIAL_ADMIN_EMAIL']}")
          PY

      # One canary per secret slot, each long and unmistakable. They are
      # masked before anything can echo them, written to files the
      # overlay mounts, and listed in a JSON file the sweep reads — never
      # passed as arguments, which land in the process table and in this
      # log.
      - name: Mint the canaries and write them as files
        run: |
          set -euo pipefail
          mkdir -p secrets && chmod 700 secrets
          python - <<'PY'
          import base64, json, os, pathlib, secrets as s
          canaries = {
              name: f"CANARY-{name}-{s.token_hex(16)}"
              for name in ("APP_SECRET_KEY", "INITIAL_ADMIN_PASSWORD", "OPENAI_API_KEY",
                           "K6_SETTING_SECRET")
          }
          # The store key's canary must BE a Fernet key, or the backend
          # refuses to boot on it: 32 random bytes, url-safe base64 (K6).
          canaries["LIBRERUN_BACKEND_SECRETS_KEY"] = (
              base64.urlsafe_b64encode(os.urandom(32)).decode("ascii")
          )
          # K7: the gateway's store key, a Fernet key too and another draw,
          # since the two must differ (D33); and a provider key pasted in
          # the admin UI, which has no file: a step below seals it to the
          # gateway's public key, as the browser does, and the sweep posts
          # the blob (--sealed-key). One word of visible ASCII, under 318
          # bytes, like any key the page accepts.
          canaries["LIBRERUN_GATEWAY_SECRETS_KEY"] = (
              base64.urlsafe_b64encode(os.urandom(32)).decode("ascii")
          )
          canaries["K7_SEALED_PROVIDER_KEY"] = f"CANARY-K7_SEALED_PROVIDER_KEY-{s.token_hex(16)}"
          # K8a: a tool secret, which has no file either: the sweep sets it
          # as this tenant's tavily_api_key through the agents API
          # (--tool-secret), after the run, so no search is made with it.
          canaries["K8_TOOL_SECRET"] = f"CANARY-K8_TOOL_SECRET-{s.token_hex(16)}"
          # K8b: the echo example's tool secret, set the same way as its
          # echo_token; the run the sweep then submits fetches it over MCP.
          canaries["K8B_TOOL_SECRET"] = f"CANARY-K8B_TOOL_SECRET-{s.token_hex(16)}"
          # K6_SETTING_SECRET has no file: the sweep sets it through the
          # settings API (--secret-setting), which is the slot it tests.
          files = {
              "APP_SECRET_KEY": "secrets/app_secret_key",
              "INITIAL_ADMIN_PASSWORD": "secrets/initial_admin_password",
              "OPENAI_API_KEY": "secrets/openai_api_key",
              "LIBRERUN_BACKEND_SECRETS_KEY": "secrets/backend_secrets_key",
              "LIBRERUN_GATEWAY_SECRETS_KEY": "secrets/gateway_secrets_key",
          }
          for name, path in files.items():
              # A trailing newline on purpose: it is what printf, every
              # editor and every `kubectl create secret --from-file`
              # produces, and stripping exactly one of them is the rule
              # this batch added. A file written without one would test
              # the easy case.
              pathlib.Path(path).write_text(canaries[name] + "\n", encoding="utf-8")
          pathlib.Path("canaries.json").write_text(json.dumps(canaries, indent=2))
          PY
          # Readable by the container's unprivileged user, unreadable by
          # anyone else on the host — exactly what docs/platform/Install.md says.
          chmod 444 secrets/*
          python - <<'PY'
          import json
          for name, value in json.load(open("canaries.json")).items():
              print(f"::add-mask::{value}")
              print(f"minted canary for {name}")
          PY

      # The overlay comes OUT OF THE DOCUMENT. If somebody edits the
      # recipe in docs/platform/Install.md into something that does not work, this
      # job is what says so.
      - name: Take the compose overlay from docs/platform/Install.md
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, sys
          doc = pathlib.Path("docs/platform/Install.md").read_text(encoding="utf-8")
          match = re.search(
              r"<!-- secrets-as-files-overlay:start -->\s*```yaml\n(.*?)```",
              doc,
              re.S,
          )
          if not match:
              sys.exit(
                  "docs/platform/Install.md no longer carries the secrets-as-files "
                  "overlay between its markers — this job runs the DOCUMENT'S "
                  "recipe and has nothing to run"
              )
          overlay = match.group(1)
          for needed in ("APP_SECRET_KEY_FILE", "INITIAL_ADMIN_PASSWORD_FILE",
                         "OPENAI_API_KEY_FILE", "./secrets/app_secret_key",
                         "LIBRERUN_BACKEND_SECRETS_KEY_FILE",
                         "LIBRERUN_GATEWAY_SECRETS_KEY_FILE",
                         "./secrets/gateway_secrets_key"):
              if needed not in overlay:
                  sys.exit(f"the documented overlay no longer mentions {needed}")
          pathlib.Path("compose.secrets.yaml").write_text(overlay, encoding="utf-8")
          print(overlay)
          PY

      - name: Boot the stack from the secret files
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.secrets.yaml \
            --profile app --profile viewer up -d --build
          python - <<'PY'
          import json, subprocess, sys, time

          COMPOSE = ["docker", "compose", "-f", "compose.yaml",
                     "-f", "compose.secrets.yaml",
                     "--profile", "app", "--profile", "viewer"]

          def rows():
              out = subprocess.run(COMPOSE + ["ps", "-a", "--format", "json"],
                                   capture_output=True, text=True, check=True).stdout.strip()
              if not out:
                  return []
              if out.startswith("["):
                  return json.loads(out)
              return [json.loads(l) for l in out.splitlines() if l.strip()]

          deadline = time.time() + 180
          while True:
              current = rows()
              bad = [r for r in current
                     if r.get("State") != "running" or r.get("Health") == "unhealthy"]
              if current and not bad:
                  print(f"all {len(current)} containers running")
                  break
              if time.time() > deadline:
                  for r in bad:
                      print(f"::error::{r.get('Name')} is {r.get('State')} "
                            f"(health={r.get('Health') or 'none'}, exit={r.get('ExitCode')}). "
                            f"A container that will not start on a _FILE secret is the "
                            f"failure this job is for — read its log below.")
                      subprocess.run(COMPOSE + ["logs", "--no-color", "--tail", "60",
                                                r.get("Service")])
                  sys.exit(1)
              time.sleep(3)

          # "running" is not "ready": the backend's port is published the
          # moment the container starts, so a request during migrations
          # is accepted by the proxy and reset by nothing listening
          # behind it — `curl: (56) Recv failure`, which reads like a
          # secret that did not bind and is not. Wait for the engine's
          # own healthcheck, then for the endpoint itself.
          deadline = time.time() + 240
          while True:
              backend = [r for r in rows() if r.get("Service") == "backend"]
              health = backend[0].get("Health") if backend else "missing"
              if health == "healthy":
                  print("backend healthy per the engine")
                  break
              if time.time() > deadline:
                  print(f"::error::backend health is {health or 'none'} after 240s")
                  subprocess.run(COMPOSE + ["logs", "--no-color", "--tail", "60", "backend"])
                  sys.exit(1)
              time.sleep(3)

          import urllib.error, urllib.request

          deadline = time.time() + 120
          last = "no attempt completed"
          while True:
              try:
                  with urllib.request.urlopen(
                      "http://localhost:8000/api/v1/health", timeout=5
                  ) as response:
                      if response.status == 200:
                          print("backend answering on the published port")
                          break
              except (urllib.error.URLError, OSError, TimeoutError) as exc:
                  last = exc
              if time.time() > deadline:
                  print(f"::error::the backend never answered on :8000 ({last})")
                  subprocess.run(COMPOSE + ["logs", "--no-color", "--tail", "60", "backend"])
                  sys.exit(1)
              time.sleep(3)
          PY

      # K8b: the echo example is the container that fetches a tool secret
      # over MCP, so Gate S drives it. Its service is in the demo profile:
      # it starts alone, that one service, and the teardown names the
      # profile so it goes too.
      - name: Start the echo agent alone (K8b)
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.secrets.yaml \
            --profile app --profile viewer --profile demo up -d --build --no-deps echo-agent
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Running}}' librerun-echo-agent 2>/dev/null)" = true ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Running}}' librerun-echo-agent)" = true
          echo "echo-agent running"

      # The proof that the FILE is what bound, and not something else.
      # The bootstrap password exists only in secrets/initial_admin_password
      # — the plain variable is blanked by the overlay — so signing in
      # with it is only possible if the file was read, stripped of its
      # newline, and used.
      - name: The secrets came from the files, and not from the environment
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.secrets.yaml \
            --profile app --profile viewer exec -T backend env > backend-env.txt
          python - <<'PY'
          import json, pathlib, sys
          env = dict(
              line.split("=", 1)
              for line in pathlib.Path("backend-env.txt").read_text().splitlines()
              if "=" in line
          )
          problems = []
          for name in ("APP_SECRET_KEY", "INITIAL_ADMIN_PASSWORD", "LIBRERUN_BACKEND_SECRETS_KEY"):
              if env.get(name, "") != "":
                  problems.append(f"{name} is non-blank in the backend's environment")
              if not env.get(f"{name}_FILE"):
                  problems.append(f"{name}_FILE is not set in the backend's environment")
          canaries = json.load(open("canaries.json"))
          for name, value in canaries.items():
              for key, got in env.items():
                  if value in got:
                      problems.append(
                          f"the {name} canary is in the backend's environment as {key} "
                          f"— the whole point of a file secret is that it is NOT"
                      )
          if problems:
              sys.exit("::error::" + "; ".join(problems))
          print("backend env: the plain variables are blank and the _FILE ones are set")
          PY
          # K7: the gateway's store key likewise, and the backend never
          # holds it, by either name (D33).
          docker compose -f compose.yaml -f compose.secrets.yaml \
            --profile app --profile viewer exec -T gateway env > gateway-env.txt
          python - <<'PY'
          import json, pathlib, sys
          def env_of(path):
              return dict(
                  line.split("=", 1)
                  for line in pathlib.Path(path).read_text().splitlines()
                  if "=" in line
              )
          gateway, backend = env_of("gateway-env.txt"), env_of("backend-env.txt")
          problems = []
          if gateway.get("LIBRERUN_GATEWAY_SECRETS_KEY", "") != "":
              problems.append("LIBRERUN_GATEWAY_SECRETS_KEY is non-blank in the gateway's environment")
          if not gateway.get("LIBRERUN_GATEWAY_SECRETS_KEY_FILE"):
              problems.append("LIBRERUN_GATEWAY_SECRETS_KEY_FILE is not set in the gateway's environment")
          for name in ("LIBRERUN_GATEWAY_SECRETS_KEY", "LIBRERUN_GATEWAY_SECRETS_KEY_FILE"):
              if name in backend:
                  problems.append(f"{name} reached the backend's environment")
          for name, value in json.load(open("canaries.json")).items():
              for key, got in gateway.items():
                  if value in got:
                      problems.append(f"the {name} canary is in the gateway's environment as {key}")
          if problems:
              sys.exit("::error::" + "; ".join(problems))
          print("gateway env: its store key is blank and its _FILE set; the backend holds neither")
          PY
          # And the login the file makes possible. `$(cat …)` strips the
          # trailing newline, which is what the settings model does too —
          # a password sent with a `\n` on the end would fail here and
          # look like the file never bound.
          PW=$(cat secrets/initial_admin_password)
          BODY=$(python3 -c 'import json,sys;print(json.dumps({"email":sys.argv[1],"password":sys.argv[2]}))' "$INITIAL_ADMIN_EMAIL" "$PW")
          code=$(curl -sS -o login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d "$BODY" \
            http://localhost:8000/api/v1/auth/login)
          test "$code" = "200" || {
            echo "::error::signing in with the password that exists ONLY in secrets/initial_admin_password returned $code — the _FILE value did not bind"
            exit 1
          }
          echo "signed in with the file-delivered password"

      # L31's most direct form: the object that holds every secret,
      # printed. Both processes, because one helper serving two models is
      # only worth something if both are wired to it.
      - name: A settings dump shows ********** for every secret field
        run: |
          set -euo pipefail
          C="docker compose -f compose.yaml -f compose.secrets.yaml --profile app --profile viewer"
          $C exec -T backend python -c 'import app.config as m; print(repr(m.settings))' > backend-settings.txt
          $C exec -T gateway python -c 'import gateway.config as m; print(repr(m.settings))' > gateway-settings.txt
          python - <<'PY'
          import json, pathlib, sys

          canaries = json.load(open("canaries.json"))
          # A SecretStr that HOLDS something renders `SecretStr(
          # '**********')`; an empty one renders `SecretStr('')`, because
          # there is nothing to hide. So the fields this deployment
          # really sets must show the stars — those are the ones a dump
          # could leak — and the rest need only be SecretStr-typed, which
          # is what makes them safe the day somebody fills them in.
          expected = {
              "backend-settings.txt": {
                  "set": [
                      "APP_SECRET_KEY", "INITIAL_ADMIN_PASSWORD",
                      "DATABASE_URL", "REDIS_URL",
                      "LIBRERUN_BACKEND_SECRETS_KEY",
                  ],
                  # TAVILY_API_KEY left the model at K8a (L13): the demo
                  # agent's key is its declared tool secret, read through
                  # the secrets capability, and no field of this dump.
                  "blank": [
                      "AZURE_CLIENT_SECRET",
                      "INITIAL_USER_PASSWORD", "PINECONE_API_KEY",
                  ],
              },
              "gateway-settings.txt": {
                  "set": ["OPENAI_API_KEY", "DATABASE_URL", "REDIS_URL",
                          "LIBRERUN_GATEWAY_SECRETS_KEY"],
                  "blank": ["ANTHROPIC_API_KEY", "GOOGLE_AI_API_KEY"],
              },
          }
          for path, groups in expected.items():
              dump = pathlib.Path(path).read_text()
              for name, value in canaries.items():
                  if value in dump:
                      sys.exit(f"::error::{path} prints the {name} canary in clear")
              for field in groups["set"]:
                  if f"{field}=SecretStr('**********')" not in dump:
                      sys.exit(
                          f"::error::{path} does not mask {field}, which this "
                          f"deployment SETS. A settings dump reaches a log the "
                          f"moment anything prints the object."
                      )
              for field in groups["blank"]:
                  if f"{field}=SecretStr(" not in dump:
                      sys.exit(
                          f"::error::{path} does not declare {field} as a "
                          f"SecretStr, so it would print in clear the day this "
                          f"deployment fills it in."
                      )
              total = len(groups["set"]) + len(groups["blank"])
              print(f"{path}: {total} secret field(s) — "
                    f"{len(groups['set'])} set and masked, "
                    f"{len(groups['blank'])} blank and typed")
              # Print it: this IS the settings dump in the log the Accept
              # item asks for, and it has just been proven safe to show.
              print(dump)
          PY

      # A whole run, so the sweep below has real traffic, a real report
      # and a real trace to look through rather than an idle stack.
      - name: Run the scenario smoke against the file-booted stack
        run: |
          set -euo pipefail
          python scripts/librerun_smoke.py \
            --base-url http://localhost:8000 \
            --email="$INITIAL_ADMIN_EMAIL" \
            --password="$(cat secrets/initial_admin_password)" \
            --admin-email="$INITIAL_ADMIN_EMAIL" \
            --admin-password="$(cat secrets/initial_admin_password)" \
            --agent vita-v1 \
            --trace-viewer-url http://localhost:16686 \
            --summary-json secrets-smoke-summary.json

      # K7: the browser seals a pasted provider key to the gateway's public
      # key; here openssl does, with the page's parameters (RSA-OAEP,
      # SHA-256 and MGF1 SHA-256, the provider's label), from a file and
      # never argv. The sweep posts the blob and must then find the
      # gateway's fingerprint of it in sql:gateway_status, and the key
      # itself nowhere.
      - name: Seal the provider-key canary to the gateway's public key (K7)
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.request

          base = "http://localhost:8000/api/v1"
          def call(method, path, body=None, token=None):
              request = urllib.request.Request(
                  base + path, data=json.dumps(body).encode() if body else None, method=method)
              request.add_header("Content-Type", "application/json")
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read())

          password = pathlib.Path("secrets/initial_admin_password").read_text().rstrip("\n")
          token = call("POST", "/auth/login", {"email": os.environ["INITIAL_ADMIN_EMAIL"],
                                                "password": password})["access_token"]
          deadline = time.time() + 120
          while True:
              listing = call("GET", "/admin/providers", token=token)
              if listing.get("public_key_pem"):
                  break
              if time.time() > deadline:
                  raise SystemExit(f"::error::the gateway published no public key: {listing}")
              time.sleep(3)
          pathlib.Path("k7-gateway-public.pem").write_text(listing["public_key_pem"], encoding="ascii")
          value = json.load(open("canaries.json"))["K7_SEALED_PROVIDER_KEY"]
          pathlib.Path("k7-plain.bin").write_bytes(value.encode("ascii"))
          PY
          label=$(python3 -c 'print(b"librerun-provider-key:v1:anthropic".hex())')
          openssl pkeyutl -encrypt -pubin -inkey k7-gateway-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 -pkeyopt "rsa_oaep_label:$label" \
            -in k7-plain.bin -out k7-sealed.bin
          rm -f k7-plain.bin
          test "$(wc -c < k7-sealed.bin)" -eq 384 || { echo "::error::the sealed blob is not 384 bytes"; exit 1; }
          base64 -w0 k7-sealed.bin > k7-sealed.b64
          openssl pkey -pubin -in k7-gateway-public.pem -outform DER | sha256sum | awk '{print "sealed to SHA256:" $1}'

      - name: Gate S — sweep every sink for a canary
        run: |
          set -euo pipefail
          # The positive control: a value the sweep plants through the
          # admin API and must then find again, in the API's own
          # response, in `app_settings` and in the audit log. Without it
          # "no canaries found" and "did not look" are the same result.
          MARKER="http://localhost:16686/librerun-sweep-marker-${GITHUB_RUN_ID}"
          # K6: the K6_SETTING_SECRET canary is set as the Microsoft sign-in
          # secret through the API; its fingerprint must then show in
          # sql:secrets, whose rows must hold no canary's plaintext.
          # K7: the sealed K7_SEALED_PROVIDER_KEY blob is posted for
          # anthropic; once the gateway has adopted it, the fingerprint it
          # gave the key must show in sql:gateway_status, the row the
          # gateway writes, and the key's plaintext in no sink.
          # K8a: the K8_TOOL_SECRET canary is set as this tenant's value of
          # the demo agent's tavily_api_key; its fingerprint must show in
          # sql:secrets, and sql:run_output reads what the run persisted.
          # K8b: the K8B_TOOL_SECRET canary is set as the echo example's
          # echo_token, and one echo run with fetch_secret fetches it over
          # MCP — the row's last_used_at is the proof — so sql:run_output
          # holds that run's output too, which must say secret_set and
          # carry no canary.
          # 18 sinks: the 15 of K2 and S7, sql:secrets (K6),
          # sql:gateway_status (K7) and sql:run_output (K8a).
          python3 scripts/secret_sweep.py \
            --canaries canaries.json \
            --report sweep-report.json \
            --compose-file compose.yaml --compose-file compose.secrets.yaml \
            --compose-profile app --compose-profile viewer \
            --api-url http://localhost:8000 \
            --admin-email="$INITIAL_ADMIN_EMAIL" \
            --admin-password="$(cat secrets/initial_admin_password)" \
            --marker="$MARKER" --marker-setting trace_viewer_base_url \
            --marker-sinks 3 \
            --secret-setting auth.azure_client_secret:K6_SETTING_SECRET \
            --sealed-key anthropic:k7-sealed.b64 \
            --tool-secret vita-v1:tavily_api_key:K8_TOOL_SECRET \
            --tool-secret echo-v1:echo_token:K8B_TOOL_SECRET \
            --tool-secret-run 'echo-v1:{"message": "gate s", "fetch_secret": true}' \
            --compose-service backend --compose-service gateway \
            --compose-service postgres --compose-service redis \
            --compose-service vector --compose-service frontend \
            --compose-service jaeger \
            --settings-dump backend:app.config:settings \
            --settings-dump gateway:gateway.config:settings \
            --psql-service postgres --psql-user librerun --psql-db librerun \
            --sql 'app_settings:SELECT key, value::text FROM app_settings' \
            --sql 'audit:SELECT action_type, detail::text, user_email FROM activity_audit_log' \
            --sql 'users:SELECT email, password_hash, auth_provider FROM users' \
            --sql "secrets:SELECT scope, name, key_id, fingerprint, encode(ciphertext, 'escape') FROM secrets" \
            --sql 'gateway_status:SELECT version, stub, providers::text, public_key_pem FROM gateway_status' \
            --sql 'run_output:SELECT r.error_detail, s.analysis::text, s.structured_data::text, s.report_html FROM runs r LEFT JOIN run_snapshots s ON s.run_id = r.id' \
            --jaeger-url http://localhost:16686 \
            --data-dir ./data \
            --expect-sinks 18  # 15 (K2) + secrets (K6) + gateway_status (K7) + run_output (K8a)

      # The report's own audit, run as its own step for the same reason
      # scripts/assert_suite_ran.py is: "the sweep passed" and "the sweep
      # ran" are different claims, and only one of them is what a green
      # check usually means.
      - name: The sweep must have LOOKED, not just passed
        run: |
          set -euo pipefail
          # 18 sinks (sql:secrets is K6's, sql:gateway_status K7's,
          # sql:run_output K8a's), one secret planted through the API with
          # its fingerprint in a sql: sink, one provider key sealed and
          # adopted, its fingerprint in sql:gateway_status, and two tool
          # secrets set, each fingerprint in sql:secrets — the demo agent's
          # (K8a) and the echo example's (K8b) — the second fetched over
          # MCP by a run that completed, its row's last_used_at set.
          python3 scripts/secret_sweep.py --verify-report sweep-report.json \
            --min-sink-bytes 1 --marker-sinks 3 --expect-planted 1 --expect-sealed 1 \
            --expect-tool-secrets 2 --expect-tool-secret-runs 1 \
            --expect-sinks 18  # 15 (K2) + secrets (K6) + gateway_status (K7) + run_output (K8a)
          python3 - <<'PY'
          import json
          report = json.load(open("sweep-report.json"))
          total = sum(s["bytes"] for s in report["sinks"])
          print(f"swept {len(report['sinks'])} sinks, {total} bytes")
          for entry in sorted(report["sinks"], key=lambda s: s["name"]):
              print(f"  {entry['name']:<34} {entry['bytes']:>9} bytes  {entry['note']}")
          for entry in report.get("planted") or []:
              print(f"  planted {entry['slot']} as {entry['setting']}: fingerprint in "
                    f"{', '.join(entry['found_in'])}")
          for entry in report.get("sealed") or []:
              print(f"  sealed a provider key for {entry['provider']}: fingerprint in "
                    f"{', '.join(entry['found_in'])}")
          for entry in report.get("tool_secrets") or []:
              print(f"  set {entry['slot']} as {entry['agent']}'s {entry['name']}: fingerprint in "
                    f"{', '.join(entry['found_in'])}")
          for entry in report.get("tool_secret_runs") or []:
              print(f"  run {entry['run_id']} of {entry['agent']} ended {entry['status']}; "
                    f"{entry['name']} last used at {entry['last_used_before']} before it "
                    f"and {entry['last_used_at']} after it")
          PY

      # K8b: the run the sweep submitted fetched the echo example's secret
      # over MCP (the stamp above); its output says so, and says nothing
      # else of it — the sweep has already found no canary in it.
      - name: The echo run fetched its tool secret, and says only that (K8b)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          BASE = "http://localhost:8000/api/v1"
          (slot,) = json.load(open("sweep-report.json"))["tool_secret_runs"]


          def call(method, path, token=None, body=None):
              request = urllib.request.Request(
                  f"{BASE}{path}", data=json.dumps(body).encode() if body is not None else None, method=method)
              request.add_header("Content-Type", "application/json")
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read() or b"{}")


          with open("secrets/initial_admin_password", encoding="utf-8") as handle:
              password = handle.read().rstrip("\n")
          token = call("POST", "/auth/login", body={
              "email": os.environ["INITIAL_ADMIN_EMAIL"], "password": password})["access_token"]
          detail = call("GET", f"/runs/{slot['run_id']}", token=token)
          output = detail.get("structured_output") or {}
          assert detail.get("status") == "complete", f"the echo run is {detail.get('status')!r}"
          assert output.get("secret_set") is True, (
              f"the echo run's output says secret_set={output.get('secret_set')!r}, not true: "
              f"it did not read the value the sweep set"
          )
          print(f"echo run {slot['run_id']}: complete, secret_set true, "
                f"{slot['name']} last used at {slot['last_used_at']}")
          PY

      # ----------------------------------------------------------------
      # The negative doubles. One per sink class, each injecting the leak
      # that sink exists to catch, each scoped to that sink alone so it
      # proves THAT sink detects rather than riding on an earlier
      # injection. They run last: after the first one, the stack carries
      # a canary on purpose and no clean sweep is possible again.
      # ----------------------------------------------------------------
      - name: The negative doubles — every sink class must turn the sweep red
        run: |
          set -euo pipefail
          C="docker compose -f compose.yaml -f compose.secrets.yaml --profile app --profile viewer"

          # A sweep that FAILS is the pass condition here, so the helper
          # inverts the exit code and says which double it was.
          must_go_red() {
            label="$1"; shift
            if python3 scripts/secret_sweep.py --canaries canaries.json "$@"; then
              echo "::error::negative double '$label' did NOT turn the sweep red. \
          The leak was injected and the sweep says the sink is clean, so that \
          sink proves nothing and Gate S is decorative for it."
              exit 1
            fi
            echo "negative double '$label': the sweep went red, as it must"
          }

          # Arranging an injection and not checking it arrived is the
          # defect these doubles exist to catch, one level up: a `cat`
          # that wrote nowhere would leave the sink genuinely clean, the
          # sweep would pass, and the double would report "the sweep did
          # not go red" — blaming the detector for a leak that was never
          # planted. So each injection is confirmed first, and the two
          # failures read differently.
          injection_landed() {
            label="$1"; shift
            # Captured, then matched with NO pipe. `grep -q` exits at the
            # first match without draining stdin; the producer takes
            # SIGPIPE; `pipefail` makes THAT the pipeline's status; `!`
            # inverts it — so a pipeline in which grep FOUND the canary
            # reports failure, and this check accuses a working injection
            # (#81). Measured: an 11 MB stream with the match at the start
            # exits 141, which is 128 + SIGPIPE. A non-zero producer is
            # not a verdict about what is in the sink, hence `|| true`.
            captured="$("$@" 2>&1 || true)"
            if ! grep -qF -- "$CANARY_VALUE" <<< "$captured"; then
              echo "::error::the '$label' injection did not land: the canary           is not in the sink, so the sweep below would be right to pass and           this double would prove nothing. Fix the injection, not the sweep."
              exit 1
            fi
            echo "injection '$label': the leak is really there"
          }
          CANARY_VALUE=$(cat secrets/app_secret_key)

          # 1. A container's own stdout/stderr — the stream `docker
          #    compose logs` reads, which is NOT an `exec`'s own output.
          #    Postgres, because a server-side `RAISE WARNING` lands in
          #    the server log and therefore on the container's stdout
          #    with certainty and with no extra privilege. Writing to the
          #    backend's `/proc/1/fd/2` was the first attempt and it does
          #    not work: PID 1 there has already dropped to `librerun`,
          #    and opening another user's descriptor through /proc needs
          #    CAP_SYS_PTRACE, which Docker does not grant by default
          #    ("cannot create /proc/1/fd/2: Permission denied"). Handing
          #    a container extra capabilities in order to test a checker
          #    is not worth it: the sweep reads all seven services
          #    through one `docker compose logs` code path, so proving it
          #    on one proves the class — and a secret in a database
          #    server's log is a real leak shape, not a contrived one.
          $C exec -T postgres psql -U librerun -d librerun -q <<SQL
          DO \$\$ BEGIN RAISE WARNING 'negative double: %', '$CANARY_VALUE'; END \$\$;
          SQL
          sleep 2
          injection_landed "container logs" $C logs --no-color postgres
          must_go_red "container logs" \
            --report neg-logs.json \
            --compose-file compose.yaml --compose-file compose.secrets.yaml \
            --compose-profile app --compose-profile viewer \
            --compose-service postgres --expect-sinks 1

          # 2. A file under ./data — the bind mount an operator tails and
          #    a support bundle collects.
          $C exec -T backend sh -c 'cat /run/secrets/app_secret_key >> /app/data/logs/negative-double.log'
          injection_landed "file tree" cat data/logs/negative-double.log
          must_go_red "file tree" --report neg-files.json --data-dir ./data --expect-sinks 1

          # 3. A database row. Written with psql rather than through the
          #    admin API: the sink under test is "a value sitting in a
          #    table", and routing the injection through an endpoint adds
          #    that endpoint's failure modes to a double that is supposed
          #    to be testing the sweep. It did exactly that — the API
          #    route returned 500 on the second write of a setting, which
          #    is gap H17 and not this batch's to fix. The API→row path is
          #    already proven by the positive control above, which the
          #    clean sweep plants through that same endpoint and then
          #    finds in three sinks.
          $C exec -T postgres psql -U librerun -d librerun -q <<SQL
          INSERT INTO app_settings (key, value)
          VALUES ('trace_viewer_base_url', to_jsonb('http://localhost:16686/$CANARY_VALUE'::text))
          ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;
          SQL
          injection_landed "database rows" $C exec -T postgres \
            psql -U librerun -d librerun -A -t -c 'SELECT value::text FROM app_settings'
          must_go_red "database rows" \
            --report neg-sql.json \
            --compose-file compose.yaml --compose-file compose.secrets.yaml \
            --compose-profile app --compose-profile viewer \
            --psql-service postgres --psql-user librerun --psql-db librerun \
            --sql 'app_settings:SELECT key, value::text FROM app_settings' \
            --expect-sinks 1

          # 4. The settings dump: the same sink code path, pointed at the
          #    revealed value instead of the masked field. This is what a
          #    model that lost its SecretStr would print by itself.
          injection_landed "settings dump" $C exec -T backend \
            python -c 'import app.config as m; print(repr(m.settings.APP_SECRET_KEY.get_secret_value()))'
          must_go_red "settings dump" \
            --report neg-dump.json \
            --compose-file compose.yaml --compose-file compose.secrets.yaml \
            --compose-profile app --compose-profile viewer \
            --settings-dump 'backend:app.config:settings.APP_SECRET_KEY.get_secret_value()' \
            --expect-sinks 1

          # K6's three doubles, one per new slot. Each is swept for ITS
          # slot's canary alone — a file holding that one canary, passed
          # after the helper's own --canaries (argparse keeps the last) —
          # so none can go red on a leak an earlier double planted.
          one_canary() {
            python3 - "$1" "$2" <<'PY'
          import json, sys
          canaries = json.load(open("canaries.json"))
          json.dump({sys.argv[1]: canaries[sys.argv[1]]}, open(sys.argv[2], "w"))
          PY
          }
          one_canary K6_SETTING_SECRET neg-canary-setting.json
          one_canary LIBRERUN_BACKEND_SECRETS_KEY neg-canary-store-key.json
          SECRETS_SQL="secrets:SELECT scope, name, key_id, fingerprint, encode(ciphertext, 'escape') FROM secrets"

          # 5. The secret set through the API, stored as its own plaintext
          #    — the row the secrets store exists to keep encrypted.
          CANARY_VALUE=$(python3 -c 'import json;print(json.load(open("neg-canary-setting.json"))["K6_SETTING_SECRET"])')
          $C exec -T postgres psql -U librerun -d librerun -q <<SQL
          UPDATE secrets SET ciphertext = convert_to('$CANARY_VALUE', 'UTF8')
          WHERE scope = 'platform' AND name = 'auth.azure_client_secret';
          SQL
          injection_landed "secrets row" $C exec -T postgres \
            psql -U librerun -d librerun -A -t -c "SELECT encode(ciphertext, 'escape') FROM secrets"
          must_go_red "secrets row" \
            --canaries neg-canary-setting.json --report neg-secrets.json \
            --compose-file compose.yaml --compose-file compose.secrets.yaml \
            --compose-profile app --compose-profile viewer \
            --psql-service postgres --psql-user librerun --psql-db librerun \
            --sql "$SECRETS_SQL" --expect-sinks 1

          # 6. The same secret in a config_change audit detail — where the
          #    settings PUT writes {setting, action} and never a value.
          $C exec -T postgres psql -U librerun -d librerun -q <<SQL
          INSERT INTO activity_audit_log (tenant_id, action_type, detail)
          SELECT id, 'config_change',
                 jsonb_build_object('setting', 'auth.azure_client_secret', 'value', '$CANARY_VALUE')
          FROM tenants WHERE slug = 'dev';
          SQL
          injection_landed "audit detail" $C exec -T postgres \
            psql -U librerun -d librerun -A -t -c 'SELECT detail::text FROM activity_audit_log'
          must_go_red "audit detail" \
            --canaries neg-canary-setting.json --report neg-audit.json \
            --compose-file compose.yaml --compose-file compose.secrets.yaml \
            --compose-profile app --compose-profile viewer \
            --psql-service postgres --psql-user librerun --psql-db librerun \
            --sql 'audit:SELECT action_type, detail::text, user_email FROM activity_audit_log' \
            --expect-sinks 1

          # 7. The store's own key in a file under ./data.
          CANARY_VALUE=$(cat secrets/backend_secrets_key)
          $C exec -T backend sh -c 'cat /run/secrets/backend_secrets_key >> /app/data/logs/negative-double-store-key.log'
          injection_landed "store key in ./data" cat data/logs/negative-double-store-key.log
          must_go_red "store key in ./data" \
            --canaries neg-canary-store-key.json --report neg-store-key.json \
            --data-dir ./data --expect-sinks 1

          # K7's two doubles, likewise one slot's canary each. The gateway
          # rewrites gateway_status only when its own view changes, which an
          # UPDATE from outside does not, so each injection holds until its
          # sweep has read it.
          one_canary K7_SEALED_PROVIDER_KEY neg-canary-sealed.json
          one_canary LIBRERUN_GATEWAY_SECRETS_KEY neg-canary-gateway-key.json

          # 8. The pasted provider key itself in the status row's list of
          #    providers — where the gateway writes each key's fingerprint
          #    and never the key.
          CANARY_VALUE=$(python3 -c 'import json;print(json.load(open("neg-canary-sealed.json"))["K7_SEALED_PROVIDER_KEY"])')
          $C exec -T postgres psql -U librerun -d librerun -q <<SQL
          UPDATE gateway_status SET providers = providers || jsonb_build_array(
            jsonb_build_object('name', 'anthropic', 'key', '$CANARY_VALUE'));
          SQL
          injection_landed "provider key in gateway_status" $C exec -T postgres \
            psql -U librerun -d librerun -A -t -c 'SELECT providers::text FROM gateway_status'
          must_go_red "provider key in gateway_status" \
            --canaries neg-canary-sealed.json --report neg-gateway-status.json \
            --compose-file compose.yaml --compose-file compose.secrets.yaml \
            --compose-profile app --compose-profile viewer \
            --psql-service postgres --psql-user librerun --psql-db librerun \
            --sql 'gateway_status:SELECT version, stub, providers::text, public_key_pem FROM gateway_status' \
            --expect-sinks 1

          # 9. The gateway's store key as the ciphertext of the row it
          #    seals: the stored provider key the sweep posted above.
          CANARY_VALUE=$(cat secrets/gateway_secrets_key)
          $C exec -T postgres psql -U librerun -d librerun -q <<SQL
          UPDATE secrets SET ciphertext = convert_to('$CANARY_VALUE', 'UTF8')
          WHERE scope = 'gateway' AND name = 'provider.anthropic';
          SQL
          injection_landed "gateway store key in secrets" $C exec -T postgres \
            psql -U librerun -d librerun -A -t -c "SELECT encode(ciphertext, 'escape') FROM secrets"
          must_go_red "gateway store key in secrets" \
            --canaries neg-canary-gateway-key.json --report neg-gateway-key.json \
            --compose-file compose.yaml --compose-file compose.secrets.yaml \
            --compose-profile app --compose-profile viewer \
            --psql-service postgres --psql-user librerun --psql-db librerun \
            --sql "$SECRETS_SQL" --expect-sinks 1

          # K8a's double, one slot's canary as before.
          one_canary K8_TOOL_SECRET neg-canary-tool.json

          # 10. A run echoing its tool secret past the scrub: the canary
          #    the sweep set as this tenant's tavily_api_key, written by
          #    psql into the newest run's persisted report — what the runner
          #    exists to keep out (D20).
          CANARY_VALUE=$(python3 -c 'import json;print(json.load(open("neg-canary-tool.json"))["K8_TOOL_SECRET"])')
          $C exec -T postgres psql -U librerun -d librerun -q <<SQL
          UPDATE run_snapshots SET report_html = coalesce(report_html, '') || '<p>$CANARY_VALUE</p>'
          WHERE id = (SELECT id FROM run_snapshots ORDER BY created_at DESC LIMIT 1);
          SQL
          injection_landed "run output" $C exec -T postgres \
            psql -U librerun -d librerun -A -t -c 'SELECT report_html FROM run_snapshots'
          must_go_red "run output" \
            --canaries neg-canary-tool.json --report neg-run-output.json \
            --compose-file compose.yaml --compose-file compose.secrets.yaml \
            --compose-profile app --compose-profile viewer \
            --psql-service postgres --psql-user librerun --psql-db librerun \
            --sql 'run_output:SELECT r.error_detail, s.analysis::text, s.structured_data::text, s.report_html FROM runs r LEFT JOIN run_snapshots s ON s.run_id = r.id' \
            --expect-sinks 1

          # 11. And the verifier itself: a report that read NOTHING must
          #    be refused, or "no canaries found" would be free.
          python3 -c "import json;json.dump({'sinks':[],'findings':[],'marker_found_in':[],'canaries':[]},open('neg-empty.json','w'))"
          # 18 sinks: 15 (K2) + secrets (K6) + gateway_status (K7) + run_output (K8a).
          if python3 scripts/secret_sweep.py --verify-report neg-empty.json --expect-sinks 18 --marker-sinks 3; then
            echo "::error::the verifier accepted a report with no sinks in it — a sweep that looked at nothing would pass"
            exit 1
          fi
          echo "negative double 'empty report': the verifier refused it, as it must"

          # 12. K8b's three. The canary the sweep set as the echo example's
          #    echo_token, written by psql into the snapshot of the run
          #    that fetched it — the output the echo agent must never put
          #    it in — turns sql:run_output red; and the real report is
          #    refused twice over, once with that run slot's last_used_at
          #    removed and once with the stamp it had before the run set
          #    to the one after, since only a stamp the run moved proves a
          #    fetch over MCP (Codex on #186).
          one_canary K8B_TOOL_SECRET neg-canary-echo.json
          ECHO_RUN=$(python3 -c 'import json;print(json.load(open("sweep-report.json"))["tool_secret_runs"][0]["run_id"])')
          CANARY_VALUE=$(python3 -c 'import json;print(json.load(open("neg-canary-echo.json"))["K8B_TOOL_SECRET"])')
          $C exec -T postgres psql -U librerun -d librerun -q <<SQL
          UPDATE run_snapshots
          SET structured_data = coalesce(structured_data, '{}'::jsonb) || jsonb_build_object('leaked', '$CANARY_VALUE')
          WHERE run_id = '$ECHO_RUN';
          SQL
          injection_landed "echo run output" $C exec -T postgres \
            psql -U librerun -d librerun -A -t -c "SELECT structured_data::text FROM run_snapshots WHERE run_id = '$ECHO_RUN'"
          must_go_red "echo run output" \
            --canaries neg-canary-echo.json --report neg-echo-output.json \
            --compose-file compose.yaml --compose-file compose.secrets.yaml \
            --compose-profile app --compose-profile viewer \
            --psql-service postgres --psql-user librerun --psql-db librerun \
            --sql 'run_output:SELECT r.error_detail, s.analysis::text, s.structured_data::text, s.report_html FROM runs r LEFT JOIN run_snapshots s ON s.run_id = r.id' \
            --expect-sinks 1
          python3 - <<'PY'
          import json
          report = json.load(open("sweep-report.json"))
          slot = report["tool_secret_runs"][0]
          stamped = slot["last_used_at"]
          slot["last_used_at"] = None
          json.dump(report, open("neg-unused-run.json", "w"))
          slot["last_used_before"] = slot["last_used_at"] = stamped
          json.dump(report, open("neg-stale-run.json", "w"))
          PY
          if python3 scripts/secret_sweep.py --verify-report neg-unused-run.json --expect-sinks 18 --marker-sinks 3 \
               --expect-tool-secret-runs 1; then
            echo "::error::the verifier accepted a run slot whose row was never used — a run that fetched nothing would vouch for the MCP path"
            exit 1
          fi
          echo "negative double 'unused run slot': the verifier refused it, as it must"
          if python3 scripts/secret_sweep.py --verify-report neg-stale-run.json --expect-sinks 18 --marker-sinks 3 \
               --expect-tool-secret-runs 1; then
            echo "::error::the verifier accepted a run slot whose stamp the run did not move — an earlier fetch would vouch for this run"
            exit 1
          fi
          echo "negative double 'stale run slot': the verifier refused it, as it must"

      - name: Collect the evidence
        if: always()
        run: |
          set -uo pipefail
          mkdir -p secrets-artifacts
          C="docker compose -f compose.yaml -f compose.secrets.yaml --profile app --profile viewer"
          cp sweep-report.json secrets-smoke-summary.json compose.secrets.yaml \
             backend-settings.txt gateway-settings.txt secrets-artifacts/ 2>/dev/null || true
          $C logs --no-color > secrets-artifacts/compose-all.log 2>&1 || true
          # The canary VALUES never leave this runner: only their names.
          # The negative doubles put one into the container log and into
          # ./data ON PURPOSE, so the collected evidence is scrubbed
          # before it is uploaded — an artifact that carries the value
          # the job exists to keep out of artifacts would be a joke.
          python3 - <<'PY' || true
          import json, pathlib
          canaries = json.load(open("canaries.json"))
          out = pathlib.Path("secrets-artifacts")
          for path in out.rglob("*"):
              if not path.is_file():
                  continue
              raw = path.read_bytes().decode("utf-8", "replace")
              cleaned = raw
              for name, value in canaries.items():
                  cleaned = cleaned.replace(value, f"[{name} CANARY REDACTED]")
              if cleaned != raw:
                  path.write_text(cleaned, encoding="utf-8")
                  print(f"scrubbed {path}")
          (out / "canary-names.txt").write_text("\n".join(canaries) + "\n")
          PY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librerun-secrets-as-files-${{ github.run_id }}
          path: secrets-artifacts/
          retention-days: 14

      - name: Tear down
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.secrets.yaml \
            --profile app --profile viewer --profile demo down -v || true
          rm -rf secrets canaries.json neg-canary-*.json compose.secrets.yaml k7-* || true

  # --------------------------------------------------------------------------
  # Encrypted at rest (K3, decision L30): the sops-and-age recipe, run
  # FROM docs/platform/Install.md, on a real stack.
  #
  # The document carries two command blocks between HTML-comment
  # markers — mode A (copies encrypted, host plaintext owner-only) and
  # mode B (no plaintext at rest on the host) — and this job extracts
  # and runs those blocks rather than a copy of them, the way the Gate S
  # job above runs the document's compose overlay. A recipe an operator
  # follows and a recipe CI proves are then the same text: if somebody
  # edits the document into something that does not work, this job is
  # what says so.
  #
  # What mode B proves that no unit test can: with .env and gateway.env
  # ABSENT from disk, `sops exec-env` hands the root file's values to
  # compose.sh through the environment (which is where compose.sh reads
  # the agent keys since K3), `sops exec-file --no-fifo` hands the
  # gateway's file to compose through LIBRERUN_GATEWAY_ENV_FILE, the
  # gateway container comes up holding the provider key, and once the
  # command returns the decrypted temporary file is gone. The negative
  # half recreates the gateway WITHOUT the variable and requires the key
  # to be absent — so the assertion is known to read the container's
  # real environment, and the variable is known to be what delivers the
  # file.
  # --------------------------------------------------------------------------
  encrypted-at-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Pinned to the versions the recipe was verified with (K blueprint
      # §11, K3); the checksum is from the release's own checksums file.
      SOPS_VERSION: v3.13.3
      SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
      SOPS_AGE_KEY_FILE: ${{ github.workspace }}/.k3-age/keys.txt
    steps:
      - uses: actions/checkout@v4

      - name: Install sops and age
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          curl -sSL -o sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  sops" | sha256sum --check
          sudo install -m 0755 sops /usr/local/bin/sops
          rm -f sops
          sops --version
          age --version

      # The plaintext the recipe protects: the demo's .env (generated
      # secret, agent keys, keyless mode) and a gateway.env holding one
      # canary provider key, masked before anything can echo it. The
      # identity is generated here, and .sops.yaml is the committed
      # example with the real recipient in it — the two lines the
      # document tells an operator to change. The comparison copies live
      # in the runner's temp directory, OUTSIDE the checkout, so "no
      # plaintext on disk" below means the checkout.
      - name: Write the plaintext the recipe protects
        run: |
          set -euo pipefail
          test ! -f .env
          ./scripts/demo.sh --env-only
          # The document's command starts the `app` profile alone, so the
          # viewer the demo switches on (Jaeger, under `viewer`) is
          # switched off here, as an operator without one would have it.
          sed -i -e 's/^VECTOR_VIEWER=.*/VECTOR_VIEWER=/' -e 's/^TRACE_VIEWER=.*/TRACE_VIEWER=/' .env
          python - <<'PY'
          import os, pathlib, secrets
          canary = f"CANARY-OPENAI_API_KEY-{secrets.token_hex(16)}"
          print(f"::add-mask::{canary}")
          pathlib.Path("gateway.env").write_text(f"OPENAI_API_KEY={canary}\n", encoding="utf-8")
          keep = pathlib.Path(os.environ["RUNNER_TEMP"]) / "k3"
          keep.mkdir(exist_ok=True)
          (keep / "canary").write_text(canary, encoding="utf-8")
          (keep / "env.before").write_text(pathlib.Path(".env").read_text(encoding="utf-8"), encoding="utf-8")
          (keep / "gateway.env.before").write_text(pathlib.Path("gateway.env").read_text(encoding="utf-8"), encoding="utf-8")
          PY
          chmod 600 gateway.env
          mkdir -p .k3-age
          age-keygen -o .k3-age/keys.txt 2> /dev/null
          recipient=$(grep -o 'age1[0-9a-z]*' .k3-age/keys.txt | head -1)
          sed "s/^    age: age1.*/    age: ${recipient}/" .sops.yaml.example > .sops.yaml
          grep -q "age: ${recipient}" .sops.yaml

      # The recipes come OUT OF THE DOCUMENT, and the job refuses to run
      # if either block is missing or has stopped saying the things the
      # assertions below depend on.
      - name: Take both recipes from docs/platform/Install.md
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, sys
          doc = pathlib.Path("docs/platform/Install.md").read_text(encoding="utf-8")
          blocks = {}
          for mode in ("a", "b"):
              match = re.search(
                  r"<!-- encrypt-at-rest-mode-%s:start -->\s*```bash\n(.*?)```" % mode,
                  doc,
                  re.S,
              )
              if not match:
                  sys.exit(
                      f"docs/platform/Install.md no longer carries the mode {mode.upper()} recipe "
                      f"between its markers — this job runs the DOCUMENT'S recipe and "
                      f"has nothing to run"
                  )
              blocks[mode] = match.group(1)
              pathlib.Path(f"mode-{mode}.sh").write_text(match.group(1), encoding="utf-8")
          expected = (
              ("a", "sops -e .env"),
              ("a", "sops -e gateway.env"),
              ("a", "umask 077"),
              ("a", "# Deploy"),
              ("a", "./compose.sh --profile app up -d"),
              ("b", "sops exec-env encrypted/.env"),
              ("b", "sops exec-file --no-fifo encrypted/gateway.env"),
              ("b", "LIBRERUN_GATEWAY_ENV_FILE={}"),
              ("b", "./compose.sh --profile app up -d"),
          )
          for mode, needed in expected:
              if needed not in blocks[mode]:
                  sys.exit(f"the documented mode {mode.upper()} recipe no longer says {needed!r}")
          print("mode A:\n" + blocks["a"] + "\nmode B:\n" + blocks["b"])
          PY

      # Mode A, in two halves around the document's "# Deploy" line: the
      # encrypt half with the plaintext present, then the plaintext
      # REMOVED (this runner is the deploying host now), then the deploy
      # half — which decrypts owner-only and starts the stack.
      - name: "Mode A: copies encrypted, host plaintext owner-only"
        run: |
          set -euo pipefail
          sed -n '1,/^# Deploy/p' mode-a.sh > mode-a-encrypt.sh
          sed -n '/^# Deploy/,$p' mode-a.sh > mode-a-deploy.sh
          bash -euo pipefail mode-a-encrypt.sh
          python - <<'PY'
          import os, pathlib, sys
          keep = pathlib.Path(os.environ["RUNNER_TEMP"]) / "k3"
          canary = (keep / "canary").read_text(encoding="utf-8")
          before = dict(
              line.split("=", 1)
              for line in (keep / "env.before").read_text(encoding="utf-8").splitlines()
              if "=" in line and not line.startswith("#")
          )
          problems = []
          for name in ("encrypted/.env", "encrypted/gateway.env"):
              text = pathlib.Path(name).read_text(encoding="utf-8")
              if canary in text:
                  problems.append(f"{name} carries the provider key in the clear")
              if before["APP_SECRET_KEY"] in text:
                  problems.append(f"{name} carries APP_SECRET_KEY in the clear")
              if "sops_age__list_0__map_recipient=age1" not in text:
                  problems.append(f"{name} is not a sops file")
          if problems:
              sys.exit("\n".join(problems))
          print("both encrypted copies hold no plaintext value")
          PY
          rm -f .env gateway.env agent-keys.env
          test ! -f .env && test ! -f gateway.env
          bash -euo pipefail mode-a-deploy.sh
          python - <<'PY'
          import os, pathlib, stat, sys
          keep = pathlib.Path(os.environ["RUNNER_TEMP"]) / "k3"
          problems = []
          for name, before in ((".env", "env.before"), ("gateway.env", "gateway.env.before")):
              path = pathlib.Path(name)
              mode = stat.S_IMODE(path.stat().st_mode)
              if mode != 0o600:
                  problems.append(f"{name} was decrypted with mode {mode:o}, not 600")
              if path.read_text(encoding="utf-8") != (keep / before).read_text(encoding="utf-8"):
                  problems.append(f"{name} does not round-trip byte for byte")
          if problems:
              sys.exit("\n".join(problems))
          print("both plaintext files back on disk, owner-only, byte for byte")
          PY

      - name: "Mode A: the gateway holds the key"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, sys, time
          COMPOSE = ["./compose.sh", "--profile", "app"]
          def rows():
              # compose.sh prints "Using: docker compose" on stdout before
              # it execs; compose's own output starts at the first JSON
              # line — one object per line on current compose, an array
              # on older ones.
              lines = [l for l in subprocess.run(COMPOSE + ["ps", "-a", "--format", "json"],
                                                 capture_output=True, text=True, check=True).stdout.splitlines()
                       if l.strip()]
              while lines and not lines[0].lstrip().startswith(("{", "[")):
                  lines.pop(0)
              if not lines:
                  return []
              if lines[0].lstrip().startswith("["):
                  return json.loads("\n".join(lines))
              return [json.loads(l) for l in lines if l.lstrip().startswith("{")]
          deadline = time.time() + 300
          while True:
              current = rows()
              gateway = [r for r in current if r.get("Service") == "gateway"]
              state = gateway[0].get("State") if gateway else "missing"
              health = gateway[0].get("Health") if gateway else "missing"
              if state == "running" and health in ("healthy", "", None):
                  print(f"gateway {state} ({health or 'no healthcheck'})")
                  break
              if time.time() > deadline:
                  print(f"::error::gateway is {state} (health={health}) after 300s")
                  subprocess.run(COMPOSE + ["logs", "--no-color", "--tail", "60", "gateway"])
                  sys.exit(1)
              time.sleep(3)
          PY
          ./compose.sh --profile app exec -T gateway env > "$RUNNER_TEMP/k3/gateway-env-mode-a.txt"
          python - <<'PY'
          import os, pathlib, sys
          keep = pathlib.Path(os.environ["RUNNER_TEMP"]) / "k3"
          canary = (keep / "canary").read_text(encoding="utf-8")
          env = dict(line.split("=", 1) for line in (keep / "gateway-env-mode-a.txt").read_text().splitlines() if "=" in line)
          if env.get("OPENAI_API_KEY") != canary:
              sys.exit("mode A: the gateway container does not hold the provider key that gateway.env was decrypted with")
          print("mode A: the gateway holds the provider key from the decrypted gateway.env")
          PY
          ./compose.sh --profile app down

      # Mode B: the document's block, verbatim, with NOTHING on disk —
      # and the checkout is checked before and after. `agent-keys.env`
      # is removed too, so the derivation below can only have read the
      # environment.
      - name: "Mode B: no plaintext at rest on the host"
        run: |
          set -euo pipefail
          rm -f .env gateway.env agent-keys.env
          test ! -f .env && test ! -f gateway.env && test ! -f agent-keys.env
          bash -euo pipefail mode-b.sh
          python - <<'PY'
          import glob, os, pathlib, sys
          keep = pathlib.Path(os.environ["RUNNER_TEMP"]) / "k3"
          problems = []
          for name in (".env", "gateway.env"):
              if pathlib.Path(name).exists():
                  problems.append(f"{name} is on disk after the mode B command — the recipe left plaintext behind")
          leftovers = glob.glob("/tmp/.sops*")
          if leftovers:
              problems.append(f"sops left its decrypted temporary directory behind: {leftovers}")
          derived = pathlib.Path("agent-keys.env")
          if not derived.exists():
              problems.append("compose.sh did not derive agent-keys.env from the environment")
          else:
              before = {
                  line.split("=", 1)[0]: line.split("=", 1)[1]
                  for line in (keep / "env.before").read_text(encoding="utf-8").splitlines()
                  if line.startswith("LIBRERUN_AGENT_KEY_")
              }
              got = {
                  line.split("=", 1)[0]: line.split("=", 1)[1]
                  for line in derived.read_text(encoding="utf-8").splitlines()
                  if "=" in line
              }
              if not before:
                  problems.append("the demo .env carried no agent keys — nothing here was tested")
              if got != before:
                  problems.append(
                      f"agent-keys.env holds {sorted(got)} but the encrypted .env carried "
                      f"{sorted(before)} — the derivation did not read the environment"
                  )
          if problems:
              sys.exit("\n".join(problems))
          print(f"no plaintext on disk; agent-keys.env derived from the environment ({len(got)} keys)")
          PY

      - name: "Mode B: the containers hold what the files held, and only they do"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, sys, time
          COMPOSE = ["./compose.sh", "--profile", "app"]
          def rows():
              # compose.sh prints "Using: docker compose" on stdout before
              # it execs; compose's own output starts at the first JSON
              # line — one object per line on current compose, an array
              # on older ones.
              lines = [l for l in subprocess.run(COMPOSE + ["ps", "-a", "--format", "json"],
                                                 capture_output=True, text=True, check=True).stdout.splitlines()
                       if l.strip()]
              while lines and not lines[0].lstrip().startswith(("{", "[")):
                  lines.pop(0)
              if not lines:
                  return []
              if lines[0].lstrip().startswith("["):
                  return json.loads("\n".join(lines))
              return [json.loads(l) for l in lines if l.lstrip().startswith("{")]
          deadline = time.time() + 300
          while True:
              current = rows()
              wanted = {r.get("Service"): r for r in current if r.get("Service") in ("gateway", "backend")}
              ready = all(
                  r.get("State") == "running" and r.get("Health") in ("healthy", "", None)
                  for r in wanted.values()
              ) and len(wanted) == 2
              if ready:
                  print("gateway and backend running")
                  break
              if time.time() > deadline:
                  for name, r in wanted.items():
                      print(f"::error::{name} is {r.get('State')} (health={r.get('Health')})")
                  subprocess.run(COMPOSE + ["logs", "--no-color", "--tail", "60", "gateway", "backend"])
                  sys.exit(1)
              time.sleep(3)
          PY
          ./compose.sh --profile app exec -T gateway env > "$RUNNER_TEMP/k3/gateway-env.txt"
          ./compose.sh --profile app exec -T backend env > "$RUNNER_TEMP/k3/backend-env.txt"
          python - <<'PY'
          import os, pathlib, sys
          keep = pathlib.Path(os.environ["RUNNER_TEMP"]) / "k3"
          canary = (keep / "canary").read_text(encoding="utf-8")
          before = dict(
              line.split("=", 1)
              for line in (keep / "env.before").read_text(encoding="utf-8").splitlines()
              if "=" in line and not line.startswith("#")
          )
          def env_of(name):
              return dict(line.split("=", 1) for line in (keep / name).read_text().splitlines() if "=" in line)
          gateway, backend = env_of("gateway-env.txt"), env_of("backend-env.txt")
          problems, checked = [], 0
          if gateway.get("OPENAI_API_KEY") != canary:
              problems.append("the gateway does not hold the provider key from the file sops decrypted for it")
          checked += 1
          if backend.get("APP_SECRET_KEY") != before["APP_SECRET_KEY"]:
              problems.append("the backend's APP_SECRET_KEY is not the encrypted .env's — exec-env did not reach compose")
          checked += 1
          for name in ("OPENAI_API_KEY", "ANTHROPIC_API_KEY", "GOOGLE_AI_API_KEY"):
              if backend.get(name):
                  problems.append(f"the backend holds {name} — the partition (L28) broke on the way")
              checked += 1
          for name, value in before.items():
              if name.startswith("LIBRERUN_AGENT_KEY_"):
                  if gateway.get(name) != value:
                      problems.append(f"the gateway does not hold {name} — agent-keys.env was not derived from the environment")
                  checked += 1
          if checked < 6:
              problems.append(f"only {checked} checks ran — the demo .env is not what this job expects")
          if problems:
              sys.exit("\n".join(problems))
          print(f"mode B: {checked} checks — the gateway holds the provider key and every agent key, the backend holds its secret and no provider key")
          PY

      # The negative half. Recreate the gateway inside `sops exec-env`
      # alone — the root file's values in the environment, but no
      # LIBRERUN_GATEWAY_ENV_FILE and no gateway.env on disk — and the
      # key must be ABSENT from the container. If it were still there,
      # either the assertion above was reading something other than the
      # container's environment, or the variable is not what delivers
      # the file; both would make the green above worthless.
      - name: "Mode B, negative: without the variable the gateway has no key"
        run: |
          set -euo pipefail
          test ! -f gateway.env
          sops exec-env encrypted/.env './compose.sh --profile app up -d --no-deps --force-recreate gateway'
          for _ in $(seq 1 60); do
            # Only the JSON lines: compose.sh prints its "Using:" banner first.
            state=$(./compose.sh --profile app ps --format json gateway | python -c 'import json,sys; rows=[json.loads(l) for l in sys.stdin.read().splitlines() if l.startswith("{")]; print(rows[0].get("State","") if rows else "")')
            [ "$state" = "running" ] && break
            sleep 3
          done
          ./compose.sh --profile app exec -T gateway env > "$RUNNER_TEMP/k3/gateway-env-negative.txt"
          python - <<'PY'
          import os, pathlib, sys
          keep = pathlib.Path(os.environ["RUNNER_TEMP"]) / "k3"
          canary = (keep / "canary").read_text(encoding="utf-8")
          env = dict(line.split("=", 1) for line in (keep / "gateway-env-negative.txt").read_text().splitlines() if "=" in line)
          if env.get("OPENAI_API_KEY", "") == canary:
              sys.exit(
                  "the gateway still holds the provider key with LIBRERUN_GATEWAY_ENV_FILE unset and no "
                  "gateway.env on disk — the positive check above is not reading what it claims to"
              )
          if not any(name.startswith("LIBRERUN_AGENT_KEY_") for name in env):
              sys.exit("the recreated gateway holds no agent key at all — this recreate did not go through compose.sh")
          print("negative half: no provider key without the variable; the agent keys still arrived through the environment")
          PY
          ./compose.sh --profile app down

  # ==========================================================================
  # The HAND-CONFIGURED path (blueprint K4): `cp .env.example .env`, four
  # values, and the keyless demo boots.
  #
  # `scenario-smoke` above proves the zero-config path — `scripts/demo.sh`
  # writes its own `.env` and nobody edits it. That is the path a newcomer
  # takes first and the only one CI has ever run, so the path
  # docs/platform/Install.md §1 actually documents has never been exercised: an
  # example file that no longer boots would have gone green on every
  # check in the repository.
  #
  # K4 rewrote that file under four class banners and moved variables out
  # of it, which is exactly the change that can break it. So this job
  # copies the shipped example, sets the FOUR values §1 names, and drives
  # the same G0 gate: sign in, submit, approve, read the report back.
  # Nothing else is edited, and the job asserts that — four changed lines
  # and no fifth, or the document is wrong about its own minimum.
  # ==========================================================================
  hand-configured-boot:
    runs-on: ubuntu-latest
    # `--profile app` builds the backend and the frontend, which is what
    # §5's staging-mode command does and therefore what this job has to
    # run; no agent container is built, so it is well under
    # `scenario-smoke`'s 45. A job that times out reports nothing about
    # what it was checking.
    timeout-minutes: 40
    env:
      COMPOSE_PROFILES: app
    steps:
      - uses: actions/checkout@v4

      - name: cp .env.example .env, then the four documented values
        run: |
          set -euo pipefail
          test ! -f .env
          cp .env.example .env
          python - <<'PY'
          import os, pathlib, re, secrets

          wanted = {
              "APP_SECRET_KEY": secrets.token_urlsafe(48),
              "INITIAL_ADMIN_EMAIL": "operator@example.com",
              "INITIAL_ADMIN_PASSWORD": secrets.token_urlsafe(24),
              "LIBRERUN_STUB_LLM": "true",
          }
          path = pathlib.Path(".env")
          lines = path.read_text(encoding="utf-8").splitlines()
          changed = []
          for index, line in enumerate(lines):
              match = re.match(r"^([A-Z][A-Z0-9_]*)=", line)
              if match and match.group(1) in wanted:
                  lines[index] = f"{match.group(1)}={wanted[match.group(1)]}"
                  changed.append(match.group(1))
          # Every one of the four must have been an EXISTING uncommented
          # line: the claim is "cp and edit four values", not "cp and
          # then know which four to add".
          assert sorted(changed) == sorted(wanted), (
              f"expected to edit {sorted(wanted)} in place, edited {sorted(changed)} — "
              f"a value the document calls a minimum is not a line of the example"
          )
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # Masks first, and to STDOUT — that is where the runner reads
          # workflow commands. The two variables are appended to
          # $GITHUB_ENV by hand rather than by redirecting this script's
          # stdout into it, because that file takes `KEY=value` lines and
          # nothing else: a `::add-mask::` line in it is rejected with
          # "Unable to process file command 'env' successfully", which is
          # how the first run of this job failed.
          print(f"::add-mask::{wanted['APP_SECRET_KEY']}")
          print(f"::add-mask::{wanted['INITIAL_ADMIN_PASSWORD']}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SMOKE_ADMIN_EMAIL={wanted['INITIAL_ADMIN_EMAIL']}\n")
              env_file.write(f"SMOKE_ADMIN_PASSWORD={wanted['INITIAL_ADMIN_PASSWORD']}\n")
          print(f"edited in place: {sorted(changed)}")
          PY

      - name: …and nothing else was edited
        run: |
          set -euo pipefail
          # `diff` exits 1 when files differ, and `set -o pipefail` would
          # make that abort the step before the message below is printed
          # — so each capture swallows the status and the assertion does
          # the talking.
          changed="$(diff <(sed 's/=.*//' .env.example) <(sed 's/=.*//' .env) | wc -l || true)"
          test "$changed" -eq 0 || { echo "::error::.env and .env.example differ in shape, not only in values"; exit 1; }
          n="$(diff .env.example .env | grep -c '^> ' || true)"
          if [ "$n" -ne 4 ]; then
            echo "::error::$n lines differ from the shipped example, not 4 — docs/platform/Install.md §1 says four values are the minimum for a keyless demo"
            diff .env.example .env | sed 's/=.*/=<redacted>/' || true
            exit 1
          fi
          echo "exactly four values changed, and no line added or removed"

      # No gateway.env, no observability.env: the keyless demo holds no
      # provider key and forwards to no vendor (D11). Their absence is
      # part of what this job proves, so it asserts it rather than
      # assuming CI starts clean.
      - name: No optional file is on disk
        run: |
          set -euo pipefail
          test ! -f gateway.env
          test ! -f observability.env
          test ! -f observability-traces.env

      - name: Boot the stack the way §1 says
        run: |
          set -euo pipefail
          ./compose.sh --profile app up -d --build
          ./.github/scripts/wait_healthy.sh backend 300
          # …and the gateway, which the backend deliberately does NOT
          # wait for: `compose.yaml` gives backend `gateway:
          # condition: service_started`, with its reason written down —
          # "a run that reaches a model before the gateway is up fails
          # that phase with a named error, which beats holding the whole
          # API closed behind it". That is the right platform decision
          # and it is exactly what makes the next step's first
          # assertion — `meta["gateway"] == "ok"` — a race: the gateway
          # healthcheck carries `start_period: 60s`, so the backend can
          # be healthy and answering while the gateway is still coming
          # up. Observed both ways on one commit: a ~29s boot read
          # "ok", a ~4m45s boot read "unreachable" (issue #85). Waited
          # for HERE, in the job that needs it, rather than by promoting
          # compose's condition to service_healthy, which would trade a
          # correct design for a convenient one.
          ./.github/scripts/wait_healthy.sh gateway 300
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null; then
              echo "backend answering on the published port"; break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::the backend never answered on :8000"
              ./compose.sh --profile app logs --no-color --tail 80 backend
              exit 1
            fi
            sleep 3
          done

      - name: The stack is keyless, and the backend holds no provider key
        run: |
          set -euo pipefail
          meta="$(curl -fsS http://localhost:8000/api/v1/meta)"
          echo "$meta"
          python - "$meta" <<'PY'
          import json, sys

          meta = json.loads(sys.argv[1])
          # `stub_llm` is null, not false, when the gateway cannot be
          # reached — "not stubbed" would be a guess. So assert the
          # gateway answered FIRST, or a down gateway reads as a
          # configuration failure it is not.
          assert meta.get("gateway") == "ok", (
              f"the gateway is {meta.get('gateway')!r}; /meta cannot say whether this "
              f"deployment is keyless, so nothing below means anything"
          )
          assert meta.get("stub_llm") is True, (
              f"stub_llm is {meta.get('stub_llm')!r} after LIBRERUN_STUB_LLM=true in a "
              f"hand-copied .env — the value is not reaching the gateway"
          )
          assert meta.get("demo") is False, (
              f"demo is {meta.get('demo')!r}; this is the hand-configured path, and "
              f"demo mode would excuse a default secret the operator never set"
          )
          assert meta.get("agents"), "no agent was discovered from the shipped LIBRERUN_AGENTS_PATH"
          print(f"keyless per /meta, agents: {[a['id'] for a in meta['agents']]}")
          PY
          if ./compose.sh --profile app exec -T backend env | grep -E '^(OPENAI|ANTHROPIC|GOOGLE_AI)_API_KEY='; then
            echo "::error::the backend received a provider key from a hand-copied .env.example — D11 and L28 both say it must not"
            exit 1
          fi
          echo "backend env: no provider key"

      - name: Drive the G0 gate against it
        run: |
          set -euo pipefail
          python3 scripts/librerun_smoke.py \
            --base-url http://localhost:8000 \
            --agent vita-v1 \
            --email="$SMOKE_ADMIN_EMAIL" --password="$SMOKE_ADMIN_PASSWORD" \
            --admin-email="$SMOKE_ADMIN_EMAIL" --admin-password="$SMOKE_ADMIN_PASSWORD" \
            --summary-json hand-configured-summary.json

      - name: Diagnostics
        if: always()
        run: |
          mkdir -p hand-configured-artifacts
          cp hand-configured-summary.json hand-configured-artifacts/ 2>/dev/null || true
          sed 's/=.*/=<redacted>/' .env > hand-configured-artifacts/env.shape 2>/dev/null || true
          ./compose.sh --profile app logs --no-color backend > hand-configured-artifacts/backend.log 2>&1 || true
          ./compose.sh --profile app logs --no-color gateway > hand-configured-artifacts/gateway.log 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hand-configured-artifacts
          path: hand-configured-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: ./compose.sh --profile app down -v || true

  # --------------------------------------------------------------------------
  # tls-edge — the TLS gate (K blueprint §3.5, T1; decisions L35, D37).
  #
  # The opt-in `tls` profile as an operator runs it from Install.md's "HTTPS
  # at the edge": `cp .env.example .env`, the four keyless values, the
  # guard's four lines, and LIBRERUN_TLS_DOMAIN naming the host. The edge
  # runs on its own local CA, and every step reaches it as `librerun.test` —
  # an /etc/hosts alias, because a browser treats `localhost` as a secure
  # context even over plain HTTP, so a walk on localhost never meets the
  # branch an outsider meets (K7's plain-HTTP negative runs here too, later).
  #
  # The negative runs FIRST, on a runner with no container at all: with
  # BACKEND_PORT=0.0.0.0:8000 exported, compose.sh must exit 4 naming the
  # line and start nothing. Then, against the booted stack: the UI and
  # /api/v1/meta over HTTPS with the root copied out of librerun-edge;
  # nothing but the edge published off loopback in the resolved config; the
  # four headers and the CSP; the audit row of a sign-in carrying neither
  # the edge's address nor a forged X-Forwarded-For; doctor signing in
  # through this checkout's edge; G0 through the edge; and last, a migration
  # that raises, which must stop the backend rather than boot it on a stale
  # schema.
  # --------------------------------------------------------------------------
  tls-edge:
    runs-on: ubuntu-latest
    # Builds the backend, the gateway and the web UI, like
    # hand-configured-boot, then drives G0 through the edge.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: cp .env.example .env, its four values and the guard's four lines
        run: |
          set -euo pipefail
          test ! -f .env
          cp .env.example .env
          python - <<'PY'
          import os, pathlib, re, secrets

          wanted = {
              # The keyless minimum (Install.md §1).
              "APP_SECRET_KEY": secrets.token_urlsafe(48),
              "INITIAL_ADMIN_EMAIL": "operator@example.com",
              "INITIAL_ADMIN_PASSWORD": secrets.token_urlsafe(24),
              "LIBRERUN_STUB_LLM": "true",
              # The four lines compose.sh's loopback guard holds. The two
              # ports are loopback by default since T1, and are written
              # anyway: the claim is the four lines, not the defaults.
              "BACKEND_PORT": "127.0.0.1:8000",
              "FRONTEND_PORT": "127.0.0.1:3000",
              "NEXT_PUBLIC_API_URL": "/api/v1",
              "BACKEND_INTERNAL_URL": "http://backend:8000",
              # The name the edge answers by, which is not a secure
              # context by itself.
              "LIBRERUN_TLS_DOMAIN": "librerun.test",
          }
          path = pathlib.Path(".env")
          lines = path.read_text(encoding="utf-8").splitlines()
          changed = []
          for index, line in enumerate(lines):
              match = re.match(r"^([A-Z][A-Z0-9_]*)=", line)
              if match and match.group(1) in wanted:
                  lines[index] = f"{match.group(1)}={wanted[match.group(1)]}"
                  changed.append(match.group(1))
          # Every one must be an EXISTING uncommented line of the example.
          assert sorted(changed) == sorted(wanted), (
              f"expected to edit {sorted(wanted)} in place, edited {sorted(changed)}"
          )
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          # Masks to stdout; the two values to GITHUB_ENV by hand (see
          # hand-configured-boot for why not by redirection).
          print(f"::add-mask::{wanted['APP_SECRET_KEY']}")
          print(f"::add-mask::{wanted['INITIAL_ADMIN_PASSWORD']}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SMOKE_ADMIN_EMAIL={wanted['INITIAL_ADMIN_EMAIL']}\n")
              env_file.write(f"SMOKE_ADMIN_PASSWORD={wanted['INITIAL_ADMIN_PASSWORD']}\n")
          print(f"edited in place: {sorted(changed)}")
          PY

      - name: librerun.test is this runner (an /etc/hosts alias)
        run: |
          set -euo pipefail
          echo "127.0.0.1 librerun.test" | sudo tee -a /etc/hosts
          getent hosts librerun.test

      - name: "Negative first: BACKEND_PORT=0.0.0.0:8000 exported, the guard exits 4 and nothing starts"
        # The runner's shell is `bash -e`, which `set -uo pipefail` does not
        # turn off: the status is taken with `||`, or the refusal itself
        # would end the step before it is read.
        run: |
          set -uo pipefail
          before="$(docker ps -aq --filter name=librerun-)"
          if [ -n "$before" ]; then
            echo "::error::a librerun- container existed before the negative: $before"; exit 1
          fi
          code=0
          BACKEND_PORT=0.0.0.0:8000 ./compose.sh --profile app --profile tls up -d > negative.log 2>&1 || code=$?
          cat negative.log
          if [ "$code" -ne 4 ]; then
            echo "::error::compose.sh exited $code, not 4: the loopback guard did not refuse BACKEND_PORT=0.0.0.0:8000"; exit 1
          fi
          if ! grep -qF 'BACKEND_PORT=127.0.0.1:8000' negative.log; then
            echo "::error::the refusal does not name BACKEND_PORT=127.0.0.1:8000"; exit 1
          fi
          after="$(docker ps -aq --filter name=librerun-)"
          if [ -n "$after" ]; then
            echo "::error::the guard refused, yet these containers exist: $after"; exit 1
          fi
          echo "refused with exit 4, the line named, no librerun- container"

      - name: Pull the edge image (five tries, backing off)
        # No CI pull strategy exists — no workflow logs in to a registry
        # (R11) — so a Docker Hub hiccup is retried here rather than
        # failing the gate for a reason that is not the gate's.
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            if ./compose.sh --profile app --profile tls pull edge; then exit 0; fi
            echo "pull attempt $attempt failed; backing off"
            sleep $((attempt * 15))
          done
          echo "::error::the edge image did not pull in five tries"; exit 1

      # K7: so the gateway publishes a public key, and the refusal the walk
      # below meets on the plain origin is D19's (no secure context), not
      # the no-key branch's. Owner-only, like the file the demo writes.
      - name: A gateway.env holding the gateway's store key (K7)
        run: |
          set -euo pipefail
          test ! -f gateway.env
          ( umask 077 && python3 -c 'import base64,os;print("LIBRERUN_GATEWAY_SECRETS_KEY=" + base64.urlsafe_b64encode(os.urandom(32)).decode())' > gateway.env )
          test "$(stat -c %a gateway.env)" = 600
          echo "gateway.env: the store key, mode 600"

      - name: Boot the stack with the edge
        run: |
          set -euo pipefail
          ./compose.sh --profile app --profile tls up -d --build
          ./.github/scripts/wait_healthy.sh backend 300
          ./.github/scripts/wait_healthy.sh gateway 300

      - name: Copy the edge's local root out of librerun-edge
        run: |
          set -uo pipefail
          for _ in $(seq 1 30); do
            if docker cp librerun-edge:/data/caddy/pki/authorities/local/root.crt edge-root.crt 2>/dev/null; then break; fi
            sleep 2
          done
          test -s edge-root.crt || { echo "::error::no root.crt in the edge's data volume"; docker logs librerun-edge | tail -40; exit 1; }
          openssl x509 -in edge-root.crt -noout -subject -enddate -fingerprint -sha256

      - name: The UI and /api/v1/meta over HTTPS, verified against the copied root
        run: |
          set -uo pipefail
          answer=""
          for _ in $(seq 1 60); do
            answer="$(curl -sS -o login.html -w '%{http_code} %{content_type}' --cacert edge-root.crt https://librerun.test:8443/login || true)"
            case "$answer" in "200 text/html"*) break ;; esac
            sleep 3
          done
          echo "/login: $answer"
          case "$answer" in "200 text/html"*) ;; *) echo "::error::https://librerun.test:8443/login answered '$answer', not 200 HTML"; exit 1 ;; esac
          grep -qi '<html' login.html || { echo "::error::/login is not an HTML page"; exit 1; }
          meta="$(curl -fsS --cacert edge-root.crt https://librerun.test:8443/api/v1/meta)" || { echo "::error::/api/v1/meta did not answer through the edge"; exit 1; }
          echo "$meta"
          python - "$meta" <<'PY'
          import json, sys

          meta = json.loads(sys.argv[1])
          assert meta.get("name") == "LibreRun", meta
          assert meta.get("gateway") == "ok", f"the gateway is {meta.get('gateway')!r} through the edge"
          print("meta: LibreRun, gateway ok")
          PY
          # The root is what verified it: without it, the same request is refused.
          if curl -fsS -o /dev/null https://librerun.test:8443/api/v1/meta 2>/dev/null; then
            echo "::error::the edge's certificate verified without its root: the check above proves nothing"; exit 1
          fi
          echo "without --cacert the certificate is refused, as it must be"

      - name: Plain loopback still serves the UI, and /api/v1 through the web UI's rewrite
        # The guard's fourth line is why: the bundle calls /api/v1 on its
        # own origin, and Next's rewrite proxies it to BACKEND_INTERNAL_URL.
        # The rewrite is computed at build time, so the value is a build
        # argument too; built without it, this path answered 404 (K
        # blueprint §11, T1).
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)"
          test "$code" = 200 || { echo "::error::http://localhost:3000/login answered ${code:-nothing}, not 200"; exit 1; }
          meta="$(curl -fsS http://localhost:3000/api/v1/meta)" || {
            echo "::error::http://localhost:3000/api/v1/meta did not answer: the web UI's build has no /api/v1 rewrite"; exit 1; }
          python - "$meta" <<'PY'
          import json, sys

          meta = json.loads(sys.argv[1])
          assert meta.get("name") == "LibreRun", meta
          print("plain loopback: /login 200, and /api/v1/meta through the web UI's rewrite")
          PY

      - name: Nothing but the edge publishes off loopback, in the resolved config
        run: |
          set -euo pipefail
          ./compose.sh --profile app --profile tls config --format json > resolved.raw
          # compose.sh's own "Using:" line comes first; the rest is compose's.
          sed '1{/^Using:/d}' resolved.raw > resolved.json
          python - <<'PY'
          import json

          config = json.load(open("resolved.json", encoding="utf-8"))
          seen, off = {}, {}
          for name, service in sorted(config["services"].items()):
              for port in service.get("ports") or []:
                  host = port.get("host_ip") or ""
                  seen.setdefault(name, []).append(f"{host or '*'}:{port.get('published')}->{port.get('target')}")
                  if host not in ("127.0.0.1", "::1"):
                      off.setdefault(name, []).append(port)
          for name, ports in seen.items():
              print(f"  {name}: {', '.join(ports)}")
          assert set(off) == {"edge"}, f"published off loopback: {off}"
          assert [p["target"] for p in off["edge"]] == [8443], off["edge"]
          assert {"backend", "frontend"} <= set(seen), sorted(seen)
          print("every published port but the edge's is on loopback")
          PY

      - name: The four headers and the CSP
        run: |
          set -euo pipefail
          for path in /login /api/v1/meta; do
            curl -sSI --cacert edge-root.crt "https://librerun.test:8443$path" | tr -d '\r' > "headers$(echo "$path" | tr '/' '_').txt"
          done
          python - <<'PY'
          import glob

          want = {
              "strict-transport-security": "max-age=31536000",
              "x-content-type-options": "nosniff",
              "x-frame-options": "DENY",
              "referrer-policy": "strict-origin-when-cross-origin",
              # K7's policy, byte for byte: every load and send from this
              # origin alone (config/Caddyfile says why each source is there).
              "content-security-policy": (
                  "default-src 'self'; script-src 'self' 'unsafe-inline'; "
                  "style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; "
                  "font-src 'self' data:; connect-src 'self'; form-action 'self'; "
                  "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
              ),
          }
          files = sorted(glob.glob("headers_*.txt"))
          assert len(files) == 2, files
          for file in files:
              headers = {}
              for line in open(file, encoding="utf-8").read().splitlines()[1:]:
                  if ":" in line:
                      name, value = line.split(":", 1)
                      headers.setdefault(name.strip().lower(), []).append(value.strip())
              for name, value in want.items():
                  assert headers.get(name) == [value], f"{file}: {name} is {headers.get(name)}, want [{value!r}]"
              # HTTP/1.1 and HTTP/2 only: the publish is TCP.
              assert "alt-svc" not in headers, f"{file}: alt-svc {headers['alt-svc']}"
              print(f"{file}: the four headers and the CSP, exactly once each")
          PY

      - name: The backend records the client the edge forwarded — never the edge, never a forged header
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, ssl, subprocess, urllib.request

          FORGED = "203.0.113.7"
          EDGE = "https://librerun.test:8443"
          context = ssl.create_default_context(cafile="edge-root.crt")
          email, password = os.environ["SMOKE_ADMIN_EMAIL"], os.environ["SMOKE_ADMIN_PASSWORD"]

          def output(*argv):
              return subprocess.run(argv, check=True, capture_output=True, text=True).stdout.strip()

          (edge,) = output("docker", "inspect", "-f", "{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}", "librerun-edge").split()
          trusted = output("docker", "exec", "librerun-backend", "printenv", "FORWARDED_ALLOW_IPS")
          assert trusted == edge, f"the backend trusts {trusted!r}, the edge is at {edge!r}"
          print(f"the edge is at {edge}; the backend trusts forwarding headers from {trusted} alone")

          def call(method, url, body=None, headers=None, token=None):
              request = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, method=method)
              request.add_header("Content-Type", "application/json")
              for name, value in (headers or {}).items():
                  request.add_header(name, value)
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
              with urllib.request.urlopen(request, timeout=30, context=context if url.startswith("https") else None) as response:
                  return json.loads(response.read())

          def sign_in(base, forged=None):
              headers = {"X-Forwarded-For": forged} if forged else {}
              return call("POST", f"{base}/api/v1/auth/login", {"email": email, "password": password}, headers)["access_token"]

          def newest(token):
              page = call("GET", f"{EDGE}/api/v1/admin/audit-log?action_type=sign_in&per_page=1", token=token)
              return page["total"], page["entries"][0]["ip_address"]

          total, first = newest(sign_in(EDGE))
          print(f"sign-in through the edge: ip_address {first}")
          assert first and first not in (edge, FORGED), f"the edge's sign-in recorded {first!r} (the edge is {edge})"
          for label, base in (("through the edge", EDGE), ("straight to the backend's port", "http://127.0.0.1:8000")):
              count, recorded = newest(sign_in(base, forged=FORGED))
              assert count == total + 1, f"{label}: the newest sign_in row is not this one ({count} rows, had {total})"
              total = count
              print(f"forged X-Forwarded-For: {FORGED} {label}: ip_address {recorded}")
              assert recorded != FORGED, f"{label}: the forged address was recorded"
              assert recorded != edge, f"{label}: the edge's own address was recorded"
          PY

      - name: doctor, with no --base-url, signs in through this checkout's edge
        # What this step holds is the sign-in, so doctor's own exit status
        # (any check it reports failing) is printed rather than allowed to
        # end the step before its report is read.
        run: |
          set -uo pipefail
          set +e
          printf '%s\n' "$SMOKE_ADMIN_PASSWORD" \
            | LIBRERUN_URL=https://librerun.test:8443 LIBRERUN_CA_FILE=edge-root.crt PYTHONPATH=cli/src \
              python3 -m librerun doctor --email "$SMOKE_ADMIN_EMAIL" --password-stdin > doctor.txt 2>&1
          status=$?
          set -e
          cat doctor.txt
          echo "doctor exited $status"
          grep -qF "Backend at https://librerun.test:8443" doctor.txt || { echo "::error::doctor did not take LIBRERUN_URL"; exit 1; }
          grep -qF "signed in as $SMOKE_ADMIN_EMAIL; platform admin: yes" doctor.txt || { echo "::error::doctor did not sign in through this checkout's edge"; exit 1; }
          if grep -qF "not signed in" doctor.txt; then echo "::error::doctor sent nothing"; exit 1; fi

      - name: Drive the G0 gate through the edge
        run: |
          set -euo pipefail
          python3 scripts/librerun_smoke.py \
            --base-url https://librerun.test:8443 --cacert edge-root.crt \
            --agent vita-v1 \
            --email="$SMOKE_ADMIN_EMAIL" --password="$SMOKE_ADMIN_PASSWORD" \
            --admin-email="$SMOKE_ADMIN_EMAIL" --admin-password="$SMOKE_ADMIN_PASSWORD" \
            --summary-json tls-edge-summary.json

      # K7 (D19, D42): Model providers in a real browser. First the plain
      # web UI on http://librerun.test:3000 — not a secure context — which
      # must explain and never post, in a browser context that has not
      # opened the HTTPS origin, since the edge sends HSTS for librerun.test
      # and Chromium would then upgrade the plain origin. Then through the
      # edge: a key sealed and adopted, and not one page — settings, the
      # dashboard, the report G0 just made — raising a
      # securitypolicyviolation under the policy the header step read.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Chromium and Node trust the edge's root (D42)
        # The chain a browser checks, never ignoreHTTPSErrors: the root in
        # Chromium's NSS store, and in NODE_EXTRA_CA_CERTS on the walk
        # below for Node's own requests. Every certutil call gets
        # --empty-password, no terminal and a timeout: asked for a password
        # with no terminal, certutil prompts again, forever.
        run: |
          set -euo pipefail
          command -v certutil > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libnss3-tools; }
          mkdir -p "$HOME/.pki/nssdb"
          if [ ! -f "$HOME/.pki/nssdb/cert9.db" ]; then
            timeout 60 certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password < /dev/null
          fi
          timeout 60 certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n "librerun edge root" -i edge-root.crt < /dev/null
          timeout 60 certutil -d "sql:$HOME/.pki/nssdb" -L < /dev/null

      - name: "The providers walk: the plain origin refuses to seal, the edge seals under its policy (Playwright)"
        working-directory: frontend
        env:
          LR_PROVIDER_WALK: "1"
          LR_PLAIN_URL: http://librerun.test:3000
          LR_BASE_URL: https://librerun.test:8443
          LR_API_URL: https://librerun.test:8443/api/v1
          LR_EMAIL: ${{ env.SMOKE_ADMIN_EMAIL }}
          LR_PASSWORD: ${{ env.SMOKE_ADMIN_PASSWORD }}
          LR_PROVIDER_NAME: anthropic
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/edge-root.crt
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          # A key to seal through the edge: random and masked. The stack is
          # keyless, so the gateway adopts it and never calls with it.
          LR_PROVIDER_KEY="sk-k7-$(python3 -c 'import secrets;print(secrets.token_hex(24))')"
          echo "::add-mask::$LR_PROVIDER_KEY"
          export LR_PROVIDER_KEY
          # D34: the page must seal to the key the gateway logged at boot.
          docker logs librerun-gateway > "$GITHUB_WORKSPACE/gateway-boot.log" 2>&1
          LR_GATEWAY_FINGERPRINT="$(python3 - <<'PY'
          import json, os
          found = []
          for line in open(os.path.join(os.environ["GITHUB_WORKSPACE"], "gateway-boot.log"), encoding="utf-8", errors="replace"):
              if "gateway_sealing_key" in line and "{" in line:
                  try:
                      event = json.loads(line[line.index("{"):])
                  except ValueError:
                      continue
                  if event.get("event") == "gateway_sealing_key":
                      found.append(event.get("fingerprint", ""))
          print(found[-1] if found else "")
          PY
          )"
          test -n "$LR_GATEWAY_FINGERPRINT" || { echo "::error::the gateway never logged gateway_sealing_key"; exit 1; }
          export LR_GATEWAY_FINGERPRINT
          echo "the gateway seals to $LR_GATEWAY_FINGERPRINT"
          # playwright.config.ts matches every *.spec.ts: this one, by name.
          npx playwright test -c e2e/playwright.config.ts providers.spec.ts

      # T2 (L42, L43, D44 refined): the certificates the admin sees and
      # manages, through the edge, as a platform admin. After K7's walk,
      # whose steps trust the copied edge-root.crt that the restore below
      # replaces, and before the migration step, which stays last. The keys
      # are made here with openssl, never committed; every API answer is
      # kept for the sweep, and no key file is uploaded.
      - name: "Certificates (T2): the status names the generated root, and the acknowledgement clears trust_root"
        run: |
          set -euo pipefail
          mkdir -p tls-t2/answers
          cp edge-root.crt tls-t2/trust.pem
          cat > tls-t2/t2.py <<'PY'
          """The T2 steps' helpers: the API through the edge, every answer kept."""
          import hashlib, json, os, ssl, subprocess, time, urllib.error, urllib.request

          EDGE = "https://librerun.test:8443"
          HERE = os.path.dirname(os.path.abspath(__file__))


          def context(cafile=None):
              return ssl.create_default_context(cafile=cafile or os.path.join(HERE, "trust.pem"))


          def call(method, path, body=None, token=None, cafile=None):
              data = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request(EDGE + path, data=data, method=method)
              request.add_header("Content-Type", "application/json")
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(request, timeout=60, context=context(cafile)) as response:
                      status, payload = response.status, response.read()
              except urllib.error.HTTPError as error:
                  status, payload = error.code, error.read()
              kept = len(os.listdir(os.path.join(HERE, "answers")))
              with open(os.path.join(HERE, "answers", f"{kept:03d}.body"), "wb") as handle:
                  handle.write(payload)
              return status, payload


          def token():
              status, payload = call("POST", "/api/v1/auth/login", {
                  "email": os.environ["SMOKE_ADMIN_EMAIL"], "password": os.environ["SMOKE_ADMIN_PASSWORD"]})
              assert status == 200, (status, payload[:200])
              return json.loads(payload)["access_token"]


          def tls(token_):
              status, payload = call("GET", "/api/v1/admin/tls", token=token_)
              assert status == 200, (status, payload[:300])
              return json.loads(payload)


          def der_sha(pem_path):
              der = subprocess.run(["openssl", "x509", "-in", pem_path, "-outform", "DER"],
                                   check=True, capture_output=True).stdout
              return hashlib.sha256(der).hexdigest()


          def edge_state():
              return subprocess.run(["docker", "inspect", "-f", "{{.RestartCount}} {{.State.StartedAt}}", "librerun-edge"],
                                    check=True, capture_output=True, text=True).stdout.strip()


          def served_within(cafile, seconds=30):
              """Seconds until the edge serves a leaf `cafile` verifies, or None."""
              start = time.monotonic()
              while time.monotonic() - start < seconds:
                  code = subprocess.run(["curl", "-fsS", "-o", "/dev/null", "--cacert", cafile,
                                         f"{EDGE}/api/v1/meta"], capture_output=True).returncode
                  if code == 0:
                      return round(time.monotonic() - start, 1)
                  time.sleep(1)
              return None


          def load(kind, cert, key, token_):
              with open(cert) as c, open(key) as k:
                  return call("PUT", f"/api/v1/admin/tls/{kind}", {"certificate": c.read(), "key": k.read()}, token=token_)
          PY
          cd tls-t2
          python3 - <<'PY'
          import json
          import t2

          token = t2.token()
          status = t2.tls(token)
          print(json.dumps({key: status[key] for key in ("site", "issuer", "source", "needs")}))
          root = t2.der_sha("../edge-root.crt")
          assert status["edge"] == "on" and status["issuer"] == {"kind": "internal", "ca": "local", "email": None}, status
          assert status["root"]["sha256"] == root, f"the status names {status['root']['sha256']}, the copied root is {root}"
          assert status["source"] == "environment" and "trust_root" in status["needs"], status["needs"]
          code, payload = t2.call("GET", "/api/v1/admin/tls/root.pem", token=token)
          assert code == 200 and payload.startswith(b"-----BEGIN CERTIFICATE-----"), (code, payload[:80])
          open("served-root.pem", "wb").write(payload)
          assert t2.der_sha("served-root.pem") == root, "root.pem is not the copied root"
          code, payload = t2.call("POST", "/api/v1/admin/tls/acknowledge", token=token)
          acknowledged = json.loads(payload)
          assert code == 200 and acknowledged["acknowledged_root"] == root, (code, payload[:300])
          assert "trust_root" not in acknowledged["needs"], acknowledged["needs"]
          print(f"the generated root {root[:16]}… named, served as root.pem, acknowledged: trust_root cleared")
          PY

      - name: "A certificate that is not a CA, loaded as one, answers 422 naming basicConstraints"
        run: |
          set -euo pipefail
          cd tls-t2
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 365 \
            -subj "/CN=tls-edge not a CA" -addext "basicConstraints=critical,CA:FALSE" \
            -keyout notca.key -out notca.crt 2> /dev/null
          python3 - <<'PY'
          import json
          import t2

          code, payload = t2.load("ca", "notca.crt", "notca.key", t2.token())
          body = json.loads(payload)
          print(code, body)
          assert code == 422 and body["check"] == "basicConstraints" and "basicConstraints" in body["detail"], body
          assert t2.served_within("../edge-root.crt", 5) is not None, "a refused change moved the edge"
          # A body sent into /api/v1/admin/tls any way but the four changes
          # and the backend's three routes — a key to a mistyped path, or
          # with the wrong method — is the edge's 404, and never reaches the
          # backend: the edge's has no body, and the backend's would be JSON.
          token = t2.token()
          for method, path in (("PUT", "/api/v1/admin/tls/ca/"), ("PUT", "/api/v1/admin/tls/authorize"),
                               ("PUT", "/api/v1/admin/tls/root.pem"), ("PUT", "/api/v1/admin/tls/acknowledge"),
                               ("PUT", "/api/v1/admin/tls")):
              code, payload = t2.call(method, path, {"certificate": "c", "key": "k"}, token=token)
              assert (code, payload) == (404, b""), (method, path, code, payload[:80])
          print("a mistyped path, a wrong method and /authorize are each the edge's 404")
          PY

      - name: "A CA loaded through the edge is served within 30 s, the edge never restarted"
        run: |
          set -euo pipefail
          cd tls-t2
          for n in 1 2; do
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 365 \
              -subj "/CN=tls-edge CA $n" -addext "basicConstraints=critical,CA:TRUE" \
              -addext "keyUsage=critical,keyCertSign,cRLSign" -keyout "ca$n.key" -out "ca$n.crt" 2> /dev/null
          done
          cat ca1.crt ca2.crt >> trust.pem
          python3 - <<'PY'
          import json
          import t2

          before = t2.edge_state()
          code, payload = t2.load("ca", "ca1.crt", "ca1.key", t2.token())
          assert code == 200, (code, payload[:400])
          answer = json.loads(payload)
          sha = t2.der_sha("ca1.crt")
          assert answer["issuer"] == {"kind": "internal", "ca": f"loaded-{sha[:12]}"}, answer["issuer"]
          assert answer["root"]["sha256"] == sha and answer["source"] == "ui", answer
          seconds = t2.served_within("ca1.crt")
          assert seconds is not None, "the edge did not serve a leaf the loaded CA verifies within 30 s"
          assert t2.edge_state() == before, f"the edge restarted: {before} -> {t2.edge_state()}"
          code, payload = t2.call("GET", "/api/v1/admin/tls/root.pem", token=t2.token())
          open("served-root.pem", "wb").write(payload)
          assert code == 200 and t2.der_sha("served-root.pem") == sha, "root.pem is not the loaded CA"
          print(f"the first CA served in {seconds}s, the edge at {before} throughout")
          PY

      - name: "A second CA over the first, served within 30 s the same way"
        run: |
          set -euo pipefail
          cd tls-t2
          python3 - <<'PY'
          import json, subprocess
          import t2

          before = t2.edge_state()
          code, payload = t2.load("ca", "ca2.crt", "ca2.key", t2.token())
          assert code == 200, (code, payload[:400])
          sha, first = t2.der_sha("ca2.crt"), t2.der_sha("ca1.crt")
          assert json.loads(payload)["issuer"]["ca"] == f"loaded-{sha[:12]}"
          seconds = t2.served_within("ca2.crt")
          assert seconds is not None, "the edge did not serve a leaf the second CA verifies within 30 s"
          assert t2.edge_state() == before, "the edge restarted"
          control = subprocess.run(["docker", "exec", "librerun-edge-control", "ls", "-a", "/control"],
                                   check=True, capture_output=True, text=True).stdout.split()
          print("the control volume:", control)
          assert f"ca-{sha[:12]}.key" in control and not any(first[:12] in name for name in control), control
          code, payload = t2.call("GET", "/api/v1/admin/tls/root.pem", token=t2.token())
          open("served-root.pem", "wb").write(payload)
          assert t2.der_sha("served-root.pem") == sha
          print(f"the second CA served in {seconds}s over the first, whose files are gone")
          PY

      - name: "No key in a response, a log or the dump, and the backend holds no /control"
        run: |
          set -euo pipefail
          for service in backend edge edge-control; do
            docker logs "librerun-$service" > "tls-t2/$service.log" 2>&1
          done
          docker exec librerun-postgres pg_dump -U librerun librerun > tls-t2/dump.sql
          if docker exec librerun-backend test -e /control; then
            echo "::error::the backend's container has a /control"; exit 1
          fi
          mounts="$(docker inspect -f '{{range .Mounts}}{{.Name}} {{end}}' librerun-backend)"
          case "$mounts" in *edge-control*|*edge-data*) echo "::error::the backend mounts an edge volume: $mounts"; exit 1 ;; esac
          python3 - <<'PY'
          import glob, os

          lines = set()
          for key in ("ca1.key", "ca2.key", "notca.key"):
              for line in open(os.path.join("tls-t2", key)).read().splitlines():
                  # A base64 line of the key; a stub a few characters long
                  # could match any dump by chance, and P-256 keys have none.
                  if len(line) >= 16 and not line.startswith("-----"):
                      lines.add(line)
          places = sorted(glob.glob("tls-t2/answers/*.body")) + [
              f"tls-t2/{name}" for name in ("backend.log", "edge.log", "edge-control.log", "dump.sql")]
          assert len(lines) >= 6 and len(places) >= 12, (len(lines), places)
          found = [place for place in places for line in lines if line.encode() in open(place, "rb").read()]
          assert not found, f"a line of a key is in {sorted(set(found))}"
          print(f"{len(lines)} key lines, none in {len(places)} places: every API answer, three logs and the dump")
          PY

      - name: "Back to the environment: the copied root verifies again"
        run: |
          set -euo pipefail
          cd tls-t2
          python3 - <<'PY'
          import json
          import t2

          token = t2.token()
          code, payload = t2.call("DELETE", "/api/v1/admin/tls/choice", token=token)
          assert code == 200, (code, payload[:300])
          seconds = t2.served_within("../edge-root.crt")
          assert seconds is not None, "the environment's root did not serve again within 30 s"
          status = t2.tls(token)
          assert status["source"] == "environment" and status["issuer"]["ca"] == "local", status
          print(f"back to the environment in {seconds}s: the copied root verifies again")
          PY

      - name: "The restore, the environment's way: the edge's volumes gone, LIBRERUN_TLS_CA names the job's CA"
        run: |
          set -euo pipefail
          ./compose.sh --profile app --profile tls down
          for volume in librerun-edge-data librerun-edge-control; do
            names="$(docker volume ls -q --filter "label=com.docker.compose.volume=$volume")"
            test -n "$names" || { echo "::error::no $volume volume to remove"; exit 1; }
            docker volume rm $names
          done
          cp tls-t2/ca2.crt tls/ca.crt
          ( umask 077 && cp tls-t2/ca2.key tls/ca.key )
          python3 - <<'PY'
          import pathlib, re

          path = pathlib.Path(".env")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(r"(?m)^LIBRERUN_TLS_CA=.*$", "LIBRERUN_TLS_CA=/certs/ca.crt /certs/ca.key", text)
          assert count == 1, "the example's LIBRERUN_TLS_CA line was not edited in place"
          path.write_text(text, encoding="utf-8")
          PY
          ./compose.sh --profile app --profile tls up -d
          ./.github/scripts/wait_healthy.sh backend 300
          cd tls-t2
          python3 - <<'PY'
          import t2

          seconds = t2.served_within("ca2.crt", 60)
          assert seconds is not None, "after the restore the first leaf does not verify against the CA LIBRERUN_TLS_CA names"
          status = t2.tls(t2.token())
          print({key: status[key] for key in ("issuer", "source", "environment", "needs")})
          assert status["source"] == "environment" and status["environment"]["variable"] == "LIBRERUN_TLS_CA", status
          assert status["root"]["sha256"] == t2.der_sha("ca2.crt"), status["root"]
          assert "root_changed" in status["needs"], status["needs"]
          print(f"restored through LIBRERUN_TLS_CA: served in {seconds}s, and root_changed until acknowledged")
          PY

      # R20 (B1b; D29, D42 refined, L43): the admin walk, after T2's steps —
      # whose restore leaves the edge serving a leaf from the job's CA
      # through LIBRERUN_TLS_CA — and before the migration step, which stays
      # last. The job's .env leaves the backend's store key blank, and a
      # blank key answers every secret write 503 secrets_store_unconfigured
      # (D33), so a fresh one goes in first, never the gateway's (K7-15),
      # and the backend is recreated. T2's restore recreated the whole
      # stack, so the fingerprint is read from the gateway running now,
      # never from K7's gateway-boot.log. Every value the walk types, and the
      # CA and key it loads, is made here, masked and passed by environment;
      # no key file is uploaded. The product signs in the platform tenant
      # alone, so the tenant admin the walk shows the operator's pages to is
      # made here, with a session, by the backend's own code.
      - name: "The admin walk's stack (R20): a backend store key, the gateway's fingerprint, the walk's CA and values, a tenant admin"
        run: |
          set -euo pipefail
          mkdir -m 700 admin-walk
          python3 - <<'PY'
          import base64, os, pathlib, re, secrets

          key = base64.urlsafe_b64encode(os.urandom(32)).decode()
          print(f"::add-mask::{key}")
          assert key not in pathlib.Path("gateway.env").read_text(encoding="utf-8")
          path = pathlib.Path(".env")
          text, count = re.subn(r"(?m)^LIBRERUN_BACKEND_SECRETS_KEY=.*$", f"LIBRERUN_BACKEND_SECRETS_KEY={key}",
                                path.read_text(encoding="utf-8"))
          assert count == 1, "the example's LIBRERUN_BACKEND_SECRETS_KEY line was not edited in place"
          path.write_text(text, encoding="utf-8")
          # What the walk types, each a throwaway, masked before it is written.
          values = {
              "LR_WALK_PROVIDER_KEY": "sk-r20-" + secrets.token_hex(24),
              "LR_WALK_AZURE_SECRET": "r20-azure-" + secrets.token_hex(16),
              "LR_WALK_TOOL_SECRET": "r20-tavily-" + secrets.token_hex(16),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              for name, value in values.items():
                  print(f"::add-mask::{value}")
                  out.write(f"{name}={value}\n")
              # pinecone_top_k's default is 10; the walk sets another.
              out.write(f"LR_WALK_SETTING={11 + secrets.randbelow(40)}\n")
              out.write(f"LR_WALK_KEY_AGENT=r20-walk-{secrets.token_hex(4)}\n")
          print("a fresh backend store key is in .env; the walk's values are in the environment, masked")
          PY
          ./compose.sh --profile app --profile tls up -d backend
          ./.github/scripts/wait_healthy.sh backend 300
          ./.github/scripts/wait_healthy.sh gateway 300
          test -n "$(docker exec librerun-backend printenv LIBRERUN_BACKEND_SECRETS_KEY)" \
            || { echo "::error::the recreated backend has no store key"; exit 1; }
          # D34: the page must seal to the key the running gateway logged.
          python3 - <<'PY'
          import json, os, re, subprocess

          log = subprocess.run(["docker", "logs", "librerun-gateway"], capture_output=True, text=True)
          found = []
          for line in (log.stdout + log.stderr).splitlines():
              if "gateway_sealing_key" in line and "{" in line:
                  try:
                      event = json.loads(line[line.index("{"):])
                  except ValueError:
                      continue
                  if event.get("event") == "gateway_sealing_key":
                      found.append(event.get("fingerprint", ""))
          assert found, "the running gateway never logged gateway_sealing_key"
          assert re.fullmatch(r"SHA256:[0-9a-f]{64}", found[-1]), f"not a D34 fingerprint: {found[-1]!r}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"LR_GATEWAY_FINGERPRINT={found[-1]}\n")
          print(f"the running gateway seals to {found[-1]}")
          PY
          # The CA the walk loads: made here, its key owner-only.
          ( umask 077 && openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 365 \
            -subj "/CN=tls-edge admin walk CA" -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" -keyout admin-walk/ca.key -out admin-walk/ca.crt 2> /dev/null )
          test "$(stat -c %a admin-walk/ca.key)" = 600
          # A tenant of its own, an admin of it and a session, by the backend's
          # own models and session service, as the container's own user.
          docker exec -i -u librerun librerun-backend python - > admin-walk/tenant.out <<'PY'
          import asyncio
          import secrets

          from app.database import async_session
          from app.models.tenant import Tenant
          from app.models.user import User
          from app.services.auth_service import create_session


          async def main() -> None:
              tag = secrets.token_hex(4)
              async with async_session() as db:
                  tenant = Tenant(name=f"Admin walk {tag}", slug=f"admin-walk-{tag}")
                  db.add(tenant)
                  await db.flush()
                  user = User(tenant_id=tenant.id, email=f"tenant-admin-{tag}@example.com", role="admin",
                              auth_provider="credentials", password_hash=None)
                  db.add(user)
                  await db.flush()
                  _, token = await create_session(db, user)
                  await db.commit()
              print(f"TENANT_ADMIN_TOKEN={token}")


          asyncio.run(main())
          PY
          token="$(sed -n 's/^TENANT_ADMIN_TOKEN=//p' admin-walk/tenant.out)"
          rm -f admin-walk/tenant.out
          test -n "$token" || { echo "::error::no session was made for the tenant admin"; exit 1; }
          echo "::add-mask::$token"
          echo "LR_TENANT_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          docker inspect -f '{{.RestartCount}} {{.State.StartedAt}}' librerun-edge > admin-walk/edge-before.txt
          echo "a tenant admin and its session are made; the edge is at $(cat admin-walk/edge-before.txt)"

      - name: "Negative first: the admin walk with the CA the edge serves untrusted fails at its first page"
        working-directory: frontend
        env:
          LR_ADMIN_WALK: "1"
          LR_BASE_URL: https://librerun.test:8443
          LR_EMAIL: ${{ env.SMOKE_ADMIN_EMAIL }}
          LR_PASSWORD: ${{ env.SMOKE_ADMIN_PASSWORD }}
          LR_WALK_CA_CERT: ${{ github.workspace }}/admin-walk/ca.crt
          LR_WALK_CA_KEY: ${{ github.workspace }}/admin-walk/ca.key
        # Chromium's NSS store holds the root K7's step copied, which roots
        # nothing the edge serves since T2's restore, and Node is given no CA:
        # the walk must stop on the certificate at /login, and run nothing.
        run: |
          set -uo pipefail
          status=0
          npx playwright test -c e2e/playwright.config.ts admin-walk.spec.ts > admin-walk-negative.log 2>&1 || status=$?
          cat admin-walk-negative.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the admin walk passed with the CA the edge serves untrusted"; exit 1
          fi
          grep -qF "net::ERR_CERT_AUTHORITY_INVALID" admin-walk-negative.log \
            || { echo "::error::the walk did not fail on the edge's certificate"; exit 1; }
          grep -qF "https://librerun.test:8443/login" admin-walk-negative.log \
            || { echo "::error::the walk did not fail at its first page, /login"; exit 1; }
          if grep -qE "[0-9]+ passed" admin-walk-negative.log; then
            echo "::error::a test of the walk passed with the CA untrusted"; exit 1
          fi
          echo "with the CA the edge serves untrusted, the walk fails at /login on the certificate (exit $status)"

      - name: "The admin walk (R20): a platform admin with no shell, then a tenant admin, through the edge (Playwright)"
        working-directory: frontend
        env:
          LR_ADMIN_WALK: "1"
          LR_BASE_URL: https://librerun.test:8443
          LR_EMAIL: ${{ env.SMOKE_ADMIN_EMAIL }}
          LR_PASSWORD: ${{ env.SMOKE_ADMIN_PASSWORD }}
          LR_WALK_PROVIDER: openai
          LR_WALK_CA_CERT: ${{ github.workspace }}/admin-walk/ca.crt
          LR_WALK_CA_KEY: ${{ github.workspace }}/admin-walk/ca.key
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/admin-walk/trust.pem
        run: |
          set -euo pipefail
          # The CA the edge serves since T2's restore, and the CA the walk
          # loads, trusted as a browser trusts a root (D42): in Chromium's NSS
          # store and in Node's NODE_EXTRA_CA_CERTS, never ignoreHTTPSErrors.
          cat ../tls-t2/ca2.crt ../admin-walk/ca.crt > ../admin-walk/trust.pem
          timeout 60 certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n "librerun job CA" -i ../tls-t2/ca2.crt < /dev/null
          timeout 60 certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n "librerun admin walk CA" -i ../admin-walk/ca.crt < /dev/null
          timeout 60 certutil -d "sql:$HOME/.pki/nssdb" -L < /dev/null
          npx playwright test -c e2e/playwright.config.ts admin-walk.spec.ts
          cd ..
          # The CA the walk loaded is what the edge serves now, and the edge
          # never restarted to take it.
          served=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null --cacert admin-walk/ca.crt https://librerun.test:8443/api/v1/meta; then served=1; break; fi
            sleep 1
          done
          test "$served" = 1 || { echo "::error::the edge serves no leaf the CA the walk loaded signed"; exit 1; }
          docker inspect -f '{{.RestartCount}} {{.State.StartedAt}}' librerun-edge > admin-walk/edge-after.txt
          diff admin-walk/edge-before.txt admin-walk/edge-after.txt || { echo "::error::the edge restarted during the walk"; exit 1; }
          # No value the walk typed, and no line of the key it loaded, is in a
          # container's log or the database's dump (L31, L42).
          for service in backend gateway edge edge-control frontend; do
            docker logs "librerun-$service" > "admin-walk/$service.log" 2>&1
          done
          docker exec librerun-postgres pg_dump -U librerun librerun > admin-walk/dump.sql
          python3 - <<'PY'
          import glob, os

          values = [os.environ[name] for name in ("LR_WALK_PROVIDER_KEY", "LR_WALK_AZURE_SECRET", "LR_WALK_TOOL_SECRET")]
          values += [line for line in open("admin-walk/ca.key").read().splitlines()
                     if len(line) >= 16 and not line.startswith("-----")]
          places = sorted(glob.glob("admin-walk/*.log")) + ["admin-walk/dump.sql"]
          assert len(values) >= 4 and len(places) == 6, (len(values), places)
          found = sorted({place for place in places for value in values if value.encode() in open(place, "rb").read()})
          assert not found, f"a value the walk typed, or a line of the key it loaded, is in {found}"
          print(f"the edge serves the walk's CA, unrestarted; {len(values)} values and key lines, none in five logs or the dump")
          PY

      - name: A migration that raises stops the backend (last — it takes the backend down)
        # The entrypoint used to swallow a failed `alembic upgrade head`
        # ("Continuing...") and boot on a stale schema. A throwaway revision
        # that raises goes where the running image's alembic reads, the
        # container restarts, and it must never report healthy — with the
        # Alembic error in its log and uvicorn never started.
        run: |
          set -euo pipefail
          head="$(docker exec librerun-backend sh -c 'cd /app && python -m alembic heads' | awk '/\(head\)/ {print $1}')"
          test -n "$head" || { echo "::error::no alembic head read from the backend"; exit 1; }
          cat > tls_edge_probe.py <<PY
          """tls-edge probe: a migration that raises, never committed (K blueprint T1)."""
          revision = "tls_edge_probe"
          down_revision = "$head"
          branch_labels = None
          depends_on = None


          def upgrade() -> None:
              raise RuntimeError("tls-edge probe: this migration fails on purpose")


          def downgrade() -> None:
              pass
          PY
          docker cp tls_edge_probe.py librerun-backend:/app/alembic/versions/999_tls_edge_probe.py
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker restart librerun-backend
          for _ in $(seq 1 30); do
            state="$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}} restarts={{.RestartCount}}' librerun-backend)"
            case "$state" in
              *" healthy "*) echo "::error::the backend reported healthy on a migration that raises ($state)"; docker logs --since "$since" librerun-backend | tail -40; exit 1 ;;
            esac
            sleep 2
          done
          echo "after 60s: $state"
          docker logs --since "$since" librerun-backend > probe.log 2>&1 || true
          tail -30 probe.log
          grep -qF "tls-edge probe: this migration fails on purpose" probe.log || { echo "::error::the Alembic error is not in the backend's log"; exit 1; }
          grep -qF "ERROR: Alembic migrations failed" probe.log || { echo "::error::the entrypoint did not stop on the failed migration"; exit 1; }
          if grep -qF "Starting uvicorn" probe.log; then echo "::error::uvicorn started on a stale schema"; exit 1; fi
          echo "the failed migration stopped the backend, and it never reported healthy"

      - name: Diagnostics
        if: always()
        run: |
          mkdir -p tls-edge-artifacts
          cp negative.log resolved.json headers_*.txt doctor.txt tls-edge-summary.json probe.log tls-edge-artifacts/ 2>/dev/null || true
          cp frontend/admin-walk-negative.log tls-edge-artifacts/ 2>/dev/null || true
          cp -r frontend/e2e/results tls-edge-artifacts/walk 2>/dev/null || true
          find tls-edge-artifacts -name '*.zip' -delete 2>/dev/null || true
          # A failed walk's report can quote what was typed: never uploaded.
          for name in LR_WALK_PROVIDER_KEY LR_WALK_AZURE_SECRET LR_WALK_TOOL_SECRET LR_TENANT_ADMIN_TOKEN; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              grep -rlF -- "$value" tls-edge-artifacts 2>/dev/null | xargs -r sed -i "s|$value|[$name REDACTED]|g" || true
            fi
          done
          sed 's/=.*/=<redacted>/' .env > tls-edge-artifacts/env.shape 2>/dev/null || true
          for service in edge edge-control backend frontend gateway; do
            docker logs "librerun-$service" > "tls-edge-artifacts/$service.log" 2>&1 || true
          done
          # T2's answers and certificates, never a key file.
          mkdir -p tls-edge-artifacts/t2
          cp -r tls-t2/answers tls-t2/*.crt tls-edge-artifacts/t2/ 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tls-edge-artifacts
          path: tls-edge-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: ./compose.sh --profile app --profile tls down -v || true

  # --------------------------------------------------------------------------
  # Provider keys from the UI (K7, decision L33). A platform admin pastes a
  # provider key on Application Settings; the browser seals it to the
  # gateway's public key, the backend stores ciphertext it cannot open, the
  # gateway adopts it, and the next model call carries it — nothing
  # restarted.
  #
  # Keyless mode off, and OpenAI's endpoint a mock inside the gateway's own
  # container (127.0.0.1:9099) that records the SHA-256 of each bearer it is
  # sent and answers 401 without one. No provider key anywhere: the demo's
  # gateway.env is removed, and the gateway's store key arrives by a job
  # overlay's _FILE. The echo agent asks the model before the paste
  # (model_error), after it (the mock's reply, the mock having seen the
  # pasted key's hash) and after the DELETE (model_error again), and the
  # gateway's StartedAt and RestartCount never move. The browser half runs
  # on localhost, a secure context over plain HTTP, against the demo's web
  # UI; the plain-origin refusal (D19) and the policy walk are tls-edge's.
  # --------------------------------------------------------------------------
  provider-keys:
    runs-on: ubuntu-latest
    # Four images (the gateway, the backend, the web UI and the echo agent)
    # and one browser walk.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: The demo environment, keyless mode off, OpenAI at the mock, no gateway.env
        run: |
          set -euo pipefail
          test ! -f .env
          ./scripts/demo.sh --env-only
          # The demo writes gateway.env for its store key (K7); this job
          # delivers that key by file and holds no provider key at all.
          rm -f gateway.env
          python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path(".env")
          wanted = {"LIBRERUN_STUB_LLM": "false", "OPENAI_BASE_URL": "http://127.0.0.1:9099/v1"}
          lines, env = [], {}
          for line in path.read_text(encoding="utf-8").splitlines():
              match = re.match(r"^([A-Z][A-Z0-9_]*)=", line)
              if match and match.group(1) in wanted:
                  line = f"{match.group(1)}={wanted.pop(match.group(1))}"
              if match:
                  env[match.group(1)] = line.split("=", 1)[1].strip().strip('"').strip("'")
              lines.append(line)
          assert "LIBRERUN_STUB_LLM" not in wanted, "the demo .env has no LIBRERUN_STUB_LLM line"
          lines += [f"{key}={value}" for key, value in wanted.items()]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          email, password = env.get("INITIAL_ADMIN_EMAIL"), env.get("INITIAL_ADMIN_PASSWORD")
          assert email and password, "the demo .env has no admin"
          print(f"::add-mask::{password}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"INITIAL_ADMIN_EMAIL={email}\nINITIAL_ADMIN_PASSWORD={password}\n")
          PY
          grep -E '^(LIBRERUN_STUB_LLM|OPENAI_BASE_URL)=' .env
          # compose.sh derives agent-keys.env before every command; this job
          # drives `docker compose` directly (it needs a second -f), so the
          # derivation is done here, by the same script.
          ./compose.sh ps > /dev/null

      - name: The gateway's store key, by a job overlay's _FILE
        run: |
          set -euo pipefail
          mkdir -p secrets && chmod 700 secrets
          python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())' > secrets/gateway_secrets_key
          # Readable by the container's unprivileged user, as
          # docs/platform/Install.md says for every file secret.
          chmod 444 secrets/gateway_secrets_key
          # The variable blank beside its _FILE, as the documented overlay
          # blanks OPENAI_API_KEY, so the _FILE rule sees one source.
          cat > compose.k7.yaml <<'YAML'
          services:
            gateway:
              environment:
                LIBRERUN_GATEWAY_SECRETS_KEY: ""
                LIBRERUN_GATEWAY_SECRETS_KEY_FILE: /run/secrets/gateway_secrets_key
              secrets:
                - gateway_secrets_key
          secrets:
            gateway_secrets_key:
              file: ./secrets/gateway_secrets_key
          YAML

      - name: Boot the gateway, the backend, the web UI and the echo agent
        run: |
          set -euo pipefail
          C="docker compose -f compose.yaml -f compose.k7.yaml --profile app --profile demo"
          $C up -d --build gateway backend frontend echo-agent
          ./.github/scripts/wait_healthy.sh backend 300
          ./.github/scripts/wait_healthy.sh gateway 300
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/login && break
            sleep 3
          done
          curl -fsS -o /dev/null http://localhost:3000/login
          $C ps

      - name: A mock provider in the gateway's container, the key to paste, and the gateway's fingerprint
        run: |
          set -euo pipefail
          C="docker compose -f compose.yaml -f compose.k7.yaml --profile app --profile demo"
          cat > k7_mock.py <<'PY'
          """A provider for provider-keys (K7): OpenAI's chat endpoint, on 127.0.0.1:9099.

          It records the SHA-256 of each bearer it is sent, never the bearer, and
          answers 401 to a call without one — the gateway's call with no key in
          effect — and a fixed reply to one with a key.
          """
          import hashlib
          import http.server
          import json
          import time

          SEEN = "/tmp/k7-mock-seen"


          class Provider(http.server.BaseHTTPRequestHandler):
              def _answer(self, status, body):
                  data = json.dumps(body).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

              def do_GET(self):
                  self._answer(200, {"mock": "k7"})

              def do_POST(self):
                  self.rfile.read(int(self.headers.get("Content-Length") or 0))
                  auth = self.headers.get("Authorization") or ""
                  bearer = auth[7:].strip() if auth[:7].lower() == "bearer " else ""
                  if not bearer:
                      self._answer(401, {"error": {"message": "no key", "type": "invalid_request_error",
                                                   "code": "invalid_api_key"}})
                      return
                  with open(SEEN, "a", encoding="ascii") as seen:
                      seen.write(hashlib.sha256(bearer.encode()).hexdigest() + "\n")
                  self._answer(200, {
                      "id": "chatcmpl-k7", "object": "chat.completion", "created": int(time.time()),
                      "model": "gpt-4o-mini",
                      "choices": [{"index": 0, "finish_reason": "stop",
                                   "message": {"role": "assistant", "content": "k7-mock-reply"}}],
                      "usage": {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2},
                  })

              def log_message(self, *args):
                  pass


          http.server.ThreadingHTTPServer(("127.0.0.1", 9099), Provider).serve_forever()
          PY
          docker cp k7_mock.py librerun-gateway:/tmp/k7_mock.py
          $C exec -d gateway python /tmp/k7_mock.py
          probe="import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/', timeout=2)"
          for _ in $(seq 1 30); do
            $C exec -T gateway python -c "$probe" 2>/dev/null && break
            sleep 1
          done
          $C exec -T gateway python -c "$probe"
          echo "the mock answers on the gateway's loopback"
          # The echo run the next steps ask the model through.
          cat > k7_echo.py <<'PY'
          """One echo-v1 run that asks the model, and what came back (K7, provider-keys).

              python3 k7_echo.py reply   the call must return the mock's reply
              python3 k7_echo.py error   the call must fail: model_error, no reply
          """
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          BASE = os.environ.get("K7_API", "http://localhost:8000/api/v1")
          want = sys.argv[1]
          assert want in ("reply", "error"), want


          def call(method, path, token=None, body=None):
              request = urllib.request.Request(
                  f"{BASE}{path}", data=json.dumps(body).encode() if body is not None else None, method=method)
              request.add_header("Content-Type", "application/json")
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.loads(response.read() or b"{}")
              except urllib.error.HTTPError as exc:
                  return exc.code, json.loads(exc.read() or b"{}")


          status, body = call("POST", "/auth/login", body={
              "email": os.environ["INITIAL_ADMIN_EMAIL"], "password": os.environ["INITIAL_ADMIN_PASSWORD"]})
          assert status == 200, ("login", status)
          token = body["access_token"]
          started = time.monotonic()
          status, body = call("POST", "/runs?agent_id=echo-v1", token=token,
                              body={"message": f"provider keys: expect {want}", "ask_model": "Say hello."})
          assert status in (200, 201, 202), ("submit", status, body)
          run_id = body["run_id"]
          detail = {}
          for _ in range(90):
              status, detail = call("GET", f"/runs/{run_id}", token=token)
              assert status == 200, ("detail", status)
              if detail.get("status") in ("complete", "error", "awaiting_approval"):
                  break
              time.sleep(2)
          assert detail.get("status") == "complete", f"the echo run is {detail.get('status')!r}, not complete"
          output = detail.get("structured_output") or {}
          said, error = output.get("model_said"), output.get("model_error")
          print(f"echo run {run_id} ({time.monotonic() - started:.0f} s): model_said={said!r} model_error={error!r}")
          if want == "reply":
              assert said and "k7-mock-reply" in said and not error, "the model call did not return the mock's reply"
          else:
              assert error and not said, "a model call succeeded with no provider key in effect"
          PY
          # The key to paste: random, masked, and on no command line.
          python3 - <<'PY'
          import os, secrets
          key = "sk-k7-" + secrets.token_hex(24)
          print(f"::add-mask::{key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"K7_PROVIDER_KEY={key}\n")
          PY
          # D34: the fingerprint the gateway logged when it loaded its sealing
          # key. The page must show the same one.
          python3 - <<'PY'
          import json, os, re, subprocess, time
          deadline = time.time() + 120
          while True:
              log = subprocess.run(["docker", "logs", "librerun-gateway"], capture_output=True, text=True)
              found = []
              for line in (log.stdout + log.stderr).splitlines():
                  if "gateway_sealing_key" not in line or "{" not in line:
                      continue
                  try:
                      event = json.loads(line[line.index("{"):])
                  except ValueError:
                      continue
                  if event.get("event") == "gateway_sealing_key":
                      found.append(event.get("fingerprint", ""))
              if found:
                  break
              if time.time() > deadline:
                  raise SystemExit("::error::the gateway never logged gateway_sealing_key")
              time.sleep(3)
          fingerprint = found[-1]
          assert re.fullmatch(r"SHA256:[0-9a-f]{64}", fingerprint), f"not a D34 fingerprint: {fingerprint!r}"
          print(f"gateway_sealing_key fingerprint={fingerprint}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"LR_GATEWAY_FINGERPRINT={fingerprint}\n")
          PY
          docker inspect -f '{{.State.StartedAt}} {{.RestartCount}}' librerun-gateway | tee gateway-before.txt

      - name: "Negative: before the paste the echo run's model call fails, and the mock is sent no key"
        run: |
          set -euo pipefail
          python3 k7_echo.py error
          seen="$(docker exec librerun-gateway sh -c 'cat /tmp/k7-mock-seen 2>/dev/null || true')"
          test -z "$seen" || { echo "::error::the mock was sent a key before any was set"; exit 1; }
          echo "no key reached the mock"

      - name: "Negative: the raw key posted as the blob answers 400 plaintext_refused and stores nothing"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.error, urllib.request

          base = "http://localhost:8000/api/v1"
          def call(method, path, body=None, token=None):
              request = urllib.request.Request(
                  base + path, data=json.dumps(body).encode() if body is not None else None, method=method)
              request.add_header("Content-Type", "application/json")
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.loads(response.read() or b"{}")
              except urllib.error.HTTPError as exc:
                  return exc.code, json.loads(exc.read() or b"{}")

          def rows():
              out = subprocess.run(
                  ["docker", "exec", "librerun-postgres", "psql", "-U", "librerun", "-d", "librerun", "-At", "-c",
                   "SELECT count(*) FROM secrets WHERE scope = 'gateway' AND name = 'provider.openai'"],
                  capture_output=True, text=True, check=True).stdout.strip()
              return int(out)

          key = os.environ["K7_PROVIDER_KEY"]
          token = call("POST", "/auth/login", {"email": os.environ["INITIAL_ADMIN_EMAIL"],
                                               "password": os.environ["INITIAL_ADMIN_PASSWORD"]})[1]["access_token"]
          before = rows()
          status, body = call("POST", "/admin/providers/openai/key", {"sealed": key}, token)
          after = rows()
          print(f"the raw key: {status} {body.get('code')}; provider.openai rows {before} -> {after}")
          assert status == 400 and body.get("code") == "plaintext_refused", (status, body.get("code"))
          assert key not in json.dumps(body), "the refusal quotes the key"
          assert before == after == 0, "a refused key wrote a row"
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Paste the key on Application Settings (Playwright, providers.spec.ts)
        working-directory: frontend
        env:
          LR_PROVIDER_WALK: "1"
          LR_BASE_URL: http://localhost:3000
          LR_EMAIL: ${{ env.INITIAL_ADMIN_EMAIL }}
          LR_PASSWORD: ${{ env.INITIAL_ADMIN_PASSWORD }}
          LR_PROVIDER_KEY: ${{ env.K7_PROVIDER_KEY }}
          LR_PROVIDER_NAME: openai
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          # playwright.config.ts matches every *.spec.ts: this one, by name.
          npx playwright test -c e2e/playwright.config.ts providers.spec.ts

      - name: The next model call carries the pasted key, and the gateway never restarted
        run: |
          set -euo pipefail
          python3 k7_echo.py reply
          want="$(python3 -c 'import hashlib,os;print(hashlib.sha256(os.environ["K7_PROVIDER_KEY"].encode()).hexdigest())')"
          docker exec librerun-gateway cat /tmp/k7-mock-seen > mock-seen.txt
          grep -qx "$want" mock-seen.txt || { echo "::error::the mock never saw the pasted key"; exit 1; }
          echo "the mock saw the pasted key's hash ($(wc -l < mock-seen.txt) call(s) with a key)"
          docker inspect -f '{{.State.StartedAt}} {{.RestartCount}}' librerun-gateway > gateway-after.txt
          diff gateway-before.txt gateway-after.txt || { echo "::error::the gateway restarted to take the key"; exit 1; }
          echo "the gateway's StartedAt and RestartCount are unchanged: $(cat gateway-after.txt)"
          # …and the key is in no container's log (L31).
          docker compose -f compose.yaml -f compose.k7.yaml --profile app --profile demo logs --no-color > all.log 2>&1 || true
          if grep -qF -- "$K7_PROVIDER_KEY" all.log; then echo "::error::the pasted key is in a container's log"; exit 1; fi
          echo "the pasted key is in no container's log"

      - name: "Negative: after the DELETE the echo run's model call fails again"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request

          base = "http://localhost:8000/api/v1"
          def call(method, path, body=None, token=None):
              request = urllib.request.Request(
                  base + path, data=json.dumps(body).encode() if body is not None else None, method=method)
              request.add_header("Content-Type", "application/json")
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  return response.status, json.loads(raw) if raw else None

          token = call("POST", "/auth/login", {"email": os.environ["INITIAL_ADMIN_EMAIL"],
                                               "password": os.environ["INITIAL_ADMIN_PASSWORD"]})[1]["access_token"]
          status, _ = call("DELETE", "/admin/providers/openai/key", token=token)
          assert status == 204, status
          deadline = time.time() + 60
          while True:
              entry = next(e for e in call("GET", "/admin/providers", token=token)[1]["providers"]
                           if e["name"] == "openai")
              if entry["source"] != "runtime" and entry["row"] is None:
                  break
              assert time.time() < deadline, f"the gateway still holds the cleared key: {entry}"
              time.sleep(2)
          print(f"DELETE 204; openai is {entry['source']}")
          PY
          before="$(docker exec librerun-gateway sh -c 'wc -l < /tmp/k7-mock-seen')"
          python3 k7_echo.py error
          after="$(docker exec librerun-gateway sh -c 'wc -l < /tmp/k7-mock-seen')"
          test "$before" = "$after" || { echo "::error::the mock was sent a key after the DELETE"; exit 1; }
          docker inspect -f '{{.State.StartedAt}} {{.RestartCount}}' librerun-gateway > gateway-end.txt
          diff gateway-before.txt gateway-end.txt || { echo "::error::the gateway restarted"; exit 1; }
          echo "after the DELETE: model_error, no key at the mock, the gateway never restarted"

      - name: Diagnostics
        if: always()
        run: |
          mkdir -p provider-keys-artifacts
          docker compose -f compose.yaml -f compose.k7.yaml --profile app --profile demo logs --no-color \
            > provider-keys-artifacts/compose.log 2>&1 || true
          cp -r frontend/e2e/results provider-keys-artifacts/walk 2>/dev/null || true
          # A failed walk's trace records what was typed: never uploaded.
          find provider-keys-artifacts -name '*.zip' -delete 2>/dev/null || true
          if [ -n "${K7_PROVIDER_KEY:-}" ]; then
            grep -rlF -- "$K7_PROVIDER_KEY" provider-keys-artifacts 2>/dev/null \
              | xargs -r sed -i "s/$K7_PROVIDER_KEY/[K7 PROVIDER KEY REDACTED]/g" || true
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-keys-artifacts-${{ github.run_id }}
          path: provider-keys-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.k7.yaml --profile app --profile demo down -v || true
          rm -rf secrets compose.k7.yaml k7_mock.py k7_echo.py || true

  # ==========================================================================
  # backup-restore (B1b; L42): docs/platform/Install.md's "Backup and
  # restore", walked through the stack's own services. A platform admin's
  # secret setting and a provider key sealed to the gateway are set; the
  # database is dumped by pg_dump inside librerun-postgres; `down -v` takes
  # every volume; Postgres alone comes up on an empty one, which loads
  # backend/db/schema.sql, and the dump — taken with --clean --if-exists,
  # so it replaces what that load made — is restored into it by psql; only
  # then does the rest start, with the same .env and gateway.env. Both
  # fingerprints, and the key the gateway seals to, read back as they were.
  # The order is the recipe's: a full `up` on empty volumes migrates,
  # bootstraps the admin and inserts a fresh gateway keypair, which a dump
  # restored after it collides with.
  #
  # Negative: the same dump, restored the same way under a fresh backend
  # store key, leaves the secret row no configured key opens — `rewrap
  # --dry-run` exits 3 naming it, and the setting reads `unreadable` —
  # while the gateway, its key unchanged, still serves its own row.
  #
  # Every command runs in a service of the stack (`docker exec`, compose's
  # own `exec`): no image is named here, as dependency-identity requires.
  # The dump holds password hashes and ciphertext, so it is never uploaded.
  # ==========================================================================
  backup-restore:
    runs-on: ubuntu-latest
    # Two images (the backend and the gateway), three starts.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: cp .env.example .env, the keyless minimum and both store keys
        run: |
          set -euo pipefail
          test ! -f .env
          test ! -f gateway.env
          cp .env.example .env
          chmod 600 .env
          python - <<'PY'
          import base64, os, pathlib, re, secrets

          def fernet():
              return base64.urlsafe_b64encode(os.urandom(32)).decode()

          wanted = {
              "APP_SECRET_KEY": secrets.token_urlsafe(48),
              "INITIAL_ADMIN_EMAIL": "operator@example.com",
              "INITIAL_ADMIN_PASSWORD": secrets.token_urlsafe(24),
              "LIBRERUN_STUB_LLM": "true",
              # The backend's store key; the gateway's is another (K7-15).
              "LIBRERUN_BACKEND_SECRETS_KEY": fernet(),
              # A database and a role named other than the defaults, and
              # other than each other, as a deployment from before
              # blueprint S2 pins its own: the page's commands must read
              # the names, never spell them (Codex's finding on #196).
              "POSTGRES_DB": "br_pinned_db",
              "POSTGRES_USER": "br_pinned_user",
          }
          gateway_key = fernet()
          assert gateway_key != wanted["LIBRERUN_BACKEND_SECRETS_KEY"]
          path = pathlib.Path(".env")
          lines = path.read_text(encoding="utf-8").splitlines()
          changed = []
          for index, line in enumerate(lines):
              match = re.match(r"^([A-Z][A-Z0-9_]*)=", line)
              if match and match.group(1) in wanted:
                  lines[index] = f"{match.group(1)}={wanted[match.group(1)]}"
                  changed.append(match.group(1))
          # Every one must be an EXISTING uncommented line of the example.
          assert sorted(changed) == sorted(wanted), (
              f"expected to edit {sorted(wanted)} in place, edited {sorted(changed)}"
          )
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          gateway_env = pathlib.Path("gateway.env")
          gateway_env.touch(mode=0o600)
          gateway_env.write_text(f"LIBRERUN_GATEWAY_SECRETS_KEY={gateway_key}\n", encoding="utf-8")
          for value in (wanted["APP_SECRET_KEY"], wanted["INITIAL_ADMIN_PASSWORD"],
                        wanted["LIBRERUN_BACKEND_SECRETS_KEY"], gateway_key):
              print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SMOKE_ADMIN_EMAIL={wanted['INITIAL_ADMIN_EMAIL']}\n")
              env_file.write(f"SMOKE_ADMIN_PASSWORD={wanted['INITIAL_ADMIN_PASSWORD']}\n")
          print(f"edited in place: {sorted(changed)}; gateway.env holds the gateway's store key")
          PY
          test "$(stat -c %a .env)" = 600
          test "$(stat -c %a gateway.env)" = 600
          # The helpers every step below asks the API through, on the
          # backend's loopback port.
          mkdir -p backup
          cat > backup/br.py <<'PY'
          """backup-restore's helpers: the API on the backend's loopback port."""
          import hashlib, json, os, subprocess, time, urllib.error, urllib.request

          BASE = "http://127.0.0.1:8000/api/v1"
          SECRET = "auth.azure_client_secret"
          PROVIDER = "anthropic"


          def call(method, path, body=None, token=None):
              data = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request(BASE + path, data=data, method=method)
              request.add_header("Content-Type", "application/json")
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  return error.code, json.loads(raw) if raw else None


          def token():
              status, body = call("POST", "/auth/login", {
                  "email": os.environ["SMOKE_ADMIN_EMAIL"], "password": os.environ["SMOKE_ADMIN_PASSWORD"]})
              assert status == 200, ("sign-in", status)
              return body["access_token"]


          def secret_state(token_):
              status, rows = call("GET", "/admin/settings", token=token_)
              assert status == 200, ("GET /admin/settings", status)
              return next(row for row in rows if row["key"] == SECRET)["secret"]


          def report(token_, holds, seconds=120):
              """The gateway's report, once holds(report) is true."""
              deadline = time.time() + seconds
              while True:
                  status, body = call("GET", "/admin/providers", token=token_)
                  assert status == 200, ("GET /admin/providers", status)
                  if holds(body):
                      return body
                  assert time.time() < deadline, f"the gateway's report never held: {body}"
                  time.sleep(3)


          def entry(body, name=PROVIDER):
              return next(e for e in body["providers"] if e["name"] == name)


          def written_after(body, moment):
              """Whether the report was written after `moment`, both ISO 8601."""
              from datetime import datetime

              def parse(value):
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))

              return bool(body.get("updated_at")) and parse(body["updated_at"]) > parse(moment)


          def spki_sha256(pem):
              """D34's fingerprint: SHA256 over the public key's SPKI DER."""
              der = subprocess.run(["openssl", "pkey", "-pubin", "-outform", "DER"], input=pem.encode(),
                                   capture_output=True, check=True).stdout
              return "SHA256:" + hashlib.sha256(der).hexdigest()


          def gateway_logged():
              """The last gateway_sealing_key fingerprint in the gateway's log."""
              log = subprocess.run(["docker", "logs", "librerun-gateway"], capture_output=True, text=True)
              found = []
              for line in (log.stdout + log.stderr).splitlines():
                  if "gateway_sealing_key" in line and "{" in line:
                      try:
                          event = json.loads(line[line.index("{"):])
                      except ValueError:
                          continue
                      if event.get("event") == "gateway_sealing_key":
                          found.append(event.get("fingerprint", ""))
              return found[-1] if found else ""


          def recipe():
              """The backup's and the restore's commands, read out of Install.md's
              "Backup and restore", never copied: a change to the page is a
              change to what this job runs."""
              import re

              text = open("docs/platform/Install.md", encoding="utf-8").read()
              start = text.index("\n### Backup and restore\n")
              section = text[start:text.index("\n## ", start + 1)]
              wanted = {
                  # Found with or without the `sh -c` that reads the names in
                  # the container, so a page that spells them again runs here
                  # and fails on the pinned names, not on this reader.
                  "dump": r"^docker exec librerun-postgres (?:sh -c ')?pg_dump .*> librerun-backup\.sql$",
                  "ready": r"^until docker exec librerun-postgres (?:sh -c ')?pg_isready .*; do sleep 2; done$",
                  "restore": r"^docker exec -i librerun-postgres (?:sh -c ')?psql .*< librerun-backup\.sql$",
              }
              found = {}
              for name, pattern in wanted.items():
                  lines = re.findall(pattern, section, re.M)
                  assert len(lines) == 1, f"'Backup and restore' has {len(lines)} {name} line(s), not one"
                  found[name] = lines[0]
              return found
          PY
          # The recipe's three commands, as the page gives them: each runs in
          # backup/, where the dump is written and read. Postgres's wait is
          # the page's own: over TCP, which the image's temporary server,
          # loading schema.sql into an empty volume, does not answer.
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "backup")
          import br

          for name, line in br.recipe().items():
              open(f"backup/{name}.sh", "w", encoding="utf-8").write(f"set -euo pipefail\n{line}\n")
              print(f"{name}: {line}")
          PY

      - name: Boot the backend and the gateway, with Postgres and the cache
        run: |
          set -euo pipefail
          ./compose.sh --profile app up -d --build backend
          ./.github/scripts/wait_healthy.sh backend 300
          ./.github/scripts/wait_healthy.sh gateway 300

      - name: A secret setting and a provider key sealed to the gateway, and what each shows
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os, pathlib, secrets, sys
          sys.path.insert(0, "backup")
          import br

          token = br.token()
          # Two throwaway canaries, made here, masked, and kept owner-only
          # for this job's own check that the dump holds neither.
          canaries = {"secret": "br-" + secrets.token_hex(24), "provider_key": "sk-br-" + secrets.token_hex(24)}
          for value in canaries.values():
              print(f"::add-mask::{value}")
          pathlib.Path("backup/canaries.json").write_text(json.dumps(canaries), encoding="utf-8")
          status, body = br.call("PUT", f"/admin/settings/{br.SECRET}", {"value": canaries["secret"]}, token)
          assert status == 200, ("set the secret", status, (body or {}).get("code"))
          state = br.secret_state(token)
          assert state["set"] and state["source"] == "runtime" and state["fingerprint"], state
          print(f"{br.SECRET}: {state['source']}, fingerprint {state['fingerprint']}")
          listing = br.report(token, lambda body: bool(body.get("public_key_pem")))
          pathlib.Path("backup/gateway-public.pem").write_text(listing["public_key_pem"], encoding="ascii")
          pathlib.Path("backup/plain.bin").write_bytes(canaries["provider_key"].encode("ascii"))
          json.dump({"secret_fingerprint": state["fingerprint"],
                     "public_key": br.spki_sha256(listing["public_key_pem"])},
                    open("backup/before.json", "w"))
          PY
          label=$(python3 -c "print(b'librerun-provider-key:v1:anthropic'.hex())")
          openssl pkeyutl -encrypt -pubin -inkey backup/gateway-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 -pkeyopt "rsa_oaep_label:$label" \
            -in backup/plain.bin -out backup/sealed.bin
          rm -f backup/plain.bin
          test "$(wc -c < backup/sealed.bin)" -eq 384 || { echo "::error::the sealed blob is not 384 bytes"; exit 1; }
          python3 - <<'PY'
          import base64, json, sys
          sys.path.insert(0, "backup")
          import br

          token = br.token()
          sealed = base64.b64encode(open("backup/sealed.bin", "rb").read()).decode()
          status, body = br.call("POST", f"/admin/providers/{br.PROVIDER}/key", {"sealed": sealed}, token)
          assert status == 202, ("seal the provider key", status, (body or {}).get("code"))
          body = br.report(token, lambda b: br.entry(b)["source"] == "runtime" and br.entry(b)["row"] == "runtime")
          fingerprint = br.entry(body)["fingerprint"]
          assert fingerprint, br.entry(body)
          before = json.load(open("backup/before.json"))
          before["provider_fingerprint"] = fingerprint
          json.dump(before, open("backup/before.json", "w"))
          logged = br.gateway_logged()
          assert logged == before["public_key"], f"the page's key {before['public_key']}, the gateway logged {logged!r}"
          print(f"{br.PROVIDER}: runtime, fingerprint {fingerprint}; sealed to {before['public_key']}")
          PY

      - name: The dump, by the page's command (pg_dump inside librerun-postgres)
        run: |
          set -euo pipefail
          umask 077
          ( cd backup && bash dump.sh )
          grep -q 'CREATE TABLE public.secrets ' backup/librerun-backup.sql || { echo "::error::the dump has no secrets table"; exit 1; }
          rows="$(docker exec librerun-postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c "SELECT count(*) FROM secrets"')"
          test "$rows" -ge 2 || { echo "::error::only $rows secrets row(s) to back up"; exit 1; }
          python3 - <<'PY'
          import json

          dump = open("backup/librerun-backup.sql", "rb").read()
          canaries = json.load(open("backup/canaries.json"))
          assert not any(value.encode() in dump for value in canaries.values()), "a canary is in the dump in plaintext"
          print(f"dumped {len(dump)} bytes; neither canary is in it as text")
          PY
          echo "the secrets table holds $rows rows"

      - name: "down -v: every volume gone"
        run: |
          set -euo pipefail
          ./compose.sh --profile app down -v
          for volume in librerun-pgdata librerun-redis-data librerun-file-storage librerun-state; do
            if docker volume inspect "$volume" > /dev/null 2>&1; then
              echo "::error::$volume survived down -v"; exit 1
            fi
          done
          echo "pgdata, the cache, file storage and state are gone"

      - name: Postgres alone on an empty volume, the dump restored into it, then the rest
        run: |
          set -euo pipefail
          ./compose.sh --profile app up -d postgres
          ( cd backup && timeout 180 bash ready.sh )
          running="$(docker ps --format '{{.Names}}' --filter name=librerun- | sort | xargs)"
          test "$running" = "librerun-postgres" || { echo "::error::more than Postgres is up before the restore: $running"; exit 1; }
          ( cd backup && bash restore.sh ) > restore.log
          date -u +%Y-%m-%dT%H:%M:%SZ > backup/restored-at.txt
          ./compose.sh --profile app up -d backend
          ./.github/scripts/wait_healthy.sh backend 300
          ./.github/scripts/wait_healthy.sh gateway 300

      - name: Both fingerprints read back, and the key the gateway seals to unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "backup")
          import br

          before = json.load(open("backup/before.json"))
          restored_at = open("backup/restored-at.txt").read().strip()
          token = br.token()
          state = br.secret_state(token)
          assert state["set"] and state["source"] == "runtime", state
          assert state["fingerprint"] == before["secret_fingerprint"], (state["fingerprint"], before["secret_fingerprint"])
          print(f"{br.SECRET}: runtime, fingerprint {state['fingerprint']}, as before the dump")
          # The report must be the restarted gateway's, written after the
          # restore, never the row the dump carried.
          body = br.report(token, lambda b: br.written_after(b, restored_at)
                           and br.entry(b)["source"] == "runtime" and br.entry(b)["row"] == "runtime")
          assert br.entry(body)["fingerprint"] == before["provider_fingerprint"], (br.entry(body), before)
          assert br.spki_sha256(body["public_key_pem"]) == before["public_key"], "the gateway seals to another key"
          assert br.gateway_logged() == before["public_key"], "the restarted gateway logged another sealing key"
          print(f"{br.PROVIDER}: runtime, fingerprint {br.entry(body)['fingerprint']}; "
                f"the gateway seals to {before['public_key']}, as before the dump")
          PY

      - name: "Negative: the same dump under a fresh backend key — rewrap --dry-run exits 3"
        run: |
          set -euo pipefail
          ./compose.sh --profile app down -v
          ./compose.sh --profile app up -d postgres
          ( cd backup && timeout 180 bash ready.sh )
          ( cd backup && bash restore.sh ) > restore-negative.log
          python3 - <<'PY'
          import base64, os, pathlib, re

          fresh = base64.urlsafe_b64encode(os.urandom(32)).decode()
          print(f"::add-mask::{fresh}")
          gateway = pathlib.Path("gateway.env").read_text(encoding="utf-8")
          assert fresh not in gateway
          path = pathlib.Path(".env")
          text, count = re.subn(r"(?m)^LIBRERUN_BACKEND_SECRETS_KEY=.*$", f"LIBRERUN_BACKEND_SECRETS_KEY={fresh}",
                                path.read_text(encoding="utf-8"))
          assert count == 1, "no LIBRERUN_BACKEND_SECRETS_KEY line to replace"
          path.write_text(text, encoding="utf-8")
          print("a fresh backend store key is in .env; the gateway's is unchanged")
          PY
          ./compose.sh --profile app up -d backend
          ./.github/scripts/wait_healthy.sh backend 300
          ./.github/scripts/wait_healthy.sh gateway 300
          code=0
          ./compose.sh --profile app exec -T backend python -m app.scripts.rewrap_secrets --dry-run \
            > rewrap.out 2> rewrap.err || code=$?
          cat rewrap.out rewrap.err
          if [ "$code" -ne 3 ]; then
            echo "::error::rewrap --dry-run exited $code under a fresh key, not 3"; exit 1
          fi
          grep -qF 'auth.azure_client_secret' rewrap.err || { echo "::error::rewrap did not name the unopenable row"; exit 1; }
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "backup")
          import br

          before = json.load(open("backup/before.json"))
          token = br.token()
          state = br.secret_state(token)
          assert state["source"] == "unreadable", state
          body = br.report(token, lambda b: br.entry(b)["source"] == "runtime" and br.entry(b)["row"] == "runtime")
          assert br.entry(body)["fingerprint"] == before["provider_fingerprint"], br.entry(body)
          print(f"{br.SECRET} reads unreadable under a fresh backend key, rewrap --dry-run exits 3 naming it; "
                f"the gateway, its key unchanged, still serves {br.PROVIDER}")
          PY

      - name: Diagnostics
        if: always()
        run: |
          mkdir -p backup-restore-artifacts
          cp restore.log restore-negative.log rewrap.out rewrap.err backup-restore-artifacts/ 2>/dev/null || true
          for service in backend gateway postgres; do
            docker logs "librerun-$service" > "backup-restore-artifacts/$service.log" 2>&1 || true
          done
          sed 's/=.*/=<redacted>/' .env > backup-restore-artifacts/env.shape 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-restore-artifacts
          path: backup-restore-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          ./compose.sh --profile app down -v || true
          rm -rf backup || true

  # ==========================================================================
  # source-build (R12, A2): every first-party image is BUILT from this
  # checkout and never pulled (#133; L37, D26). A release is source only,
  # so a service that asked a registry for its image would be asking for
  # something no release publishes. Two proofs:
  #
  #   the model   compose's resolved model, every file and profile merged,
  #               has `pull_policy: build` on each service that builds
  #               (scripts/check_pull_policy.py; the upstream images —
  #               postgres, redis, the viewer, the edge — are passed by);
  #   the start   with LIBRERUN_IMAGE_PREFIX aimed at a listener on
  #               127.0.0.1:5000, the only registry a first-party image
  #               could come from, `up -d` — no --build, which would hide a
  #               missing line — reaches /api/v1/health with six images
  #               built under that prefix and the listener asked nothing.
  #
  # Negative first: without frontend's line the checker names it, and
  # echo-agent up alone without its line makes the listener log the pull.
  # ==========================================================================
  source-build:
    runs-on: ubuntu-latest
    # Builds the platform's three images and the three examples'.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: The demo's .env (./scripts/demo.sh --env-only)
        run: ./scripts/demo.sh --env-only

      # `*` requests T1's tls profile too, which compose.sh's loopback
      # guard refuses (exit 4) without its four lines, so this one command
      # carries them; `config` builds nothing and starts nothing.
      - name: The model — every service that builds is never pulled
        run: |
          set -euo pipefail
          model() {
            BACKEND_PORT=127.0.0.1:8000 FRONTEND_PORT=127.0.0.1:3000 \
            NEXT_PUBLIC_API_URL=/api/v1 BACKEND_INTERNAL_URL=http://backend:8000 \
              ./compose.sh --profile '*' config --format json | grep -v '^Using:'
          }
          # Negative first: frontend's line gone, the checker must name it.
          cp compose.yaml compose.yaml.keep
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path("compose.yaml")
          text = path.read_text(encoding="utf-8")
          line = "/librerun-web:${LIBRERUN_IMAGE_TAG:-dev}\n    pull_policy: build\n"
          assert text.count(line) == 1, "frontend's pull_policy line is not where this double expects it"
          path.write_text(text.replace(line, "/librerun-web:${LIBRERUN_IMAGE_TAG:-dev}\n"), encoding="utf-8")
          PY
          if model | python3 scripts/check_pull_policy.py > negative.out; then
            cat negative.out
            echo "::error::with frontend's pull_policy line gone the checker stayed green"; exit 1
          fi
          grep -q 'frontend' negative.out \
            || { cat negative.out; echo "::error::the checker went red without naming frontend"; exit 1; }
          echo "negative: the checker named frontend, as it must"
          mv compose.yaml.keep compose.yaml
          # And a model in which nothing builds proves nothing: it must fail.
          if printf '%s' '{"services": {"postgres": {"image": "docker.io/library/postgres:16-alpine"}}}' \
              | python3 scripts/check_pull_policy.py; then
            echo "::error::the checker passed a model in which no service builds"; exit 1
          fi
          echo "negative: a model with no build lines was refused, as it must be"
          model | python3 scripts/check_pull_policy.py

      - name: A listener on 127.0.0.1:5000 that logs every connection
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/r12_listener.py" <<'PY'
          import datetime, socketserver

          class Log(socketserver.BaseRequestHandler):
              def handle(self):
                  try:
                      first = self.request.recv(120)
                  except OSError:
                      first = b""
                  with open("listener.log", "a", encoding="utf-8") as log:
                      log.write(f"{datetime.datetime.now(datetime.timezone.utc).isoformat()} {first!r}\n")

          socketserver.ThreadingTCPServer.allow_reuse_address = True
          with socketserver.ThreadingTCPServer(("127.0.0.1", 5000), Log) as server:
              server.serve_forever()
          PY
          : > listener.log
          nohup python3 "$RUNNER_TEMP/r12_listener.py" > "$RUNNER_TEMP/listener.out" 2>&1 &
          for attempt in $(seq 1 20); do
            if python3 -c 'import socket; socket.create_connection(("127.0.0.1", 5000), 2).close()'; then break; fi
            sleep 0.5
          done
          # That probe is the listener's own first line; the log starts empty.
          sleep 1; : > listener.log
          echo "listening on 127.0.0.1:5000"

      - name: "Negative first: echo-agent up alone without its line — the listener logs the pull"
        env:
          LIBRERUN_IMAGE_PREFIX: 127.0.0.1:5000/r12
        run: |
          set -uo pipefail
          cp agents.compose.yaml agents.compose.yaml.keep
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path("agents.compose.yaml")
          text = path.read_text(encoding="utf-8")
          line = "/librerun-example-echo:${LIBRERUN_IMAGE_TAG:-dev}\n    pull_policy: build\n"
          assert text.count(line) == 1, "echo-agent's pull_policy line is not where this double expects it"
          path.write_text(text.replace(line, "/librerun-example-echo:${LIBRERUN_IMAGE_TAG:-dev}\n"), encoding="utf-8")
          PY
          ./compose.sh --profile demo up -d --no-deps echo-agent > negative-up.log 2>&1 || true
          ./compose.sh --profile demo rm -sf echo-agent > /dev/null 2>&1 || true
          mv agents.compose.yaml.keep agents.compose.yaml
          if [ ! -s listener.log ]; then
            tail -20 negative-up.log
            echo "::error::echo-agent without pull_policy: build started without asking the listener — the double proves nothing"; exit 1
          fi
          echo "negative: the listener logged the pull, as it must:"; cat listener.log
          : > listener.log

      - name: The start — up -d, no --build, six images built and nothing pulled
        env:
          LIBRERUN_IMAGE_PREFIX: 127.0.0.1:5000/r12
        run: |
          set -euo pipefail
          ./compose.sh --profile app --profile viewer --profile demo up -d
          for attempt in $(seq 1 120); do
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null; then
              echo "backend answering on the published port"; break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "::error::the backend never answered on :8000"
              ./compose.sh --profile app logs --no-color --tail 80 backend
              exit 1
            fi
            sleep 5
          done
          built=$(docker image ls --format '{{.Repository}}' | grep '^127\.0\.0\.1:5000/r12/' | sort -u)
          printf 'built under the prefix:\n%s\n' "$built"
          count=$(printf '%s\n' "$built" | grep -c . || true)
          if [ "$count" -ne 6 ]; then
            echo "::error::expected six images built under 127.0.0.1:5000/r12, found $count"; exit 1
          fi
          if [ -s listener.log ]; then
            cat listener.log
            echo "::error::the listener was asked for an image: a first-party service was pulled"; exit 1
          fi
          echo "six images built under the prefix, and the listener was asked nothing"

      - name: Tear down
        if: always()
        run: ./compose.sh --profile app --profile viewer --profile demo down -v || true
