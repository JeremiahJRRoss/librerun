# __AGENT_NAME__ — a TypeScript container agent serving Run Contract v1
# itself. Scaffolded by `librerun init __AGENT_ID__ --template container-ts`.
# Field reference: docs/authoring/Manifest.md.
manifest_version: 1

id: __AGENT_ID__
name: __AGENT_NAME__
description: >-
  A TypeScript container agent: the Vercel AI SDK's generateText answers
  a question through the platform gateway (the `answer` step below) and
  falls back to a deterministic reply when no model answers, so the
  agent runs keyless too and says which of the two answered. It serves
  Run Contract v1 itself — no LibreRun package is needed.

runtime: container
# The badge on the agent's card (S7); a label only, the chassis never
# dispatches on it.
framework: vercel-ai-sdk
container:
  # The compose service `librerun init` appended to agents.compose.yaml,
  # on the internal `agents` network. A literal, so no chassis variable
  # is needed; a deployment that hosts the container elsewhere edits it.
  url: http://__SERVICE__:8090
input_schema: input_schema.json

phases:
  - name: answer
    deadline_seconds: 300
    # The run page's labels for the progress rows this phase reports (the
    # `progress` events server.ts emits with `step_id: STEP`). A row
    # declared nowhere still shows, under its raw id.
    steps:
      - id: answer
        label: Answering the question

output:
  mode: structured

# The grants. `llm` is what lets the gateway answer this agent's model
# calls at all; `pii` is the intake redaction pipeline on demand — the
# MCP `redact` tool at run.mcp.url, which server.ts calls for anything
# the agent fetched itself.
capabilities: [llm, pii]

# Tool secrets: a key of this agent's own for a service it calls (a
# search API, a vector store), named here and valued per tenant on the
# agent page's Secrets tab — never a model provider's key, which the
# gateway alone holds. No grant is needed, and none is declared: add the
# line below and server.ts reads it with
# `await secretGet(mcpUrl, bearer, "search_api_key")`, null until set.
# secrets: [search_api_key]

# The one model call this agent makes. Every value here is a DEFAULT: the
# admin agent-configuration page edits provider, model, temperature and
# limits per step, and the gateway resolves them at request time (L25,
# D13) — a model change restarts nothing. A step id the manifest does
# not declare is refused (400 unknown_step).
llm:
  steps:
    - id: answer
      label: "The answer"
      description: Answers the question; the rule in server.ts is the fallback.
      provider: openai
      model: gpt-4o-mini
      temperature: 0.2
      max_tokens: 400
      timeout_seconds: 60

# network:
#   egress: true   # only if the compose service also joins `egress`

scenarios: scenarios
