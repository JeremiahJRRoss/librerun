# The licence scope map in machine-readable form (REUSE specification
# 3.3). docs/release/License_Scope_Map.md is the same map in prose, with
# the reasons; NOTICE is the notice that travels with the code.
#
# How it reads: every tracked file is matched by the LAST annotation
# below whose path matches it. `precedence = "closest"` lets a file's own
# SPDX header speak for it first, as the scripts' headers do.
#
# The copyright line is qualified on purpose, and it is the whole claim:
# Jeremiah Ross claims copyright only to the extent it subsists in
# first-party material and is his. Much of the tree was produced by AI
# coding agents at his direction; no copyright is claimed in
# AI-generated material that is not eligible for protection, and no
# line here says who typed what. Contributors keep the copyright in
# their contributions (CONTRIBUTING.md), which the second line records.
#
# What is NOT covered, on purpose: a directory under backend/agents/
# other than vita_v1/ and _examples/. `librerun init` scaffolds a
# user's own agent there, and that agent is its author's to license.
version = 1
SPDX-PackageName = "LibreRun"
SPDX-PackageSupplier = "Jeremiah Ross <dev@librerun.dev>"

# ---- First-party material: AGPL-3.0-only -------------------------------
[[annotations]]
path = [
  "*",
  ".github/**",
  "backend/*",
  "backend/adapter_kit/**",
  "backend/alembic/**",
  "backend/app/**",
  "backend/db/**",
  "backend/tests/**",
  "backend/agents/*",
  "backend/agents/vita_v1/**",
  "cli/**",
  "config/**",
  "docs/**",
  "frontend/**",
  "scripts/**",
  "services/**",
  "tls/**",
]
precedence = "closest"
SPDX-FileCopyrightText = [
  "2026 Jeremiah Ross, to the extent copyright subsists in first-party material and such copyright is owned by Jeremiah Ross (see NOTICE)",
  "LibreRun contributors, each in their own contributions, as the version history records",
]
SPDX-License-Identifier = "AGPL-3.0-only"

# ---- The four carve-outs: Apache-2.0 (NOTICE; §7 item 7) ---------------
# An agent imports the SDK and adapters and starts from a template or an
# example; none of them hands the author's agent the AGPL.
[[annotations]]
path = [
  "sdk/**",
  "backend/adapters/**",
  "cli/src/librerun/templates/**",
  "backend/agents/_examples/**",
]
precedence = "closest"
SPDX-FileCopyrightText = [
  "2026 Jeremiah Ross, to the extent copyright subsists in first-party material and such copyright is owned by Jeremiah Ross (see NOTICE)",
  "LibreRun contributors, each in their own contributions, as the version history records",
]
SPDX-License-Identifier = "Apache-2.0"

# ---- Alembic's scaffold (MIT) --------------------------------------------
# Copied from Alembic 1.20.0's templates, unmodified.
[[annotations]]
path = ["backend/alembic/README", "backend/alembic/script.py.mako"]
precedence = "override"
SPDX-FileCopyrightText = "2009-2026 Michael Bayer"
SPDX-License-Identifier = "MIT"

# Generated by Alembic from the same templates, then edited here.
[[annotations]]
path = ["backend/alembic.ini", "backend/alembic/env.py"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2009-2026 Michael Bayer",
  "2026 Jeremiah Ross, to the extent copyright subsists in first-party material and such copyright is owned by Jeremiah Ross (see NOTICE)",
]
SPDX-License-Identifier = "MIT AND AGPL-3.0-only"

# ---- The Contributor Covenant 2.1 (CC BY 4.0) ---------------------------
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant (https://www.contributor-covenant.org)"
SPDX-License-Identifier = "CC-BY-4.0"

# ---- GitHub's gitignore templates (CC0 1.0), with first-party lines ------
[[annotations]]
path = ".gitignore"
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Jeremiah Ross, to the extent copyright subsists in first-party material and such copyright is owned by Jeremiah Ross (see NOTICE)",
  "LibreRun contributors, each in their own contributions, as the version history records",
]
SPDX-License-Identifier = "CC0-1.0 AND AGPL-3.0-only"

# ---- Files that quote SPDX tags as text ----------------------------------
# `reuse` reads a tag on any line, so a checker, a probe or a document
# that QUOTES one would otherwise be read as declaring it. These are
# first-party and AGPL-3.0-only like their neighbours; `override` says
# so without letting the quoted text speak for the file.
[[annotations]]
path = [
  ".github/workflows/release-readiness.yml",
  "scripts/check_licensing.py",
  "scripts/licensing_probes.sh",
  "docs/release/License_Scope_Map.md",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Jeremiah Ross, to the extent copyright subsists in first-party material and such copyright is owned by Jeremiah Ross (see NOTICE)",
  "LibreRun contributors, each in their own contributions, as the version history records",
]
SPDX-License-Identifier = "AGPL-3.0-only"
